id: login-success
title: 로그인 성공 → 메인 셸 진입
locale: ru                          # localStorage languageType=lng_type_2 고정
login_as: tester
on_failure: stop
defaults: { timeout_ms: 8000 }
steps:
  - action: navigate
    url: /                          # 로그인은 루트 (검증됨, /login 아님)
  - action: fill
    target: { css: "#userId", placeholder: "ИНН" }
    value: "${secrets.tester.username}"
  - action: fill
    target: { css: "#pswd", placeholder: "Ваш пароль" }
    value: "${secrets.tester.password}"
  - action: click
    target: { text: "Sign In", role: button }      # 하드코딩 영문 → 로케일 무관
  - action: wait_for
    target: { css: "#v_sidebar", description: "좌측 메뉴 사이드바" }
    timeout_ms: 12000
  - action: assert_visible
    target: { css: "#v_header" }     # 구조 랜드마크 → 언어 무관 로그인 검증
  - action: screenshot
    name: after-login
    save: true
