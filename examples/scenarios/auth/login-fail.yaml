id: login-fail-wrong-password
title: 로그인 실패(오답 비번) → 에러 메시지 표시 & 셸 진입 안 함
locale: ru
on_failure: stop
defaults: { timeout_ms: 8000 }
steps:
  - action: navigate
    url: /
  - action: fill
    target: { css: "#userId", placeholder: "ИНН" }
    value: "${secrets.tester.username}"
  - action: fill
    target: { css: "#pswd", placeholder: "Ваш пароль" }
    value: "wrong-password-xyz"       # 의도적 오답 (시크릿 아님 — 음성 테스트)
  - action: click
    target: { text: "Sign In", role: button }
  # 기대 동작: 에러 메시지(PrimeVue Message, t('10453'))가 뜨고 로그인 화면에 머무름
  - action: assert_visible
    target: { css: ".p-message-error", description: "로그인 실패 에러 메시지(잘못된 ID/비번)" }
  - action: assert_visible
    target: { css: "#userId", description: "여전히 로그인 입력칸이 보임(셸로 안 넘어감)" }
  - action: screenshot
    name: login-error
    save: true
