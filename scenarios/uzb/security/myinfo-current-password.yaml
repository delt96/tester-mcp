id: uzb-myinfo-current-password
title: "[상원 dev] 내정보 비밀번호 변경은 현재 비밀번호가 없거나 틀리면 거부된다 (실제 변경은 하지 않는다)"
tags: [uzb, security, password]
login_as: editor
precondition: "⚠ uzb 는 탭 간 토큰을 localStorage 로 동기화하므로 반드시 --concurrency 1 로 돌린다(병렬이면 마지막 로그인 계정으로 섞인다). 공유 개발 DB 의 editor 비밀번호를 바꾸면 안 된다 — 성공 경로는 실행하지 않는다. 21199 는 locales 재추출 전이라 키 번호로 보일 수 있다"
steps:
  - { action: assert_visible, target: { css: "#v_header", text: "Editor", description: "헤더에 표시된 로그인 사용자명 — 다른 계정으로 섞였는지 확인" } }
  - { action: navigate, url: "/myPage/myInfo" }
  - { action: wait_for, target: { css: "input[autocomplete='current-password']", description: "현재 비밀번호 입력칸(신규)" } }
  - { action: screenshot, name: "myinfo-form" }
  # 1) 현재 비밀번호 없이 저장 → 화면 검사에서 막혀 확인 팝업이 뜨지 않아야 한다
  - { action: click, target: { css: "tr:has(input[autocomplete='current-password']) + tr td:nth-of-type(1) input[type='password']", description: "비밀번호 변경 입력칸(현재 비밀번호 다음 행 왼쪽)" } }
  - { action: fill, target: { css: "tr:has(input[autocomplete='current-password']) + tr td:nth-of-type(1) input[type='password']" }, value: "E2eTest1!" }
  - { action: assert_value, target: { css: "tr:has(input[autocomplete='current-password']) + tr td:nth-of-type(1) input[type='password']" }, value: "E2eTest1!" }
  - { action: click, target: { css: "tr:has(input[autocomplete='current-password']) + tr td:nth-of-type(2) input[type='password']", description: "비밀번호 확인 입력칸(같은 행 오른쪽)" } }
  - { action: fill, target: { css: "tr:has(input[autocomplete='current-password']) + tr td:nth-of-type(2) input[type='password']" }, value: "E2eTest1!" }
  - { action: assert_value, target: { css: "tr:has(input[autocomplete='current-password']) + tr td:nth-of-type(2) input[type='password']" }, value: "E2eTest1!" }
  - { action: click, target: { css: ".btn_group_fixed .btn_primary", description: "저장 버튼" } }
  - { action: screenshot, name: "missing-current" }
  - { action: assert_not_visible, target: { css: ".p-confirmpopup", description: "저장 확인 팝업 — 현재 비밀번호가 비었으니 떠서는 안 된다" } }
  # 2) 틀린 현재 비밀번호 → 서버가 400(21199) 으로 거부, 오류 토스트
  - { action: click, target: { css: "input[autocomplete='current-password']", description: "현재 비밀번호 칸" } }
  - { action: fill, target: { css: "input[autocomplete='current-password']" }, value: "definitely-wrong-1!" }
  - { action: click, target: { css: ".btn_group_fixed .btn_primary", description: "저장 버튼" } }
  - { action: wait_for, target: { css: ".p-confirmpopup", description: "저장 확인 팝업" } }
  - { action: click, target: { css: ".p-confirmpopup-accept-button, .p-confirmpopup .p-button:not(.p-button-secondary)", description: "확인 팝업의 수락(예) 버튼" } }
  - { action: wait_for, target: { css: ".p-toast-message-error", description: "서버 거부 오류 토스트" } }
  - { action: screenshot, name: "wrong-current" }
  - { action: assert_visible, target: { css: ".p-toast-message-error", text: "21199", description: "21199(현재 비밀번호 불일치) 토스트 — locales 재추출 후에는 번역 문구로 보인다" } }
