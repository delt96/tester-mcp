id: external-insert-unassigned-warn
title: 외부문서 작성 - 유효 수신자 1명 + 빈 수신자 행이 섞이면 미지정 경고(11001)로 등록 차단
locale: ru
login_as: tester
ephemeral: true
precondition: >
  mv_signer_autocomplete에 최소 1명 이상 존재해야 함(드롭다운 첫 항목 선택).
  신규 다국어 키 11001은 아직 DB→json 미동기화 상태라 토스트에 raw 키 "11001"이 그대로 표시됨
  (동기화 후에는 번역문이 표시되어 본 텍스트 단언은 실패하게 됨 — 그 경우 시나리오의 assert 텍스트를 갱신).
steps:
  - { action: navigate, url: "/main/letter/external/insert" }
  - { action: wait_for, target: { css: ".btn_outline_primary", description: "외부문서 작성 하단 등록 버튼(@click=fn_register)" } }
  # 1) 타입 선택 (DMT02=정보용, 기한 불필요) — resolver의 type 검증 통과용
  - { action: click, target: { css: "input[type='radio'][value='DMT02']", description: "문서 타입 라디오 DMT02(정보용). id는 ExternalDocFormInc가 인스턴스별로 생성하므로 value로 지목" } }
  # 2) 제목 입력 — resolver의 subTitle 검증 통과용
  - { action: fill, target: { css: ".main_section .sub_title_area input.form_control", description: "제목 입력(v-model subTitle)" }, value: "E2E unassigned recipient check" }
  # 3) 첫 수신자 지정: PrimeVue AutoComplete dropdown 버튼 클릭 → 오버레이 첫 항목 선택
  - { action: click, target: { css: ".recipients .p-autocomplete-dropdown", description: "첫 수신자 자동완성 드롭다운 버튼" } }
  - { action: wait_for, target: { css: ".user-autocomplete-overlay .list-item", description: "수신자 자동완성 오버레이 항목 목록" } }
  - { action: click, target: { css: ".user-autocomplete-overlay .list-item", description: "자동완성 첫 번째 사용자 항목" } }
  # 4) 빈 수신자 행 추가 (지정하지 않음) → assigned 1 + unassigned 1 상태
  - { action: click, target: { css: ".recipient_top button.text_blue", description: "수신자 추가 버튼(@click=add_recipient)" } }
  # 5) 등록 시도 → 미지정 수신자 경고로 차단되어야 함
  - { action: click, target: { css: ".btn_outline_primary", role: "button", description: "등록 버튼" } }
  # 6) 토스트에 미지정 수신자 경고 키(11001) 노출 즉시 검증 (ephemeral)
  - { action: assert_visible, target: { text: "11001", description: "warn toast: 미지정 수신자 경고(키 11001, 미동기화라 raw 키 표시). 클릭 직후 즉시 DOM 텍스트 검증, screenshot 생략" } }
