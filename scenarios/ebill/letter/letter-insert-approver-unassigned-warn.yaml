id: letter-insert-approver-unassigned-warn
title: 공문 작성 - 유효 승인자 1명 + 빈 승인자 행이 섞이면 미지정 경고(11002)로 등록 차단 (VITE_ENABLE_SIGN=false에서도 동작)
locale: ru
login_as: tester
ephemeral: true
precondition: >
  mv_signer_autocomplete에 최소 1명 이상 존재(드롭다운 첫 항목 선택용).
  VITE_ENABLE_SIGN=false 환경 — 승인자 미지정 검증이 sign 게이트 밖으로 빠졌는지 확인하는 것이 핵심.
  수신자는 유효 1명만 지정(빈 행 없음)해 recipients 검증을 통과시키고, 승인자에서만 미지정 행을 만든다.
  신규 키 11002는 DB→json 미동기화라 토스트에 raw 키 "11002"가 표시됨(동기화 후엔 번역문 → assert 텍스트 갱신 필요).
steps:
  - { action: navigate, url: "/main/letter/insert" }
  - { action: wait_for, target: { css: "#DMT02", description: "문서 타입 라디오 DMT02(comCode 1022, v-model types)" } }
  # 1) 타입/제목 — resolver의 types, subTitle 통과
  - { action: click, target: { css: "#DMT02", description: "문서 타입 DMT02 선택" } }
  - { action: fill, target: { css: ".sub_title_area input.form_control", description: "제목 입력(v-model subTitle)" }, value: "E2E approver unassigned check" }
  # 2) 수신자 1명만 지정(빈 행 없음) → recipients 검증 통과
  - { action: click, target: { css: ".recipients .p-autocomplete-dropdown", description: "수신자 자동완성 드롭다운 버튼" } }
  - { action: wait_for, target: { css: ".user-autocomplete-overlay .list-item", description: "수신자 자동완성 오버레이 항목" } }
  - { action: click, target: { css: ".user-autocomplete-overlay .list-item", description: "수신자 첫 항목 선택" } }
  # 3) 승인자 1명 지정(기본 행)
  - { action: wait_for, target: { css: ".approve_section .p-autocomplete-dropdown", description: "승인자 섹션 자동완성 드롭다운 버튼(페이지 하단, 스크롤 필요)" } }
  - { action: click, target: { css: ".approve_section .p-autocomplete-dropdown", description: "승인자 자동완성 드롭다운 버튼" } }
  - { action: wait_for, target: { css: ".user-autocomplete-overlay .list-item", description: "승인자 자동완성 오버레이 항목" } }
  - { action: click, target: { css: ".user-autocomplete-overlay .list-item", description: "승인자 첫 항목 선택" } }
  # 4) 빈 승인자 행 추가(지정 안 함) → assigned 1 + unassigned 1
  - { action: click, target: { css: ".approve_top button.text_blue", description: "승인자 추가 버튼(@click=add_approve)" } }
  # 5) 등록 시도 → 미지정 승인자 경고로 차단되어야 함
  - { action: click, target: { css: ".btn_primary", role: "button", description: "등록 버튼(@click=register)" } }
  # 6) 토스트에 미지정 승인자 경고 키(11002) 노출 즉시 검증 (ephemeral)
  - { action: assert_visible, target: { text: "11002", description: "warn toast: 미지정 승인자 경고(키 11002, 미동기화라 raw 키 표시). 클릭 직후 즉시 검증, screenshot 생략" } }
