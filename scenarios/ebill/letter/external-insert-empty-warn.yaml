id: external-insert-empty-warn
title: 외부문서 작성에서 빈 폼으로 등록 시 검증 warn toast
locale: ru
login_as: tester
ephemeral: true
steps:
  - { action: navigate, url: "/main/letter/external/insert" }
  - { action: wait_for, target: { css: ".btn_outline_primary", description: "외부문서 작성 하단 등록 버튼(@click=fn_register, t10493)" } }
  - { action: click, target: { css: ".btn_outline_primary", role: "button", description: "등록 버튼" } }
  - { action: assert_visible, target: { text: "Выберите тип", description: "warn toast: 빈 폼 등록 시 타입 선택 요구(우하단 노랑). 3초 후 자동소멸하므로 클릭 직후 즉시 DOM 텍스트 검증. screenshot은 생략(ephemeral toast라 캡처 레이스 → 무한 재시도 유발)" } }
