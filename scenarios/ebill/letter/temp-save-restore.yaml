id: temp-save-restore
title: 문서등록 임시저장 → 불러오기 모달 → 제자리 복원(제목·서식·승인자)
locale: ru
login_as: tester
precondition: >
  kgst.eas_temp_draft 테이블 존재, 백엔드(8081)/프론트(5173) 기동.
  서식 "웹에디터 테스트용2222"(formId 306) 존재, 승인자 자동완성에 1명 이상 존재.
  CKEditor(content* 필드) 본문은 iframe이라 DSL로 못 채워 제외(수동/JS 검증).
  서식 선택 + 부제목 + 승인자(autocomplete)까지 저장→reload→복원을 검증한다.
on_failure: continue
steps:

  - { action: navigate, url: "/main/letter/insert" }
  - { action: wait_for, target: { css: "select.form_control.full", description: "서식 선택 드롭다운" } }
  - { action: fill, target: { css: "select.form_control.full", description: "서식 select. 값 306 = 웹에디터 테스트용2222" }, value: "306" }
  - { action: wait_for, target: { css: ".document_section .common_area", description: "선택 서식의 동적 필드 영역(로드 완료 신호)" } }

  - { action: fill, target: { css: ".sub_title_area input", description: "부제목 입력란" }, value: "YamlE2E_0601" }

  - { action: click, target: { css: ".approve_section .p-autocomplete-dropdown", description: "승인자 autocomplete 드롭다운 버튼" } }
  - { action: wait_for, target: { css: ".p-autocomplete-overlay .p-autocomplete-option", description: "승인자 자동완성 옵션 목록" } }
  - { action: click, target: { css: ".p-autocomplete-overlay .p-autocomplete-option", description: "목록의 첫 승인자 옵션 선택" } }
  - { action: screenshot, name: "01-filled-with-approver" }

  - { action: click, target: { css: ".temp_save_fab", description: "우하단 플로팅 임시저장 버튼(@click=tempSave)" } }

  - { action: navigate, url: "/main/letter/insert" }
  - { action: wait_for, target: { css: ".temp_load_btn", description: "헤더 불러오기 버튼" } }

  - { action: click, target: { css: ".temp_load_btn", description: "상단 헤더 불러오기 버튼(@click=openTempList)" } }
  - { action: wait_for, target: { css: ".p-dialog table.basic_table tbody tr", description: "불러오기 모달의 목록 행" } }
  - { action: assert_visible, target: { css: ".p-dialog", text: "YamlE2E_0601", description: "모달 목록에 방금 저장한 제목이 보여야 함 → 저장+목록 성공" } }
  - { action: assert_visible, target: { css: ".p-dialog", text: "웹에디터 테스트용2222", description: "모달 목록에 서식명이 보여야 함 → formTitle 저장 확인" } }
  - { action: screenshot, name: "02-modal-list" }

  - { action: click, target: { css: ".p-dialog table.basic_table tbody tr:first-child td.action_cell button:first-child", description: "모달 첫 행 불러오기 버튼(첫 버튼=loadDraft)" } }
  - { action: wait_for, target: { css: ".document_section .common_area", description: "복원 후 동적 필드 영역 재렌더(서식 306 복원)" } }
  - { action: assert_visible, target: { css: ".sub_title_area input", description: "부제목 입력란 value가 'YamlE2E_0601'로 복원되어 있어야 함(input value 확인)" } }
  - { action: assert_visible, target: { css: ".approve_section .p-autocomplete input", description: "승인자 autocomplete input value가 비어있지 않아야 함(승인자명 복원). 수정 전엔 빈 칸 → userName 저장/복원 검증" } }
  - { action: screenshot, name: "03-restored-with-approver" }

  - { action: click, target: { css: ".temp_load_btn", description: "불러오기 모달 재오픈(정리용)" } }
  - { action: wait_for, target: { css: ".p-dialog table.basic_table tbody tr", description: "모달 목록" } }
  - { action: click, target: { css: ".p-dialog table.basic_table tbody tr:first-child td.action_cell button:last-child", description: "첫 행 삭제 버튼(둘째 버튼=deleteDraft)" } }
