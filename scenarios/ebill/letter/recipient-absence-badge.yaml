id: recipient-absence-badge
title: 수신자 자동완성 — 부재 배지 표시 및 부재자 선택 차단
locale: ru
login_as: tester
ephemeral: true
steps:
  - { action: navigate, url: "/main/letter/insert" }
  - { action: wait_for, target: { ref: recipient_ac_input, description: "수신자 자동완성 입력창 (AddRecipientComponent > AutoCompleteUserInput)" } }

  # 드롭다운 버튼으로 전체 목록을 연다 (검색어 없이 ~38명)
  - { action: click, target: { ref: recipient_ac_dropdown, description: "수신자 자동완성 드롭다운 버튼" } }
  - { action: wait_for, target: { ref: user_ac_option, description: "오버레이에 렌더된 사용자 옵션 목록" } }

  # 1) 부재 배지가 렌더되는가
  # locales json에 11118/11119/11120이 아직 동기화되지 않아 라벨은 키 원문(예: "11118 · 7/24~7/31")으로 보인다.
  # 키가 그대로 보이는 것 자체가 t() 매핑이 호출되고 있다는 증거이며, 기간 포맷은 정상 검증 대상이다.
  - { action: assert_visible, target: { ref: user_ac_absence_badge, description: "부재 배지 (회색 pill). 국회의장/부의장/사무총장/국회의원2 등 6명에게 표시되어야 함" } }
  - { action: screenshot, name: "absence-badges" }

  # 2) 부재자를 클릭해도 선택되지 않는가 (Layer 2: 슬롯 @click.stop)
  - { action: click, target: { ref: user_ac_option_absent, description: "부재자 옵션 (회색 처리된 .list-item.is-absent)" } }
  - { action: assert_visible, target: { ref: user_ac_option, description: "부재자 클릭 후에도 목록이 열려 있어야 한다 — 선택되었다면 오버레이가 닫혔을 것" } }
  - { action: assert_value, target: { ref: recipient_ac_input, description: "부재자를 클릭했으므로 입력창은 여전히 비어 있어야 한다" }, value: "" }
  - { action: screenshot, name: "absent-click-blocked" }

  # 3) 정상 사용자는 여전히 선택되는가 (회귀 확인)
  - { action: click, target: { ref: user_ac_option_normal, description: "배지 없는 정상 사용자 옵션" } }
  - { action: screenshot, name: "normal-select-ok" }
