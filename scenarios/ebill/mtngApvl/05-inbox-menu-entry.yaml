id: mtng-apvl-inbox-menu-entry
title: 승인 대기함 — 회의 메뉴 권한 없는 계정(GD)의 사이드바 노출 및 메뉴 진입
locale: ru
login_as: gduser
tags: [mtngApvl]
precondition: >
  gduser(GD 권한, employee_position_history.id=9)는 위원회회의관리(menu_cd 28) 매핑이 없고
  승인 대기함(menu_cd 150)만 보유 — 2026-07-30 DB 확인: GD는 27(그룹)/30/142/150.
  com_dept_menu 매핑이 실행된 상태여야 한다(미실행이면 메뉴 자체가 안 보여 NOT_TESTED).
  비파괴 — 조회만 한다.
  ⚠ locales json에 신규 lng 11146~11151이 아직 동기화되지 않아 화면 제목·컬럼 헤더·배지는
  키 번호("11146" 등)로 표시된다. 사이드바 메뉴명은 com_menu에서 오므로 정상 표시된다.
  따라서 라벨 텍스트가 아니라 구조/클래스로 검증한다.
steps:
  - { action: navigate, url: "/main" }
  - { action: wait_for, target: { ref: sidebar, description: "좌측 사이드바" } }
  - { action: screenshot, name: "05-sidebar-before-expand" }
  - action: click
    target: { ref: sidebar_menu_depth1, text: "Управление заседаниями", description: "회의관리 그룹 아코디언 펼치기" }
  - { action: wait_for, target: { ref: sidebar_menu_depth2, description: "2단 메뉴 렌더" } }
  - { action: screenshot, name: "05-sidebar-expanded" }
  - action: assert_visible
    target: { ref: sidebar_menu_depth2, text: "Заседания, ожидающие согласования", description: "승인 대기함 메뉴가 GD 계정에 노출됨" }
  - action: click
    target: { ref: sidebar_menu_depth2, text: "Заседания, ожидающие согласования", description: "승인 대기함 메뉴 클릭 → /main/mtng/apvlInbox" }
  - { action: wait_for, target: { ref: datatable, description: "대기함 DataTable 렌더" } }
  - { action: assert_visible, target: { ref: board_total_num, description: "총건수 영역" } }
  - { action: screenshot, name: "05-inbox-loaded" }
