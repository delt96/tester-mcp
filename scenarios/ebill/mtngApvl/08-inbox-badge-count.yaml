id: mtng-apvl-inbox-badge-count
title: 회의 승인 대기함 — 사이드바 알림 카운트 배지 (내 차례 건수)
locale: ru
login_as: gduser
tags: [mtngApvl]
precondition: >
  mtngId=848은 statCd '3'(DRAFT) 위원회 회의. gduser를 단일 서명자로 지정해 요청하면
  본인이 곧 SENT(내 차례)가 되어 배지 카운트가 1이 된다.
  배지는 SENT만 센다(목록은 SENT+PENDING) — 기존 eas countApprovalList와 동일한 관행.
  ⚠ 복원 가능: 마지막에 승인 요청을 취소하므로 회의는 statCd '3'(DRAFT)로 되돌아가고
  req는 CANCELED로 남는다(이력 보존 설계). 승인하지 않으므로 회의 상태 영구 변경 없음.
  카운트 갱신 지점: 요청/취소/승인/반려 4개 액션 후 + 대기함 목록 조회 시.
steps:
  # --- 요청 생성 (본인이 SENT가 됨) ---
  - { action: navigate, url: "/main/mtng/cmtMtng/detail?mtngId=848" }
  - { action: wait_for, target: { ref: mtapv_section } }
  - { action: click, target: { ref: mtapv_assign_btn } }
  - { action: wait_for, target: { ref: mapvl_modal_tabs } }
  - { action: fill, target: { ref: mapvl_search_input }, value: "gduser" }
  - { action: wait_for, target: { ref: mapvl_user_row, description: "검색 결과 행 (디바운스 350ms 후 로드)" } }
  - { action: click, target: { ref: mapvl_user_row_first, description: "gduser1 L 본인 선택" } }
  # 선택이 반영되지 않으면 fnSave가 토스트만 띄우고 리턴하므로(SignerSelectModal.vue:127-130)
  # 이후 저장/요청 클릭이 전부 무효가 된다 — 여기서 반드시 끊고 확인한다
  - { action: assert_visible, target: { ref: mapvl_chip_num, text: "1", description: "선택 칩 순번 1" } }
  - { action: click, target: { ref: mapvl_save_btn, description: "모달 저장 → PUT /bill/mtng/apvl/signers" } }
  - { action: wait_for, target: { ref: mtapv_chip, description: "섹션에 서명자 칩 반영 (모달 saved → 재조회)" } }
  - { action: click, target: { ref: mtapv_request_btn, description: "요청 → 본인 SENT, 직후 setMtngApvlCount() 호출됨" } }
  - { action: assert_visible, target: { ref: mtapv_chip_turn, description: "1번 서명자 SENT 하이라이트" } }
  - { action: wait_for, target: { ref: mtapv_approve_btn, description: "본인이 현재 결재자" } }

  # --- 사이드바 배지에 1이 뜨는가 ---
  - { action: navigate, url: "/main/mtng/apvlInbox" }
  - { action: wait_for, target: { ref: datatable_row, description: "목록 1건" } }
  - { action: click, target: { ref: sidebar_menu_depth1, text: "Управление заседаниями", description: "회의관리 그룹 펼치기" } }
  - { action: wait_for, target: { ref: sidebar_menu_depth2 } }
  - action: assert_visible
    target: { ref: sidebar_menu_item_150, text: "1", description: "승인 대기함 메뉴(menu_id 150)에 카운트 1 표시" }
  - { action: screenshot, name: "08-badge-count-1" }

  # --- 요청 취소 → 배지가 사라지는가 (회의도 DRAFT 복귀) ---
  - { action: navigate, url: "/main/mtng/cmtMtng/detail?mtngId=848" }
  - { action: wait_for, target: { ref: mtapv_cancel_btn, description: "요청자 본인이므로 취소 버튼 노출" } }
  - { action: click, target: { ref: mtapv_cancel_btn } }
  - { action: wait_for, target: { ref: confirm_popup } }
  - { action: click, target: { ref: confirm_accept, description: "취소 확정 → statCd '3' 복귀 + setMtngApvlCount()" } }
  - { action: wait_for, target: { ref: mtapv_assign_btn, description: "DRAFT로 돌아가 서명자 지정 버튼 재노출" } }
  - { action: navigate, url: "/main/mtng/apvlInbox" }
  - { action: wait_for, target: { ref: datatable, description: "대기함 재조회 — 이제 0건" } }
  - { action: click, target: { ref: sidebar_menu_depth1, text: "Управление заседаниями" } }
  - { action: wait_for, target: { ref: sidebar_menu_depth2 } }
  - { action: screenshot, name: "08-badge-cleared" }
