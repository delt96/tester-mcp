id: avail-03-committee
title: "[가용성] 위원회 담당자 — 위원회심사·회의관리·회의 결재 대기함에 진행 가능한 건이 있는가"
locale: kr
login_as: cmtstaff
tags: [availability, e2e-fullflow]
precondition: >
  위원회 구간은 회의 등록 → 결재선 지정 → 승인 → 심사보고서 → 의견서로 이어진다.
  회의 결재선(BL-04)은 회의가 최소 1건 있어야 확인할 수 있고, 회의 결재 대기함은
  이 계정이 서명자로 지정된 건이 있어야 비어 있지 않다. 읽기 전용 조사.
on_failure: continue
steps:

  # ── 1) 위원회심사 목록 + 배정 토글
  - { action: navigate, url: "/main/billMng/cmtMng/billCmtReview" }
  - { action: wait_for, target: { ref: content_title, description: "위원회심사 제목" } }
  - { action: screenshot, name: "01-cmt-review-list" }
  - { action: assert_visible, target: { ref: datatable_row, description: "위원회심사 대상 의안 1건 이상" } }
  - { action: assert_visible, target: { ref: bill_view_toggle, description: "[전체/내 담당] 토글 존재(BL-07)" } }

  # ── 2) 위원회 회의관리 — 회의가 있어야 결재선(BL-04) 확인 가능
  - { action: navigate, url: "/main/mtng/cmtMtng" }
  - { action: wait_for, target: { ref: content_title, description: "위원회회의관리 제목(경로가 다르면 여기서 실패 → handoff_notes에 실제 경로 기록)" } }
  - { action: screenshot, name: "02-cmt-mtng-list" }
  - { action: assert_visible, target: { ref: datatable_row, description: "위원회 회의 1건 이상 — 결재선 영역/서명자 지정 모달을 열려면 필요" } }

  # ── 3) 회의 결재 대기함 — 내가 서명자로 지정된 회의
  - { action: navigate, url: "/main/letter/mtngApproval" }
  - { action: wait_for, target: { ref: content_title, description: "회의 결재 대기함 제목(경로 미확인 — 실패 시 실제 경로 확인 필요)" } }
  - { action: screenshot, name: "03-mtng-approval-inbox" }
  - { action: assert_visible, target: { ref: list_item, description: "회의 결재 대기 건 1건 이상 — 0건이면 승인 화면(PIN 포함)을 촬영·검증할 수 없다" } }

  # ── 4) 좌측 메뉴 회의결재 뱃지(150) — 대기 건수 표시 여부
  - { action: assert_visible, target: { ref: sidebar_badge_150, description: "회의 결재 대기 뱃지(menu_id 150) — 숫자가 보이면 대기 건 존재(OV-06)" } }
  - { action: screenshot, name: "04-sidebar-badges" }
