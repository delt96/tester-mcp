# scenarios/ebill/_selectors.yaml — verified selector cache. Check here before grepping the app source.
confirm_popup:
  css: ".p-confirmpopup"
confirm_accept:
  css: '.p-confirmpopup [data-pc-section="acceptbutton"]'
toast_success:
  css: ".p-toast-message-success"
datatable:
  css: ".v_table.table_list .p-datatable"
datatable_row:
  css: ".p-datatable-tbody > tr"
list_item:
  css: ".lists .list"
list_item_first:
  css: ".lists .list:first-child"
btn_outline_md:
  css: "button.v_btn.btn_outline_primary.btn_md"
btn_primary_md:
  css: "button.v_btn.btn_primary.btn_md"
dialog_textarea:
  css: ".dialog_main_area textarea.form_control.full"
# 심사 리스트 전체/이행받은 토글 (BillListViewToggle.vue) — 4개 심사화면 공통
bill_view_toggle:
  css: ".bill-list-view-toggle"
bill_view_all_active:
  css: ".bill-list-view-toggle button:first-child.active"
bill_view_assigned_btn:
  css: ".bill-list-view-toggle button:nth-child(2)"
bill_view_assigned_active:
  css: ".bill-list-view-toggle button:nth-child(2).active"
# 사용자 자동완성 (AutoCompleteUserInput.vue) — 수신자/결재자/서명자/요청/주관자 5개 화면 공통.
# 오버레이는 appendTo="body"라 body 직속에 렌더되며 overlayClass="user-autocomplete-overlay".
recipient_ac_input:
  css: ".recipient_area .p-autocomplete-input"
recipient_ac_dropdown:
  css: ".recipient_area .p-autocomplete-dropdown"
user_ac_overlay:
  css: ".user-autocomplete-overlay"
user_ac_option:
  css: ".user-autocomplete-overlay .p-autocomplete-option"
user_ac_absence_badge:
  css: ".user-autocomplete-overlay .absence_badge"
user_ac_option_absent:
  css: ".user-autocomplete-overlay .list-item.is-absent"
user_ac_option_normal:
  css: ".user-autocomplete-overlay .list-item:not(.is-absent)"
# 회의 승인 결재선 (MtngApprovalLineSection.vue / SignerSelectModal.vue) — mtngApvl 스위트 공용
mtapv_section:
  css: ".mtapv-section"
mtapv_assign_btn:
  css: ".mtapv-header_right button.v_btn.btn_outline_primary.btn_sm"
mtapv_request_btn:
  css: ".mtapv-header_right button.v_btn.btn_primary.btn_sm"
mtapv_cancel_btn:
  css: ".mtapv-header_right button.v_btn.btn_outline_secondary.btn_sm"
mtapv_badge:
  css: ".mtapv-badge"
mtapv_badge_approved:
  css: ".mtapv-badge.mtapv-badge_approved"
mtapv_badge_rejected:
  css: ".mtapv-badge.mtapv-badge_rejected"
mtapv_chip:
  css: ".mtapv-chip"
mtapv_chip_turn:
  css: ".mtapv-chip.mtapv-chip_turn"
mtapv_empty:
  css: ".mtapv-empty"
mtapv_approve_btn:
  css: ".mtapv-approver_actions button.v_btn.btn_primary.btn_md"
mtapv_reject_btn:
  css: ".mtapv-approver_actions button.v_btn.btn_outline_error.btn_md"
mtapv_rjct_line:
  css: ".mtapv-rjct_line"
mapvl_modal_tabs:
  css: ".mapvl-tabs"
mapvl_search_input:
  css: ".mapvl-user_search input"
mapvl_user_row:
  css: ".mapvl-user_row"
mapvl_user_row_first:
  css: ".mapvl-user_row:first-child"
mapvl_chip_num:
  css: ".mapvl-chip .mapvl-chip_num"
mapvl_save_btn:
  css: ".popup_footer button.v_btn.btn_outline_primary.btn_md"
reject_modal_textarea:
  css: ".p-dialog textarea.form_control.full"
reject_modal_submit:
  css: ".p-dialog .btn_group button.btn_md.btn_primary"
mtapv_badge_progress:
  css: ".mtapv-badge.mtapv-badge_progress"
# 좌측 사이드바 (LeftSidebarComp.vue) — Accordion 1단은 .depth1, 2단은 .depth2. 전 화면 공통 레이아웃
sidebar:
  css: "#v_sidebar"
sidebar_menu_depth1:
  css: "#v_sidebar .depth1 a"
sidebar_menu_depth2:
  css: "#v_sidebar .depth2 li a"
# 회의 상세 하단 고정 버튼 그룹 (cmt/faction/mainMtngDetail 공통)
# 목록은 <button>, 수정/회의취소/결과등록은 <a> — 태그로 구분되므로 편집버튼 노출 판정에 쓸 수 있다
mtng_detail_btn_list:
  css: ".btn_group_fixed .btns button.v_btn.btn_outline_primary.btn_md"
mtng_detail_btn_edit:
  css: ".btn_group_fixed .btns a.v_btn.btn_primary.btn_md"
# 목록 화면 총건수 (board_info) — 회의/의안 목록 공통
board_total_num:
  css: ".board_info .total_num .text_primary"
# 화면 제목 (TitleComp.vue의 h2) — 전 화면 공통. 텍스트는 각 시나리오에서 local override
content_title:
  css: ".content_tit"
