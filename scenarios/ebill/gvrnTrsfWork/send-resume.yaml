id: gvrn-trsf-send-resume
title: 정부이송작업 — (재개) 결재완료 공문 상태에서 전송 → WS04
locale: ru
login_as: lgactuser
precondition: >
  bill EB_126d83ed: WS03 + 공문 연결 완료(doc_no 03-125/26, DMS02 결재완료) 상태에서 재개.
  df2 워크플로 전이(1900+TRANSFER_TO_GOVERNMENT→3200) 보강 적용됨.
  ⚠ 파괴적: 전송 시 의안 워크플로 실전환(비가역).
steps:
