id: seed-12-approval-doc-approve
title: "[시딩] 문서 결재 — 결재대기함에서 승인 (대기함 이탈 · 기안자 메시지 수신까지)"
locale: kr
login_as: cmthead
tags: [seed, e2e-letter]
precondition: >
  ★ **`TS-EBS-27`(문서 결재)의 자동화다. `seed-11` 이 만든 문서를 소비한다.**
  `seed-11` 실행 후 그 문서가 **`cmtuser1` 의 결재대기함에 `AS02`(대기)** 로 들어가 있어야 한다.
  확인 쿼리:

      select d.doc_subtle, a.user_nm, a.apvl_status_cd
      from kgst.eas_approval a join kgst.eas_document d on d.doc_id = a.doc_id
      where d.doc_subtle like 'E2E-SEED 결재문서%' order by d.reg_dtm desc limit 1;

  2026-08-13 실측: 수신자·승인자가 **둘 다 `cmtuser1`** 로 잡혔다(자동완성 첫 항목).
  그래서 `cmthead` 한 계정으로 결재까지 처리할 수 있다.

  ⚠ **`27`(결재)과 `28`(반려)은 같은 문서를 배타적으로 소비한다.** 이 시나리오가 결재해 버리면
  그 문서로는 반려를 못 한다. `28` 을 돌리려면 `seed-11` 을 한 번 더 실행해 문서를 새로 만들 것.

  ★ **PIN 은 이 환경에서 뜨지 않는다** — `VITE_ENABLE_SIGN=false`(.env.local/staging/production).
  운영에서는 켜져 있어 [결재] 다음에 PIN 입력 단계가 들어간다(사용자 확인 2026-08-13).
  → 산출물 `TS-EBS-27` 의 "PIN 코드 입력" 단계는 **운영 기준으로는 맞고, 이 환경에서는 생략**된다.

  ★ 산출물의 "사용자 선택 목록에서 부재 중인 사용자 확인" 단계는 여기 넣지 않았다 —
  `letter/recipient-absence-badge.yaml` · `recipient-past-absence-selectable.yaml` ·
  `recipient-trip-selectable.yaml` 3개가 이미 덮는다(중복).

  ★ 산출물 `r993`("처리 전후 좌측 메뉴의 미처리 건수 뱃지를 확인")은 **통합테스트 범위에서 제외**한다
  (사용자 결정 2026-08-13). DSL 에 수치 비교가 없어 감소를 단언할 수 없기도 하고,
  뱃지는 통합테스트가 볼 대상이 아니라는 판단이다.
  대신 **결재한 문서가 결재대기함에서 빠지는지**를 단언한다 — 기계적으로 검증되고 의미도 같다.

  ⚠ **비가역**: 결재하면 문서가 결재완료로 넘어간다. 되돌리는 기능이 화면에 없다.

  산출물: `eas_approval.apvl_status_cd` `AS02`(대기) → 승인 상태로 바뀌고 기안자에게 메시지가 간다.
on_failure: stop
steps:

  # ── 1) 결재대기함
  - { action: navigate, url: "/main/letter/approvalInbox" }
  - { action: wait_for, target: { ref: list_item, description: "결재대기함 목록(3분할 좌측)" } }
  - { action: screenshot, name: "12-a-inbox" }

  # ── 2) 대상 문서 열기
  # ★ 단언과 조작을 같은 대상으로 맞춘다. 부제목으로 특정한다.
  - { action: assert_visible, target: { ref: list_item, text: "E2E-SEED 결재문서", description: "seed-11 이 만든 문서가 결재대기함에 있어야 한다. 없으면 seed-11 을 먼저 돌릴 것" } }
  - { action: click, target: { ref: list_item, text: "E2E-SEED 결재문서", description: "그 문서를 연다 → 가운데 문서 내용 + 우측 결재 버튼" } }
  - { action: wait_for, target: { ref: btn_primary_md, description: "결재 버튼 영역 로드" } }
  - { action: screenshot, name: "12-b-detail" }

  # ── 3) 결재
  # seed-02·04b·04c 에서 검증된 경로. PIN 모달이 없으므로 클릭 한 번으로 끝난다.
  - { action: click, target: { ref: btn_primary_md, text: "결재", description: "[결재] → 전자서명 비활성 환경이라 PIN 모달 없이 바로 처리된다" } }
  - { action: screenshot, name: "12-c-approved" }

  # ── 4) 결재 후 목록에서 빠졌는지
  - { action: navigate, url: "/main/letter/approvalInbox" }
  - { action: wait_for, target: { ref: list_item, description: "결재대기함 재조회" } }
  - { action: assert_not_visible, target: { ref: list_item, text: "E2E-SEED 결재문서", description: "결재한 문서는 결재대기함에서 빠져야 한다 — 처리 완료의 확실한 증거" } }
  - { action: screenshot, name: "12-d-removed" }

  # ── 5) 기안자에게 메시지가 갔는지 (산출물 r997)
  # ⚠ 이 단계는 결재가 끝난 뒤에 둔다. 여기서 실패해도 결재 자체는 이미 검증된 상태로 남는다.
  - { use: switch-account, with: { account: gduser } }
  - { action: navigate, url: "/myPage/msg" }
  - { action: wait_for, target: { ref: content_title, description: "메시지관리 목록(기안자 gduser1)" } }
  - { action: screenshot, name: "12-e-drafter-messages" }
