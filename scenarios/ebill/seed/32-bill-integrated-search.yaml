id: seed-32-bill-integrated-search
title: "[조회] 의안통합검색 — 2글자 미만 차단(음성) → 검색 → 결과 클릭 → 상세"
locale: kr
login_as: gduser
tags: [seed, bill, readonly, negative]
precondition: >
  ★ **산출물 `TS-EBS-23`(의안통합검색) r957~r960·r962~r963 을 덮는다.**
    r961(의안모니터링에서 안건 클릭 → 상세 이동)은 **다른 화면**이라 이 시나리오 끝에 붙였다
    (`/main/billMng/billSearch/billMonitorList`).

  ★ **이 화면만 외부 검색엔진을 쓴다 — 우리 API 가 아니다.**
    `VITE_SEARCH_ENG_URL = http://kgtest.bestiansoft.it:6501/search/searchApi.jsp` (.env.local)
    `axiosExt` 로 직접 호출한다(백엔드 경유 없음).
    ⇒ **엔진이 죽으면 결과 0건이 되고, 그건 앱 결함이 아니다.**
    2026-08-14 가용성 확인: `query=закон` → HTTP 200, `totalCount=48`,
    `result[0].indexTotalCount=21`(ebs_kg_file 인덱스). 검색어를 바꿀 때는 먼저 이 URL 을 직접 때려볼 것.
    ⚠ 운영/스테이징은 `/vite_search/...` 상대경로(리버스 프록시)라 **로컬과 주소가 다르다.**

  ★ **r958 '검색어 최소 2글자 이상'은 코드로 강제된다** — `fnSearch` 진입부
    `if (searchItem.trim().length <= 1) { searchCondition = false; return; }` (billSearchEngineList.vue:41-44).
    화면에는 `.text_red` 로 경고 문구(10644)가 나타난다. **먼저 음성으로 확인한다.**

  ★ 결과는 DataTable 이 아니라 **PrimeVue `Panel` 목록**이다(`.panelClass`, `v-if="schTtotalCnt > 0"`).
    행 클릭이 아니라 **패널 클릭**이 상세로 간다(`handleClick` → `fnGoDetail`).
    ⚠ 패널의 접기/펴기 아이콘(`svg.p-icon.p-button-icon`)을 누르면 `handleClick` 이 **early return**
      한다 — 상세로 안 간다. 헤더 텍스트 영역을 눌러야 한다.

  ★ 초기화 버튼이 **없다** — 이 화면의 `.search_btn` 에는 조회 버튼 하나뿐이다.
    (다른 목록 화면과 다르므로 `board_search_reset` 을 쓰면 안 된다.)

  ⚠ 비파괴 — 조회만 한다.
on_failure: stop
steps:
  - { action: navigate, url: "/main/billMng/billSearch/billSearchEngineList" }
  - { action: wait_for, target: { css: ".board_search input.form_control", description: "★ r957 — 의안통합검색 화면(검색어 입력칸)" } }
  - { action: screenshot, name: "32-a-search-screen" }

  # ── 음성: 1글자면 검색이 걸리지 않고 경고가 뜬다 (r958 의 '최소 2글자')
  - { action: click, target: { css: ".board_search input.form_control", description: "검색어(10319) 입력칸 포커스" } }
  - { action: fill, target: { css: ".board_search input.form_control" }, value: "з" }
  - { action: assert_value, target: { css: ".board_search input.form_control" }, value: "з" }
  - { action: click, target: { ref: board_search_btn, description: "[검색](10053) → fnSearch" } }
  - { action: assert_visible, target: { css: ".board_search .text_red", description: "★ r958 음성 — 2글자 미만 경고(10644)가 표출된다" } }
  - { action: screenshot, name: "32-b-too-short-warning" }

  # ── 양성: 2글자 이상이면 결과가 나온다
  - { action: fill, target: { css: ".board_search input.form_control" }, value: "закон" }
  - { action: assert_value, target: { css: ".board_search input.form_control" }, value: "закон" }
  - { action: click, target: { ref: board_search_btn, description: "★ r959 — [검색]" } }
  - { action: assert_not_visible, target: { css: ".board_search .text_red", description: "경고가 사라진다(searchCondition=true)" } }
  - { action: wait_for, target: { css: ".vote_result_wrap .panelClass", description: "★ r959 — 검색 결과 패널 목록(외부 엔진 응답)" } }
  - { action: screenshot, name: "32-c-results" }

  # ── r960·r962 결과 클릭 → 의안 상세
  - { action: click, target: { css: ".vote_result_wrap .panelClass:first-child .p-panel-header div", description: "★ r960 — 첫 결과의 헤더 텍스트 클릭(접기 아이콘을 피한다)" } }
  - { action: wait_for, target: { css: ".content_section .p-accordion", description: "★ r962 — 의안 상세(billAllInfoInc 아코디언) 표출" } }
  - { action: screenshot, name: "32-d-bill-detail" }

  # ── r963 목록 복귀
  # ⚠ 의안 상세의 [목록]은 게시판 3종과 달리 **`<button>`** 이다(billSearchEngineDetail.vue:34).
  #   detail_list_link(=a…)로 잡으면 못 찾는다.
  - { action: click, target: { ref: btn_outline_md, description: "★ r963 — [목록](10084). 의안 상세는 button 태그다" } }
  - { action: wait_for, target: { css: ".board_search input.form_control", description: "의안통합검색 화면으로 복귀" } }

  # ── r961 의안모니터링에서 안건 클릭 → 상세 이동(링크 복구 확인)
  - { action: navigate, url: "/main/billMng/billSearch/billMonitorList" }
  - { action: wait_for, target: { ref: datatable_row, description: "의안모니터링 목록" } }
  - { action: screenshot, name: "32-e-monitor-list" }
  - { action: double_click, target: { ref: datatable_row, description: "★ r961 — 안건 행 진입" } }
  - { action: wait_for, target: { css: ".content_section .p-accordion", description: "★ r961 — 해당 안건 상세로 이동한다(상세 이동 링크 복구 확인)" } }
  - { action: screenshot, name: "32-f-monitor-detail" }
