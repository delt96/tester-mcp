id: seed-00b-mp-request-registration
title: "[시딩] 의원 발의 ② 서명 → 홈페이지 게재 → 등록요청발송 (step 0 → 1000)"
locale: kr
login_as: mp1
tags: [seed, e2e-fullflow]
precondition: >
  ★ **`00a` 를 바로 앞에 돌려야 한다.** 이 시나리오는 **서명·게재를 아직 안 한 의안**을 전제로
  하고, 목록 첫 행을 잡는다. 목록은 **최신순**이라 `00a` 직후에는 방금 만든 미처리 건이 맨 위다.

  단독으로 돌리면 안 된다 — 2026-08-12 실측: E2E-MP 의안 4건이 서로 다른 단계에 있었고
  (미처리 1 / 서명만 1 / 서명+게재 2), 첫 행이 '서명만 된 건'이라 [서명] 버튼이 없어 멈췄다.
  DSL 에 조건 분기가 없으므로 **시나리오는 시작 상태를 하나로 못박아야 한다.**

  이 시나리오 자체는 의안을 **새로 만들지 않는다** — `00a` 가 만든 것을 소비한다.

  ★ **순서가 강제된다: 서명 → 홈페이지 게재 → (재진입) → 등록요청발송.**
  세 지점 모두 2026-08-12 실행에서 하나씩 막히며 확정됐다.

  ① [홈페이지 게재]는 **발의자 본인 서명 전에는 disabled** 다
     `isEnbHomeSet = fnIsPprSign()` — 발의자(ppsrId)의 `agreeYn` 이 'Y' 가 아니면 true
     (ApplyDetail.vue:207-216). 처음엔 게재를 먼저 하려다 막혔다.

  ② [등록요청발송]은 게재 직후에도 **아직 비활성**이다. **화면을 다시 들어와야 활성화된다**
     (사용자 확인). 이걸 모르고 바로 누르려 들면 executor 가 없는 버튼을 계속 찾다가
     **groping 으로 강제 종료**된다 — 3차 실행에서 `computer` 도구 64회 반복 후 죽었다.

  ③ [등록요청발송]은 액션이 아니라 **문서 작성 모달**을 연다
     `popupInsertLetter({billId, billType:'REQUEST_REGISTRATION'})` (ApplyDetail.vue:187) —
     seed-02·04b·04c·06·08 에서 쓴 그 InsertLetter 모달이라 셀렉터가 그대로 통한다.

  ⚠ 비활성 버튼은 눌러도 화면이 안 변해 **"클릭이 안 먹는다"로 보인다.**
  실패하면 셀렉터를 의심하기 전에 `disabled` 를 먼저 확인할 것.

  모달 값은 과거 등록요청 문서 3건에서 뽑았다(2026-08-12 DB 확인):
    eas_document      doc_lng=DML01(국가언어 1종) · doc_class_cd=VD03 · doc_type_cd=DMT01
    eas_received_info 수신자 = **LGRVuser(법률검토 부서장)** 3/3 일치 — **모달이 자동으로 채운다**
    eas_approval      **0건 — 등록요청 문서에는 결재선이 없다.** 승인자를 넣지 말 것
    eas_file          문서당 1건 → 공문파일 첨부

  산출물: 의안이 step 0 `C` → **step 1000 `REGISTRATION`(assigned_to=GD)** 로 전진한다.
  완료 예시 `13907`(step 0 C) → `13912`(step 1000 P, GD) 를 실측으로 확인했다. `seed-01` 의 앞 구간이다.
on_failure: stop
steps:

  # ── 1) 미처리 의안 하나를 연다
  # ⚠ 같은 이름 의안이 여러 건이라 **단언한 행과 조작한 행을 반드시 일치**시킨다(seed-05 1차 사고).
  #   둘 다 tr:first-child 를 쓴다 — ref:datatable_row 로 text 매칭하면 다른 행이 열릴 수 있다.
  - { action: navigate, url: "/main/bill/apply" }
  - { action: wait_for, target: { ref: content_title, description: "의안제출 목록" } }
  - { action: fill, target: { css: ".board_search .form_row .input_item:nth-child(3) input.form_control", description: "안건명 검색칸(input_item 순서: 제출일자 / 안건상태 / 안건명)" }, value: "E2E-SEED MP" }
  - { action: click, target: { css: ".search_btn button.v_btn.btn_primary", description: "[조회](10053) — 목록 검색 버튼. 라벨이 '검색'이 아니라 **조회**다. 헤더 좌상단의 '검색' 입력칸과 다른 것이니 혼동 금지" } }
  - { action: wait_for, target: { ref: datatable, description: "필터된 목록" } }
  - { action: assert_visible, target: { css: ".p-datatable-tbody tr:first-child", text: "E2E-SEED MP", description: "첫 행이 E2E-SEED MP 인지 확인하고 나서 연다" } }
  - { action: screenshot, name: "00b-a-filtered" }
  - { action: double_click, target: { css: ".p-datatable-tbody tr:first-child", description: "위에서 단언한 그 행을 연다 → 의안제출 상세" } }
  - { action: wait_for, target: { ref: content_title, description: "의안제출 상세" } }
  - { action: screenshot, name: "00b-b-detail" }

  # ── 2) 서명 — 발의자 본인 동의. 이게 있어야 게재가 열린다
  # ⚠ [서명]과 [등록요청발송]이 같은 클래스(a.v_btn.btn_primary.btn_md)라 text 로만 갈린다
  - { action: click, target: { css: "a.v_btn.btn_primary.btn_md", text: "서명", description: "[서명](10095) — agreeYn=='N' 일 때만 보인다. 이미 서명된 건이면 없다" } }
  - { action: wait_for, target: { ref: content_title, description: "상세 재조회" } }
  - { action: screenshot, name: "00b-c-signed" }

  # ── 3) 홈페이지 게재 — 서명 뒤라야 활성이다
  # btn_outline_md 별칭을 안 쓰고 인라인으로 두는 이유: `:not([disabled])` 는 별칭 병합으로 못 붙는다.
  # 활성 여부 자체가 이 단언의 목적이라 셀렉터에 남겨야 한다.
  - { action: assert_visible, target: { css: "button.v_btn.btn_outline_primary.btn_md:not([disabled])", text: "홈페이지 게재", description: "서명 후 활성화됐는지 — disabled 면 앞의 서명이 안 걸린 것이다" } }
  - { action: click, target: { ref: btn_outline_md, text: "홈페이지 게재", description: "[홈페이지 게재](10097) → POST /bill/apply/home → sclDscPubDt·사회토론번호 부여" } }
  - { action: wait_for, target: { ref: content_title, description: "상세 재조회(fnSearch)" } }
  - { action: screenshot, name: "00b-d-published" }

  # ── 4) 재진입 — 이게 있어야 [등록요청발송]이 활성화된다
  - { action: navigate, url: "/main/bill/apply" }
  - { action: wait_for, target: { ref: datatable, description: "목록으로 나갔다 다시 들어온다 = 새로고침 효과" } }
  - { action: fill, target: { css: ".board_search .form_row .input_item:nth-child(3) input.form_control", description: "안건명 검색칸" }, value: "E2E-SEED MP" }
  - { action: click, target: { css: ".search_btn button.v_btn.btn_primary", description: "[조회](10053) — 라벨은 '조회'다. 헤더의 '검색' 입력칸이 아니다" } }
  - { action: wait_for, target: { ref: datatable, description: "필터된 목록" } }
  - { action: assert_visible, target: { css: ".p-datatable-tbody tr:first-child", text: "E2E-SEED MP", description: "첫 행 확인" } }
  - { action: double_click, target: { css: ".p-datatable-tbody tr:first-child", description: "상세 재진입" } }
  - { action: wait_for, target: { ref: content_title, description: "의안제출 상세" } }
  - { action: screenshot, name: "00b-e-reentered" }

  # ── 5) 등록요청발송 → 모달
  - { action: assert_visible, target: { css: "a.v_btn.btn_primary.btn_md", text: "등록요청발송", description: "[등록요청발송](10764) 노출 = 게이트 둘(서명·게재)을 통과하고 재진입으로 상태가 갱신됐다는 증거" } }
  - { action: click, target: { css: "a.v_btn.btn_primary.btn_md", text: "등록요청발송", description: "[등록요청발송] → InsertLetter 모달이 열린다(바로 처리되지 않는다)" } }
  - { action: wait_for, target: { css: ".p-dialog", description: "등록요청발송 모달" } }
  - { action: screenshot, name: "00b-f-modal" }

  # ── 6) 모달 필수값 — **업로드를 맨 먼저** 한다
  # ⚠ 2026-08-12 실행 4회에서 공문파일만 계속 실패했다. 원인은 셀렉터가 아니라 **앱 결함**이었다.
  #   ApplyDetail.vue 의 공동발의 탭이 `<Tab :value="dept.title">` 였는데 정당명에 큰따옴표가 들어
  #   있어(`Фракция "Ата-Журт Кыргызстан"`) PrimeVue 가 만든 label[for=...] 이 유효하지 않은
  #   CSS 셀렉터가 됐고, 확장의 접근성 트리 생성이 **문서 전체에서** 죽었다. 그래서 이 화면에서만
  #   `find`/`read_page` 가 'Page script returned empty result' 를 반환해 ref 를 못 만들었다.
  #   (javascript_tool 의 querySelectorAll 은 a11y 트리를 안 거치므로 요소는 계속 보였다.)
  #   → 2026-08-13 `:value="dept.id"` 로 수정됨. 셀렉터는 다른 5개 시나리오와 같은 것을 쓴다.
  #   ⚠ 이 시나리오가 실패로 되돌아가면 프론트 수정이 되돌려졌는지부터 확인할 것.
  # AddDragAndDropFileComponent.vue:130-134 — input 이 :id="type+'file'"(=officialfile),
  # accept=".pdf", official 은 단일 파일. seed-02·04b·04c·06·08 에서 검증된 셀렉터다.
  # 앞에 놓인 label[for=officialfile] 업로드 아이콘은 누르면 네이티브 선택창이 열려 세션이 멈춘다.
  - { action: upload, target: { ref: official_file_input, description: "공문파일 input 자체(InsertLetter.vue:892-904, docMode!=='form' 일 때 렌더). label[for=officialfile] 클릭 금지 — 네이티브 선택창" }, file: "documentSample.pdf" }
  # ⚠ 파일 영역이 **둘**이다. 위가 공문파일(official), 아래가 첨부파일(attach).
  #   **첨부파일에는 의안 원문 2건이 자동으로 들어와 있다** — 그걸 보고 "업로드 성공"으로 읽으면 안 된다.
  #   2026-08-12 실행에서 executor 가 정확히 그렇게 오독했다. 그래서 공문 영역만 따로 단언한다.
  - { action: assert_visible, target: { ref: official_doc_area, text: "documentSample.pdf", description: "공문파일 칸에 파일명이 떠야 한다. 비어 있으면 업로드가 안 걸린 것 — 여기서 멈추는 게 맞다" } }

  # ⚠ .p-dialog 첫 체크박스는 #docModeOfficial(공문파일 첨부 모드)이라 언어가 아니다.
  #   그걸 누르면 공문파일 칸이 통째로 사라진다.
  # ⚠ 언어 체크박스는 `:id="lan.codeId"` 라 **코드값이 곧 id** 다(InsertLetter.vue:976).
  #   DML01=국가언어 — 과거 등록요청 문서의 doc_lng 과 일치한다. 위치로 찍으면 옆의 '특성'이 눌린다.
  - { action: click, target: { css: "#DML01", description: "언어 '국가언어'(DML01) — 필수*" } }
  # ⚠ 필드 이름이 '제목'이 아니라 **'부제목'**(10249) 이다. label:"제목" 매칭은 실패한다.
  - { action: fill, target: { css: ".p-dialog .sub_title_area input.form_control.full", description: "부제목(10249) 필수* — 과거 문서는 '{안건명} 등록요청' 형식" }, value: "E2E-SEED MP 등록요청" }
  # 수신자는 입력하지 않는다 — 모달이 열릴 때 LGRVuser 가 이미 채워져 있다(2026-08-12 실측).
  - { action: assert_visible, target: { css: ".p-dialog .recipient_area", text: "LGRVuser", description: "수신자가 자동으로 채워져 있어야 한다(법률검토 부서장)" } }
  - { action: screenshot, name: "00b-g-filled" }
  - { action: click, target: { css: ".p-dialog button.v_btn.btn_primary", text: "등록하기", description: "[등록하기] → REQUEST_REGISTRATION 완료(C) → step 1000 REGISTRATION(GD) 생성" } }
  - { action: wait_for, target: { ref: content_title, description: "모달이 닫히고 상세로 복귀" } }
  - { action: screenshot, name: "00b-h-sent" }

  # ── 7) 결과 확인 — GD 의 의안접수 목록에 나타나야 한다
  - { use: switch-account, with: { account: gduser } }
  - { action: navigate, url: "/main/billMng/gdMng/billMngRc" }
  - { action: wait_for, target: { ref: content_title, description: "의안접수 목록" } }
  - { action: screenshot, name: "00b-i-gd-reception" }
  - { action: assert_visible, target: { ref: datatable_row, text: "E2E-SEED MP", description: "GD 의안접수 목록에 나타남 = 등록요청이 실제로 발송되고 step 1000 이 생겼다는 증거" } }
