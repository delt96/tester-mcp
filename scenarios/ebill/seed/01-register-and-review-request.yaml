id: seed-01-register-and-review-request
title: "[시딩] 외부수신문서 → 의안등록 → 법률검토 이행요청(주이행자 지정)까지 만들어낸다"
locale: kr
login_as: gduser
tags: [seed, e2e-fullflow]
precondition: >
  법적행위·정부이송 단계를 테스트하려면 그 앞 구간을 실제로 통과시켜 데이터를 만들어야 한다.
  이 시나리오가 그 1단계다. 실제로 의안을 생성하므로 읽기 전용이 아니다(dev DB 기준 허용).

  ★ 필수 선행: 의안등록 대기함에 처리상태 **'등록대기'** 행이 1건 이상 있어야 한다.
  없으면 이 시나리오는 NOT_TESTED로 끝난다(2026-08-11 실측 — 큐가 비어 시작도 못 했다).
  등록대기 행은 외부수신함에서 문서를 골라 [의안등록 접수]를 눌러야 생기고, 외부수신문서가
  없으면 오프라인 등록을 해야 하는데 그건 공문 파일 업로드가 필요하다. 2026-08-12부터 `upload`
  액션으로 가능해졌으나 이 시나리오는 그 경로를 쓰지 않는다 — 사람이 미리 큐를 채워 두거나,
  오프라인 등록 시나리오를 따로 작성할 것. README의 '권장 운영 방식' 참조.

  대기함 목록은 세 상태가 섞여 있고 더블클릭 시 이동 경로가 갈린다(billRegWaitList.vue:92):
    임시저장(draftYn=Y) → draftId 경로  /  등록대기(WAIT) → extDocId+waitId 경로  /  처리완료(DONE) → 조회
  ★ 진짜 '등록대기' 행 판정은 `status='WAIT'` 만으로는 부족하다. 화면 라벨과 더블클릭 경로가
  **둘 다 `draft_yn` 을 먼저 보기 때문**이다(billRegWaitList.vue:151, 93):
      draft_yn='Y'  → '임시저장'(10998) + draftId 경로
      status='WAIT' → '등록대기'(10267) + extDocId+waitId 경로   ← 이 시나리오가 쓰는 것
  즉 **`status='WAIT' AND draft_yn<>'Y' AND doc_id IS NOT NULL`** 이라야 한다.
  큐를 채우려면 `seed-01a` 를 먼저 돌린다.

  원문 파일은 **직접 업로드**한다. 원래는 [가져오기]로 외부문서 첨부를 끌어오는 경로였으나
  앱 버그로 그 모달이 항상 비어 있다(3절 주석 참고). 버그가 고쳐지면 되돌린다.

  산출물: 의안명이 'E2E-SEED'로 시작하는 의안 1건. 이후 seed-02~05가 이 마커로 대상을 찾는다.
  주 이행자([C] 배지) 지정까지 해야 다음 단계에서 [의견서 작성] 버튼이 나온다 — 2026-08-11 확인.
on_failure: stop
steps:

  # ── 1) 의안등록 대기함 → 대기 행 진입
  - { action: navigate, url: "/main/billMng/gdMng/billRegWait" }
  - { action: wait_for, target: { ref: datatable, description: "등록 대기 그리드" } }
  - { action: double_click, target: { ref: datatable_row, text: "등록대기", description: "처리상태 '등록대기'(status=WAIT) 행. 더블클릭 시 billMngRcSave?extDocId=&waitId= 로 이동해 외부문서가 연결된 등록 폼이 열린다. '임시저장'(draftYn=Y) 행은 draftId 경로라 다른 폼이 열리므로 잡으면 안 된다 — 두 행의 액션 버튼은 클래스가 같아 버튼으로는 구분이 안 된다(billRegWaitList.vue:242-243)" } }
  - { action: wait_for, target: { css: ".ext_doc_card", description: "등록 폼의 등록요청문서 카드 — 외부문서 모드 진입 신호" } }
  - { action: screenshot, name: "01a-reg-form" }

  # ── 2) 의안명(러시아어) — 'E2E-SEED' 마커로 이후 단계에서 식별
  - { action: fill, target: { label: "안건명(러시아어)", css: "textarea.form_control", description: "안건명(러시아어)(10068). 첫 textarea는 키르기스어라 라벨로 구분" }, value: "E2E-SEED автотест законопроект" }

  # ── 3) 원문 파일 — 직접 업로드한다
  #
  # ⚠ 원래는 외부문서 첨부에서 [가져오기](11051)로 채우는 경로였다. 지금은 못 쓴다 —
  #   앱 버그로 [가져오기] 모달이 **항상 '첨부파일이 없습니다'** 다(2026-08-12 확인):
  #     ExternalDocumentsServiceImpl:88
  #       dto.setFileList(easFileService.getFilesByDocId(dto.getId().toString()));
  #     → eas_file.doc_id 는 eas_document 의 UUID 인데 documents.id(숫자 PK)를 넘긴다.
  #       eas_file 2,918건이 전부 UUID 라 숫자로는 영원히 0건.
  #   같은 `fileList` 를 외부수신함 상세 왼쪽 패널도 쓰므로(ExternalLetterDetailComponent.vue:32)
  #   거기도 나란히 비어 보인다 — 데이터가 없는 게 아니라 응답이 못 담아 온다.
  #   `dto.getEasDocId()` 로 고치면 두 화면이 동시에 살아난다.
  #   TODO(해제 조건): 그 한 줄이 고쳐지면 아래 upload 2개를 [가져오기] 블록으로 되돌린다.
  #
  # 파일 셀 구조(BillFilesInputRow.vue:45-58): td:nth-of-type(1)=키르기즈어 / (2)=러시아어,
  # 각 셀 안 .form_row 순서는 원문(110) / 120 / 130 / 100 이라 :first-child 가 원문이다.
  # input 의 id 는 `inputFile{uid}` 로 런타임 채번이라 못 쓴다(billFileInput.vue:175).
  # accept 기본값이 ''(제한 없음)이라 pdf 픽스처로도 통과한다.
  - { action: upload, target: { css: "tr:has(.file_attatch) td:nth-of-type(1) .form_row:first-child input[type=file].form_file", description: "문서(키르기즈어) 원문(110)" }, file: "documentSample.pdf" }
  - { action: upload, target: { css: "tr:has(.file_attatch) td:nth-of-type(2) .form_row:first-child input[type=file].form_file", description: "문서(러시아어) 원문(110)" }, file: "documentSample.pdf" }
  - { action: screenshot, name: "01b-files-uploaded" }

  # ── 4) 저장 → 이첩 모달(확인창 없음, 법무실 부서장 자동 지정) → 등록
  - { action: click, target: { css: "button[type=\"submit\"].v_btn.btn_primary.btn_md", text: "저장", description: "[저장](10174) — confirm 없이 이첩 모달이 바로 뜬다(BL-20)" } }
  - { action: wait_for, target: { css: ".p-dialog .popup_tit", text: "등록요청발송", description: "이첩 모달(ForwardExtDocModal)" } }
  - { action: assert_visible, target: { css: ".p-dialog .recipients", description: "수신자 영역 — 법무실 부서장이 자동으로 채워져 있어야 한다(EA-08)" } }
  - { action: screenshot, name: "01c-forward-modal" }
  - { action: click, target: { css: ".p-dialog button.v_btn.btn_primary", text: "등록하기", description: "[등록하기](10493) — 의안 생성 + 법무실로 이첩" } }
  - { action: wait_for, target: { ref: datatable, description: "등록 대기 목록으로 자동 복귀" } }
  - { action: screenshot, name: "01d-registered" }

  # ── 5) 법률검토 부서장으로 전환 — 수신문서에서 이행요청을 건다
  - { use: switch-account, with: { account: lgrvhead } }
  - { action: navigate, url: "/main/letter/inbox" }
  - { action: wait_for, target: { ref: list_item, description: "수신함 목록" } }
  - { action: click, target: { ref: list_item, text: "E2E-SEED", description: "방금 이첩된 E2E-SEED 의안의 등록요청문서" } }
  - { action: wait_for, target: { ref: btn_outline_md, text: "주 이행자", description: "[주 이행자 추가] 버튼 — 수신 상세 진입 신호" } }
  - { action: screenshot, name: "01e-inbox-detail" }

  # ── 6) 이행요청 모달 — 이행자 + [C] 주이행자 + 서명자(본인)
  - { action: click, target: { ref: btn_outline_md, text: "주 이행자", description: "[주 이행자 추가] → 이행요청 모달" } }
  - { action: wait_for, target: { css: ".p-dialog .p-autocomplete-input", description: "이행요청 모달의 이행자 입력" } }
  # ⚠ 수행자와 서명자는 같은 컴포넌트(AutoCompleteUserInput)라 .p-dialog .p-autocomplete-input 만으로는
  #   구분되지 않는다. 게다가 화면 라벨은 '수행자'(10526)이지 '이행자'가 아니라 label 매칭도 안 먹는다.
  #   RequestModal.vue 기준으로 수행자는 .responder_row, 서명자는 .signer_area 안에 있다.
  - { action: fill, target: { css: ".p-dialog .responder_row .p-autocomplete-input", description: "수행자 autocomplete" }, value: "LGRVuser2" }
  - { action: wait_for, target: { css: ".p-autocomplete-overlay .p-autocomplete-option, .user-autocomplete-overlay .p-autocomplete-option", description: "이행자 후보" } }
  - { action: click, target: { css: ".p-autocomplete-overlay .p-autocomplete-option, .user-autocomplete-overlay .p-autocomplete-option", description: "LGRVuser2 선택" } }
  # ⚠ .full 이 빠지면 매칭에 실패해 입력이 수행자 autocomplete 로 흘러든다(2026-08-12 실측)
  - { action: fill, target: { css: ".p-dialog textarea.form_control.full", description: "이행 내용" }, value: "E2E-SEED 법률검토 요청" }
  # [C] 배지 = 주 이행자 지정. 이걸 눌러야 다음 단계에서 [의견서 작성] 버튼이 나온다
  - { action: click, target: { css: ".p-dialog button.main-worker-btn", description: "수행자 우측 [C] 배지 — 주 이행자 지정(EA-02). 수행자가 채워져야(canPickMainWorker) 렌더링되며 활성 시 .is-main 이 붙는다" } }
  - { action: assert_visible, target: { css: ".p-dialog button.main-worker-btn.is-main", description: "[C] 활성 확인 — .is-main 이 없으면 주 이행자가 아니다" } }
  # ⚠ 검색어는 로그인 ID가 아니라 **HRMIS 표시명** 기준이다(/hrmis/autocomplete).
  #   부서장의 로그인 ID는 LGRVuser1 이지만 표시명은 'LGRVuser L (법률검토 부서장)' 이라
  #   'LGRVuser1' 로 치면 0건이다(2026-08-12 API 직접 확인). 'LGRVuser' 는 3건(부서장·직원·직원2)이
  #   뜨므로 :first-child 로 찍으면 안 되고 text:"부서장"으로 특정해야 한다.
  - { action: fill, target: { css: ".p-dialog .signer_area .p-autocomplete-input", description: "서명자 autocomplete — .signer_area 로 수행자와 갈라야 한다" }, value: "LGRVuser" }
  - { action: wait_for, target: { css: ".p-autocomplete-overlay .p-autocomplete-option, .user-autocomplete-overlay .p-autocomplete-option", description: "서명자 후보" } }
  - { action: click, target: { css: ".p-autocomplete-overlay .p-autocomplete-option, .user-autocomplete-overlay .p-autocomplete-option", text: "부서장", description: "후보 중 'LGRVuser L (법률검토 부서장)' 선택 — 로그인 계정 본인이다. 검색어를 로그인 ID로 바꾸지 말 것(0건). 옵션 회색줄이 '직급 · 부서'라 부서장/직원이 여기서 갈린다(AutoCompleteUserInput.vue:78). 본인 지정 시 서명대기 없이 즉시 발송(EA-01)" } }
  - { action: screenshot, name: "01f-workrequest-filled" }
  - { action: click, target: { css: ".p-dialog button.v_btn.btn_primary", text: "등록", description: "[등록] — 이행요청 생성" } }

  # ── 7) 결과 확인 — 본인 서명이므로 '발송됨' 상태여야 한다
  - { action: wait_for, target: { css: ".p-dialog", description: "모달 닫힘 대기(닫히면 통과)" } }
  - { action: screenshot, name: "01g-workrequest-created" }
  - { action: assert_visible, target: { css: "[class*='badge']", text: "발송", description: "이행요청 카드 배지가 '발송됨' — 요청자 본인을 서명자로 지정해 즉시 발송된 증거(EA-01). '서명 대기'면 타인 서명자가 지정된 것" } }
