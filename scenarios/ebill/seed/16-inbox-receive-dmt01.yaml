id: seed-16-inbox-receive-dmt01
title: "[시딩] 문서 접수(답변용) — 수신함 → 주 이행자 추가 → 종료하기"
locale: kr
login_as: cmthead
tags: [seed, e2e-letter]
precondition: >
  ★ **`TS-EBS-29`(문서 접수-답변용)의 자동화다.** `seed-11` → `seed-12`(결재) 를 거친
  **`DMT01`(답변용) 문서가 수신자 수신함에 있어야** 한다.

  ★ **결재가 끝나야 수신함에 뜬다**(2026-08-13 실측):
      eas_received_info.rcv_status  RS00 → **RS01**, rcv_dtm 16:54:53
      결재 시각 16:54:52 과 같은 초 — 결재 완료가 곧 발송이다.
  반려된 문서는 RS00 에 머물러 수신함에 오지 않는다.

  ★ **수신함 버튼은 문서 유형(docTypeCd)마다 다르다**(Inbox.vue:552-575). 이게 이 케이스의 핵심이다.

      DMT01 답변용 → **[주 이행자 추가](10678)** · [반려](10269)
      DMT02 확인용 → [종료하기](10497)
      DMT03 서명용 → [결재](10268) · [반려](10269)
      DMT04       → [답변](10496) · [종료하기](10497)
      접수 후      → [종료하기](10497)  (fn_endAfterReceipt)

  → **산출물 r1035 의 "[이행요청] 버튼 클릭"은 실제 라벨과 다르다.** 실제는 **[주 이행자 추가]** 다.
  버튼이 전부 `button.v_btn.btn_outline_neutral.btn_md`(반려만 `btn_outline_error`)라
  **텍스트로만 갈린다.**

  ★ 모달 내부 셀렉터는 `_fragments/assign-main-executor.yaml` 에서 검증된 것을 그대로 쓴다.
  ⚠ **프래그먼트를 `use` 하지 않는 이유**: 프래그먼트는 진입을 `button.add_command`([이행자추가])로
  하는데, 수신함 답변용 문서는 **[주 이행자 추가]** 버튼으로 같은 모달을 연다. 진입 버튼이 달라
  그대로 못 쓴다. → 모달 내부 단계만 인라인으로 복제했다.
  **프래그먼트가 바뀌면 이 파일도 같이 고쳐야 한다.**

  ★ [C] 주 이행자 지정이 왜 필요한가: 프래그먼트 주석 참조 — [의견서 작성]·[심사보고서 등록]이
  주 이행자에게만 보인다. 서명자를 요청자 본인으로 두면 서명대기 없이 즉시 '발송'된다.

  ★ 이 시나리오에서 **뺀 단계**:
    · r1033 "(일반부서 GD 계정) 등록일 기간 + 'Токтом만 보기' 체크박스" — **GD 계정 전용 필터**다.
      이 시나리오는 수신자(cmtuser1) 로 도는데 GD 가 아니라서 확인할 수 없다. → 미검증
    · r1034 좌측 메뉴 미처리 건수 뱃지 — **통합테스트 범위 제외**(사용자 결정 2026-08-13)

  ⚠ **비가역**: 이행요청이 실제로 발송되고, [종료하기]를 누르면 문서가 종료된다.

  산출물: 이행요청 1건(주 이행자 cmtuser10, 서명자 cmtuser1 → 즉시 발송) + 문서 종료.
on_failure: stop
steps:

  # ── 1) 수신함에서 답변용 문서 열기
  - { action: navigate, url: "/main/letter/inbox" }
  - { action: wait_for, target: { ref: list_item, description: "수신함 목록(3분할 좌측)" } }
  - { action: assert_visible, target: { ref: list_item, text: "E2E-SEED 결재문서 답변용", description: "결재 완료된 DMT01 문서가 수신함에 있어야 한다. 없으면 seed-11 → seed-12 를 먼저 돌릴 것" } }
  - { action: click, target: { ref: list_item, text: "E2E-SEED 결재문서 답변용", description: "단언한 그 문서를 연다" } }
  # ⚠ 클릭 직후 목표 버튼을 바로 기다리면 상세가 아직 안 뜬 순간에 걸린다(seed-13 1차 교훈)
  - { action: wait_for, target: { css: ".right_top_area", description: "상세 우측 액션 영역 로드" } }
  - { action: assert_visible, target: { css: ".right_top_area button.v_btn.btn_outline_neutral.btn_md", text: "주 이행자 추가", description: "DMT01 이면 이 버튼이 나온다 — 유형별 버튼 분기의 증거" } }
  - { action: screenshot, name: "16-a-inbox-detail" }

  # ── 2) 주 이행자 추가 → 이행요청 모달
  - { action: click, target: { css: ".right_top_area button.v_btn.btn_outline_neutral.btn_md", text: "주 이행자 추가", description: "[주 이행자 추가](10678) → receptionModalOpen. 산출물은 '[이행요청]'이라 적혀 있으나 실제 라벨은 이것이다" } }
  - { action: wait_for, target: { css: ".p-dialog .responder_row .p-autocomplete-input", description: "이행요청 모달의 수행자 입력" } }
  - { action: screenshot, name: "16-b-modal" }

  # ── 3) 수행자 · 이행내용 · [C] 주 이행자 · 서명자
  # (assign-main-executor 프래그먼트에서 검증된 셀렉터)
  - { action: fill, target: { css: ".p-dialog .responder_row .p-autocomplete-input", description: "수행자 — 부서원 ID 를 그대로 치면 후보가 1건만 남는다" }, value: "cmtuser10" }
  - { action: wait_for, target: { css: ".p-autocomplete-overlay .p-autocomplete-option", description: "수행자 후보" } }
  - { action: click, target: { css: ".p-autocomplete-overlay .p-autocomplete-option", text: "cmtuser10", description: "cmtuser10 선택" } }
  - { action: fill, target: { css: ".p-dialog textarea.form_control.full", description: "이행내용" }, value: "E2E-SEED 답변용 문서 접수 이행요청" }
  - { action: wait_for, target: { css: ".p-dialog button.main-worker-btn", description: "[C] 배지 — 수행자가 채워져야 렌더링된다" } }
  - { action: click, target: { css: ".p-dialog button.main-worker-btn", description: "[C] 클릭 → 주 이행자 지정" } }
  - { action: assert_visible, target: { css: ".p-dialog button.main-worker-btn.is-main", description: "[C] 활성 확인 — .is-main 이 없으면 주 이행자가 아니다" } }
  - { action: fill, target: { css: ".p-dialog .signer_area .p-autocomplete-input", description: "서명자 — 요청자 본인(cmtuser1)" }, value: "cmtuser1" }
  - { action: wait_for, target: { css: ".p-autocomplete-overlay .p-autocomplete-option", description: "서명자 후보" } }
  - { action: click, target: { css: ".p-autocomplete-overlay .p-autocomplete-option", text: "부서장", description: "부서장 후보 선택 — 직원 후보(cmtuser10)와 구분하려면 text 매칭이 필수" } }
  - { action: screenshot, name: "16-c-modal-filled" }
  - { action: click, target: { css: ".p-dialog button.btn_md.btn_primary", description: "[등록](10103)" } }
  - { action: wait_for, target: { css: ".right_top_area", description: "모달이 닫히고 상세로 복귀" } }
  - { action: screenshot, name: "16-d-requested" }

  # ── 4) 즉시 발송됐는지 (서명자가 본인이라 서명대기가 없어야 한다)
  - { action: assert_visible, target: { css: "[class*='badge']", text: "발송", description: "본인 서명이라 즉시 '발송'. '서명 대기'면 서명자가 타인으로 잡힌 것(seed-04 교훈)" } }

  # ── 5) 접수 후 종료
  - { action: click, target: { css: ".right_top_area button.v_btn.btn_outline_neutral.btn_md", text: "종료하기", description: "[종료하기](10497) → fn_endAfterReceipt. 접수 후에는 이 버튼만 남는다" } }
  - { action: screenshot, name: "16-e-ended" }
