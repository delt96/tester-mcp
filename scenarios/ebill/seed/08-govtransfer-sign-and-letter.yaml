id: seed-08-govtransfer-sign-and-letter
title: "[시딩] 정부이송 완주 — 서명자 지정 → 서명 → 공문 작성 → 결재(자동 이송) → 1900→3200"
locale: kr
login_as: lgactuser
tags: [seed, e2e-fullflow]
precondition: >
  `seed-07` 로 정부이송작업(work)이 만들어져 `ebs_gvrn_trsf_work.work_stat_cd='WS01'` 이어야 한다.

  ★ 이 화면은 **work_stat_cd 상태기계**로 버튼이 갈린다(gvrnTrsfWork/billMngDtl.vue:64-70):
    WS01 법률등록완료  → [서명자 지정/변경](11078), [법률 재등록](11077)
    WS02 서명중        → [서명](10095)  — 단, `mySign` 이 있어야, 즉 **로그인 계정이 서명자여야** 뜬다
    WS03 서명완료      → [공문 작성](11113)
    WS04 이송완료      → 버튼 없음
  버튼이 안 보이면 권한 문제가 아니라 **상태가 아직 그 단계가 아닌 것**을 먼저 의심할 것.

  서명자를 본인(legalactuser)으로 지정하는 건 테스트 편의만은 아니다 — 과거 실데이터에도
  `ebs_law_sign` 서명자가 `legalactuser L (법적행위 부서장)` 인 건이 있다(다른 건은 국회의장).
  본인 지정이라야 `btnSign` 이 떠서 같은 세션에서 서명까지 이어갈 수 있다.

  수신자·승인자도 실데이터에서 뽑았다(2026-08-12 DB 확인, 과거 정부이송 공문 3건 전부 일치):
    eas_received_info — 수신자 gduser1(Жалпы бөлүм)
    eas_approval      — 승인자 legalactuser(법적행위 부서장)

  ⚠ **[저장]이 outline, [취소]가 primary 다** — LawRegModal·signerAssignModal·signModal 모두
  색이 뒤집혀 있다. `.btn_primary` 로 잡으면 취소를 누른다(signerAssignModal.vue:230-233).

  전자서명 PIN 모달은 `VITE_ENABLE_SIGN='true'` 일 때만 열리는데 .env.local/staging/production
  전부 `false` 라 **PIN 없이 바로 서명된다**(signModal.vue:39).

  ★ **이송 버튼은 없다.** 공문을 결재하면 서버가 알아서 보낸다 —
  BillMngServiceImpl:498 `TRANSFER_TO_GOVERNMENT -> gvrnTrsfWorkService.autoSendIfReady`.
  즉 3200 전이는 [결재] 클릭의 부수효과이지 별도 액션이 아니다.

  2026-08-12 실행 결과 **의안이 3200 에 도달**했다. DB 확인:
    ebs_bp_tasks       13904 LEGAL_ACTION C(15:27:40), 13905 step 3200 GOVERNMENT_DECISION 생성
    ebs_bp_instance    current_step_id = 3200
    ebs_law_sign       legalactuser 부서장 SS03 (15:23:54)
    ebs_gvrn_trsf_work WS04, send_dt 15:27:41  ← 결재 1초 뒤. autoSendIfReady 가 동작한 증거
    eas_approval       legalactuser 부서장 AS04 (15:27:40), 실행 구간 통틀어 결재는 이 1건뿐(오결재 없음)

  ⚠ 라벨은 PARTIAL 로 찍혔지만 **실질 PASS 다.** executor 가 [결재]를 누른 뒤 결재대기함으로
  돌아가 "신규 공문이 안 보인다"고 보고했는데, 결재했으니 대기함에서 빠지는 게 정상이다.
  자기가 만든 결과를 미처리로 오독한 것 — 라벨만 보고 실패로 읽지 말 것.

  산출물: 의안이 **1900 → 3200(정부이송)** 으로 전진하고 work_stat_cd 가 WS04 가 된다.
on_failure: stop
steps:

  # ── 1) 정부이송 예정 목록에서 진입
  # ⚠ 본회의검증(legalActMng) 목록으로는 못 들어온다 — 2026-08-12 실측: lgactstaff 로는 보이는데
  #   lgactuser 로 같은 화면을 열면 'E2E-SEED' 검색 결과가 Total 0 이다(계정에 따라 목록이 다르다).
  #   work 가 생긴 뒤에는 **정부이송 예정(gvrnTrsfWork) 목록**이 정식 진입점이고 계정을 안 탄다.
  #   작업상태 필터 기본값은 '' (전체)라 WS01~WS04 가 다 나온다(billMngList.vue:24).
  - { action: navigate, url: "/main/billMng/gvrnTrsfWork/billMng" }
  - { action: wait_for, target: { ref: content_title, description: "정부이송 예정(11073) 목록" } }
  - { action: fill, target: { css: ".board_search .form_row .input_item:nth-child(2) input.form_control", description: "의안명 검색칸(input_item 순서: 의안번호 / 의안명 / 작업상태)" }, value: "E2E-SEED" }
  - { action: click, target: { css: ".search_btn button.v_btn.btn_primary", description: "[조회](10053) — 목록 검색 버튼. 라벨이 '검색'이 아니라 **조회**다. 헤더 좌상단의 '검색' 입력칸과 다른 것이니 혼동 금지" } }
  - { action: wait_for, target: { ref: datatable, description: "필터된 목록" } }
  - { action: assert_visible, target: { css: ".p-datatable-tbody tr:first-child", text: "E2E-SEED", description: "첫 행이 E2E-SEED 인지 확인하고 나서 연다" } }
  - { action: double_click, target: { ref: datatable_row, text: "E2E-SEED", description: "E2E-SEED → 정부이송 예정 상세(11074)" } }
  - { action: wait_for, target: { css: ".gtw-billinfo_toggle", description: "정부이송 예정 상세 진입 신호" } }
  - { action: screenshot, name: "08-a-gvrntrsf-detail-ws01" }

  # ── 2) 서명자 지정 — WS01 에서만 뜬다
  - { action: click, target: { css: "button.v_btn", text: "서명자 지정", description: "[서명자 지정/변경](11078) → signerAssignModal" } }
  - { action: wait_for, target: { ref: gtw_search_input, description: "서명자 검색 입력(탭바는 2026-07-30 제거됨, /hrmis/autocomplete 단일 검색)" } }
  - { action: wait_for, target: { ref: gtw_user_row, description: "검색어 없이 초기 목록 로드(limit 30)" } }
  - { action: fill, target: { ref: gtw_search_input, description: "서명자 검색 — HRMIS 표시명 기준" }, value: "legalactuser" }
  - { action: wait_for, target: { ref: gtw_user_row, description: "검색 결과" } }
  - { action: screenshot, name: "08-b-signer-search" }
  # ⚠ legalactuser 는 후보가 2건(부서장·직원)이라 :first-child 로 찍으면 안 된다.
  #   seed-05 1차가 딱 이 실수로 남의 의안을 부의했다 — 행은 반드시 식별자로 집는다.
  - { action: click, target: { ref: gtw_user_row, text: "부서장", description: "legalactuser(법적행위 부서장) 행 체크 → 선택 칩 추가. 본인이라야 다음 [서명]이 뜬다" } }
  - { action: assert_visible, target: { ref: gtw_chip_num, text: "1", description: "선택 칩 순번 1 — 실제로 선택됐는지" } }
  - { action: screenshot, name: "08-c-signer-selected" }
  # [저장]은 outline, [취소]가 primary 다 — 뒤집혀 있으니 주의(signerAssignModal.vue:230-233)
  - { action: click, target: { css: ".p-dialog .popup_footer button.v_btn.btn_outline_primary.btn_md", description: "[저장](10174) → work_stat_cd WS01 → WS02" } }
  - { action: wait_for, target: { css: ".gtw-billinfo_toggle", description: "모달 닫히고 상세 재로드" } }
  - { action: screenshot, name: "08-d-ws02" }

  # ── 3) 서명 — btnSign = mySign 있고 WS02 일 때만
  - { action: assert_visible, target: { css: ".gtw-action_row button.v_btn.btn_primary.btn_md", text: "서명", description: "[서명](10095). 없으면 본인이 서명자로 안 들어갔거나 아직 WS02 가 아니다" } }
  - { action: click, target: { css: ".gtw-action_row button.v_btn.btn_primary.btn_md", text: "서명", description: "[서명] → signModal" } }
  - { action: wait_for, target: { ref: dialog_textarea_full, description: "서명 의견(11098) 입력란 — 모달 진입 신호" } }
  - { action: fill, target: { ref: dialog_textarea_full, description: "서명 의견(선택)" }, value: "E2E-SEED 정부이송 서명" }
  - { action: screenshot, name: "08-e-sign-modal" }
  # VITE_ENABLE_SIGN=false 라 PIN 모달 없이 바로 처리된다. [수정요청]은 btn_outline_error 라 다른 버튼이다.
  - { action: click, target: { css: ".p-dialog .popup_footer button.v_btn.btn_outline_primary.btn_md", text: "서명", description: "[서명] 실행 → 전원 서명 완료 시 WS03" } }
  - { action: wait_for, target: { css: ".gtw-billinfo_toggle", description: "상세 재로드" } }
  - { action: screenshot, name: "08-f-ws03" }

  # ── 4) 공문 작성 — WS03 에서만. 작성은 부서원이 하고 결재는 부서장이 받는다(seed-06 과 같은 구조)
  - { use: switch-account, with: { account: lgactstaff } }
  - { action: navigate, url: "/main/billMng/gvrnTrsfWork/billMng" }
  - { action: wait_for, target: { ref: content_title, description: "정부이송 예정(11073) 목록" } }
  - { action: fill, target: { css: ".board_search .form_row .input_item:nth-child(2) input.form_control", description: "의안명 검색칸(input_item 순서: 의안번호 / 의안명 / 작업상태)" }, value: "E2E-SEED" }
  - { action: click, target: { css: ".search_btn button.v_btn.btn_primary", description: "[조회](10053) — 목록 검색 버튼. 라벨이 '검색'이 아니라 **조회**다. 헤더 좌상단의 '검색' 입력칸과 다른 것이니 혼동 금지" } }
  - { action: wait_for, target: { ref: datatable, description: "필터된 목록" } }
  - { action: assert_visible, target: { css: ".p-datatable-tbody tr:first-child", text: "E2E-SEED", description: "첫 행이 E2E-SEED 인지 확인하고 나서 연다" } }
  - { action: double_click, target: { ref: datatable_row, text: "E2E-SEED", description: "E2E-SEED → 정부이송 예정 상세(11074)" } }
  - { action: wait_for, target: { css: ".gtw-billinfo_toggle", description: "정부이송 예정 상세 진입 신호" } }
  - { action: click, target: { css: "button.v_btn", text: "공문 작성", description: "[공문 작성](11113) → InsertLetter(billType=GVRN_TRSF_LAW). 제목은 법률명으로 자동 채워진다" } }
  - { action: wait_for, target: { css: ".p-dialog", description: "공문 작성 모달" } }
  - { action: screenshot, name: "08-g-letter-modal" }

  # ── 5) 공문 필수값 — 앞 단계들과 같은 InsertLetter 라 셀렉터 동일
  # ⚠ .p-dialog 첫 체크박스는 #docModeOfficial(공문파일 첨부 모드)이라 언어가 아니다.
  # 정부이송 공문만 문서 종류가 자동 지정되지 않는다 — fragment 앞에서 직접 고른다
  - { action: click, target: { css: "#DMT02", description: "문서 종류 '확인용'(DMT02) — 필수*" } }
  - use: insert-letter-modal
    with: { title: "E2E-SEED 정부이송 공문", recipient: "gduser1", recipient_pick: "gduser1", approver: "legalactuser", approver_pick: "부서장", tag: "08-h" }
  - { action: wait_for, target: { css: ".gtw-billinfo_toggle", description: "모달 닫히고 상세 복귀" } }
  - { action: screenshot, name: "08-i-letter-registered" }

  # ── 6) 결재 = 이송 트리거. 별도 [이송] 버튼은 없다
  - { use: switch-account, with: { account: lgactuser } }
  - use: approve-in-approval-inbox
    with: { doc: "E2E-SEED", tag: "08-j" }

  # ── 7) 결과 확인 — 정부이송 목록(gvrnTrsfMng)에 나타나면 3200 이다
  # 법적행위 목록은 stat_cd=ST130(1900) 기준이라 3200 이 되면 거기서는 빠진다.
  # ⚠ **계정을 총무국으로 바꿔야 한다.** 이 목록 API 는 `hasAuthority('GD')` 다
  #   (BillMngController:157 /bill/review/billMng/transferToGovernment). 결재한 lgactuser 는 LGACT 라
  #   Total 0 과 '이 페이지에 접근할 권한이 없습니다' 토스트가 뜬다 — 이송이 안 된 것으로 오독하기 쉽다
  #   (2026-08-28 실측: DB 는 이미 3200 + gvrn_trsf_dt 기록됨).
  - { use: switch-account, with: { account: gduser } }
  - { action: navigate, url: "/main/billMng/gvrnTrsfMng/billMng" }
  - { action: wait_for, target: { ref: content_title, description: "정부이송 목록" } }
  - { action: screenshot, name: "08-l-gvrntrsf-list" }
  - { action: assert_visible, target: { ref: datatable_row, text: "E2E-SEED", description: "E2E-SEED 가 정부이송 목록에 있다 = step 3200(stat_cd ST410) 도달의 증거" } }
