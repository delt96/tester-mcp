id: seed-09-promulgate
title: "[시딩] 공포 — 정부이송 상세에서 결과보고 등록 → [완료] → 3200→3300 (체인 종착)"
locale: kr
login_as: gduser
tags: [seed, e2e-fullflow]
precondition: >
  의안이 **step 3200(정부이송)** 이어야 한다 → `seed-08` 의 정부이송 공문 결재가 만든 상태.

  ★ 계정은 **gduser** 다. 정부이송 메뉴(menu_id 91)는 `com_dept_menu` 에 `GD` 로 매핑돼 있고
  평범한 `LGACT` 단독 매핑은 없다(2026-08-12 확인). 앞 단계의 legalactuser 로 오면 안 된다.
  seed-08 에서 같은 계정 착각으로 목록이 Total 0 이 나온 전례가 있다.

  ★ **공포 화면(prmgMng)은 쓸 수 없다.** 2026-08-12 실측 두 가지:
    ① 메뉴(menu_id 92)가 `use_yn='N'` — 비활성이고 `com_dept_menu` 매핑도 없다
    ② URL 로 열어도 **항상 0건**이다. `/bill/review/billMng` 가 `ebs_bp_tasks` 를 주 테이블로
       조회하는데(BillMngMapper.xml:55 `FROM kgst.ebs_bp_tasks ebt` + `ebt.step_id=3300`)
       step 3300 에는 `ebs_bp_task_definition` 행이 없어 태스크가 생성되지 않는다.
       **3300 태스크 0건 / 3300 에 있는 의안 51건** — 구조적으로 조회가 안 된다.
  그래서 이 시나리오는 **정부이송 상세 안에서** 결과보고 → 완료로 끝내고,
  결과는 **의안정보조회**(menu_id 19)에서 안건상태로 확인한다.

  전이는 `3200 --PROMULGATE--> 3300` 하나다(`ebs_bp_step_transition` id 16).
  같은 3200 에서 `VETO --> 1400` 도 있으니 종류 라디오를 잘못 고르면 위원회로 되돌아간다.
  3300 에는 후속 task_definition 이 없어 **여기가 프로세스 종착**이다.

  두 단계로 나뉜다(gvrnTrsfMng/billMngDtl.vue:47-49):
    btnPrmg   = !task.completed && prmgList.length==0 && 대통령거부 없음   → [결과보고](10218)
    btnReport = !task.completed && (prmgList.length || prsdRjctList.length) → [완료](10184)
  즉 결과보고를 저장해야 [완료]가 생긴다. 처음엔 [완료]가 없는 게 정상이다.
  [완료]가 `/bill/review/promulgate` 를 호출해 3300 으로 넘긴다(같은 파일 65-69).

  ⚠ **공포번호는 10자를 넘기면 안 된다.** `ebs_master.prmg_no` 가 varchar(10) 인데 입력란에
  `maxlength` 가 없어(prmgModal.vue:232) 길게 넣으면 저장 시 500 이 난다. 앱 결함 후보.

  ⚠ **이 모달만 버튼 색이 반대다.** LawRegModal·signerAssignModal·signModal 은 [저장]이
  outline 이었는데 PrmgModal 은 [저장]이 **btn_primary**, [취소]가 outline 이다
  (prmgModal.vue 하단). 모달마다 확인할 것 — 일반화하면 취소를 누른다.

  2026-08-12 실행 결과 **의안이 3300 에 도달**했다(1차 실행은 위 ② 때문에 마지막 단언만 FAIL).
    ebs_bp_instance  current_step_id = 3300
    ebs_bp_tasks     13905 GOVERNMENT_DECISION C (15:41:06)
    ebs_master       prmg_no = 'E2E-2608', prmg_dt = 20260812

  산출물: 의안이 **3200 → 3300(공포)** 으로 전진한다. seed 체인 완주.
on_failure: stop
steps:

  # ── 1) 정부이송 목록 → 상세
  # 목록 기본 상태필터가 searchStatCd='ST410'(billMngList.vue:25)이고 step 3200 의 stat_cd 가
  # 정확히 ST410 이라(ebs_bp_step) 필터를 건드리지 않아도 우리 의안이 나온다.
  - { action: navigate, url: "/main/billMng/gvrnTrsfMng/billMng" }
  - { action: wait_for, target: { ref: content_title, description: "정부이송 목록" } }
  - { action: screenshot, name: "09-a-gvrntrsf-list" }
  - { action: fill, target: { css: ".board_search .form_row .input_item:nth-child(2) input.form_control", description: "의안명 검색칸(input_item 순서: 의안번호 / 의안명 / 상태)" }, value: "E2E-SEED" }
  - { action: click, target: { css: ".search_btn button.v_btn.btn_primary", description: "[조회](10053) — 목록 검색 버튼. 라벨이 '검색'이 아니라 **조회**다. 헤더 좌상단의 '검색' 입력칸과 다른 것이니 혼동 금지" } }
  - { action: wait_for, target: { ref: datatable, description: "필터된 목록" } }
  - { action: assert_visible, target: { css: ".p-datatable-tbody tr:first-child", text: "E2E-SEED", description: "첫 행이 E2E-SEED 인지 확인하고 나서 연다" } }
  - { action: double_click, target: { ref: datatable_row, text: "E2E-SEED", description: "E2E-SEED → 정부이송 상세" } }
  - { action: wait_for, target: { ref: content_title, description: "정부이송 상세" } }
  - { action: screenshot, name: "09-b-detail" }

  # ── 2) [결과보고] → PrmgModal. 아직 결과가 없으니 [완료]는 안 보이는 게 정상이다
  - { action: assert_visible, target: { css: ".btn_group_fixed a.v_btn.btn_primary", text: "결과보고", description: "[결과보고](10218). 없으면 이미 결과가 등록됐거나 태스크가 완료된 것" } }
  - { action: click, target: { css: ".btn_group_fixed a.v_btn.btn_primary", text: "결과보고", description: "[결과보고] → PrmgModal" } }
  - { action: wait_for, target: { css: ".p-dialog .popup_tit", text: "결과보고", description: "결과보고 모달(10218)" } }
  - { action: screenshot, name: "09-c-prmg-modal" }

  # ── 3) 필수값 — 종류(공포) / 결과일자 / 공포번호
  # 종류는 네이티브 라디오다(PrimeVue RadioButton 아님). #prmgKnd_1=공포(값1) / #prmgKnd_2=대통령거부(값2).
  # 기본값이 이미 공포지만, 잘못 고르면 VETO 로 1400 까지 되돌아가므로 명시적으로 찍는다.
  - { action: click, target: { css: "#prmgKnd_1", description: "종류 '공포'(KND_PRMG='1'). #prmgKnd_2 를 고르면 VETO → 1400 으로 역행한다" } }
  # DatePickerComp 는 locale 별로 포맷이 다르다(utils/pvLocale.js): kr='yy-mm-dd', ru/kg='dd-mm-yy'.
  # 이 시나리오는 locale: kr 이므로 2026-08-12 형식으로 넣는다.
  - { action: fill, target: { css: ".p-dialog .v_table tbody tr:nth-of-type(2) .datepicker-comp input", description: "결과일자(10144) 필수*" }, value: "2026-08-12" }
  # ⚠ 10자 이내. prmg_no 가 varchar(10) 인데 maxlength 가 없어 넘기면 저장 시 500 이다.
  - { action: fill, target: { css: ".p-dialog .v_table tbody tr:nth-of-type(3) input.form_control", description: "공포번호(10562) 필수* — 10자 이내" }, value: "E2E-2608" }
  - { action: screenshot, name: "09-d-prmg-filled" }
  # ⚠ 이 모달은 [저장]이 btn_primary 다(다른 모달들과 반대). fnConfirm → ConfirmPopup(10155) 경유.
  - { action: click, target: { css: ".p-dialog .popup_footer button[type=submit].v_btn.btn_primary.btn_md", description: "[저장](10089) → 저장 확인 팝업" } }
  - { action: wait_for, target: { ref: confirm_popup, description: "저장 확인 팝업(10155)" } }
  - { action: click, target: { ref: confirm_accept, description: "Yes → fnSave" } }
  - { action: wait_for, target: { ref: content_title, description: "모달 닫히고 상세로 복귀" } }
  - { action: screenshot, name: "09-e-prmg-saved" }

  # ── 4) [완료] — 결과보고가 저장돼야 비로소 나타난다. 이게 3300 전이 트리거다
  - { action: assert_visible, target: { css: ".btn_group_fixed a.v_btn.btn_primary", text: "완료", description: "[완료](10184) 노출 = prmgList 가 채워졌다는 증거(btnReport 조건)" } }
  - { action: click, target: { css: ".btn_group_fixed a.v_btn.btn_primary", text: "완료", description: "[완료] → ConfirmPopup(10397 '진행하시겠습니까?')" } }
  - { action: wait_for, target: { ref: confirm_popup, description: "진행 확인 팝업(10397)" } }
  - { action: click, target: { ref: confirm_accept, description: "Yes → /bill/review/promulgate → step 3300" } }
  - { action: wait_for, target: { ref: datatable, description: "목록으로 복귀(fnGoList)" } }
  - { action: screenshot, name: "09-f-promulgated" }

  # ── 5) 결과 확인 — 의안정보조회에서 안건상태가 '공포'인지 본다
  #
  # ⚠ 공포 목록(prmgMng)으로는 검증할 수 없다. 2026-08-12 실측으로 확인한 이유 두 가지:
  #   ① 메뉴(menu_id 92)가 `use_yn='N'` 이라 비활성 화면이다
  #   ② URL 로 직접 열어도 **항상 0건**이다. `/bill/review/billMng` 는 `ebs_bp_tasks` 를
  #      주 테이블로 조회하는데(BillMngMapper.xml:55) step 3300 에는 task_definition 이 없어
  #      태스크가 아예 안 생긴다. 실측: 3300 태스크 0건 vs 3300 에 있는 의안 51건.
  #   이건 시나리오 문제가 아니라 화면 쪽 사정이므로 조회 가능한 화면으로 검증한다.
  #
  # 의안정보조회(menu_id 19)는 `/bill/review/all` 을 쓰고 상태필터 기본값이 ''(전체)라 걸린다.
  - { action: navigate, url: "/main/billMng/billSearch/billAllList" }
  - { action: wait_for, target: { ref: content_title, description: "의안정보조회 목록" } }
  - { action: fill, target: { css: ".board_search .form_row .input_item:nth-child(2) input.form_control", description: "의안명 검색칸(input_item 순서: 의안번호 / 의안명 / 상태)" }, value: "E2E-SEED" }
  - { action: click, target: { css: ".search_btn button.v_btn.btn_primary", description: "[조회](10053) — 목록 검색 버튼. 라벨이 '검색'이 아니라 **조회**다. 헤더 좌상단의 '검색' 입력칸과 다른 것이니 혼동 금지" } }
  - { action: wait_for, target: { ref: datatable, description: "필터된 목록" } }
  - { action: screenshot, name: "09-g-bill-search" }
  - { action: assert_visible, target: { css: ".p-datatable-tbody tr:first-child", text: "E2E-SEED", description: "첫 행이 E2E-SEED 인지 먼저 확인" } }
  # statNm 컬럼(billAllList.vue:209)이 안건상태다. ST520 의 한국어 표기가 '공포'(com_code_detail 실측).
  - { action: assert_visible, target: { css: ".p-datatable-tbody tr:first-child", text: "공포", description: "안건상태가 '공포'(ST520) = step 3300 도달 = 체인 종착" } }
