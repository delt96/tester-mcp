id: seed-08b-govtransfer-letter-resume
title: "[시딩] 정부이송 공문만 — 08 이 서명(WS03)까지 끝난 상태에서 이어받는다 (1900 → 3200)"
locale: kr
login_as: lgactstaff
tags: [seed, e2e-fullflow]
precondition: >
  ★ **`08` 의 뒷부분(공문 작성 → 결재)만 떼어낸 파일이다.** `08` 앞부분의 [서명자 지정]은
  **WS01 에서만** 뜨므로, 이미 서명까지 끝난(WS03) 상태에서 `08` 을 통째로 재실행하면 거기서 멈춘다.
  (2026-08-28: `08` 이 73스텝까지 통과해 WS01 → WS02 → **WS03** 까지 갔고,
   공문 모달의 [등록하기]에서 멈췄다. 원인은 아래 '문서 종류' 미선택이었다.)

  ★ **이송 버튼은 없다.** 공문을 결재하면 서버가 알아서 보낸다
  (`BillMngServiceImpl:498` `TRANSFER_TO_GOVERNMENT -> autoSendIfReady`).
  결재 후 결재대기함에서 사라지는 것은 정상이다 — "공문이 안 보인다"로 오독하지 말 것.
on_failure: stop
steps:

  # ── 1) 공문 작성 — WS03 에서만. 작성은 부서원이 하고 결재는 부서장이 받는다
  - { action: navigate, url: "/main/billMng/gvrnTrsfWork/billMng" }
  - { action: wait_for, target: { ref: content_title, description: "정부이송 예정(11073) 목록" } }
  - { action: fill, target: { css: ".board_search .form_row .input_item:nth-child(2) input.form_control", description: "의안명 검색칸(순서: 의안번호 / 의안명 / 작업상태)" }, value: "E2E-SEED ${today}" }
  - { action: click, target: { css: ".search_btn button.v_btn.btn_primary", description: "[조회](10053) — 라벨은 '조회'다. 헤더의 '검색' 입력칸이 아니다" } }
  - { action: wait_for, target: { ref: datatable, description: "필터된 목록" } }
  - { action: assert_visible, target: { css: ".p-datatable-tbody tr:first-child", text: "E2E-SEED ${today}", description: "첫 행이 E2E-SEED 인지 확인하고 나서 연다" } }
  - { action: double_click, target: { ref: datatable_row, text: "E2E-SEED ${today}", description: "E2E-SEED → 정부이송 예정 상세(11074)" } }
  - { action: wait_for, target: { css: ".gtw-billinfo_toggle", description: "정부이송 예정 상세 진입 신호" } }
  - { action: screenshot, name: "08b-a-detail-ws03" }
  - { action: click, target: { css: "button.v_btn", text: "공문 작성", description: "[공문 작성](11113) → InsertLetter(billType=GVRN_TRSF_LAW)" } }
  - { action: wait_for, target: { css: ".p-dialog", description: "공문 작성 모달" } }
  - { action: screenshot, name: "08b-b-letter-modal" }

  # ── 2) 공문 필수값
  # ⚠ .p-dialog 첫 체크박스는 #docModeOfficial(공문파일 첨부 모드)이라 언어가 아니다.
  # 정부이송 공문만 문서 종류가 자동 지정되지 않는다 — fragment 앞에서 직접 고른다
  - { action: click, target: { css: "#DMT02", description: "문서 종류 '확인용'(DMT02) — 필수*" } }
  - use: insert-letter-modal
    with: { title: "E2E-SEED ${today} 정부이송 공문", recipient: "gduser1", recipient_pick: "gduser1", approver: "legalactuser", approver_pick: "부서장", tag: "08b-c" }
  - { action: wait_for, target: { css: ".gtw-billinfo_toggle", description: "모달 닫히고 상세 복귀" } }
  - { action: screenshot, name: "08b-d-letter-registered" }

  # ── 3) 결재 = 이송 트리거. 별도 [이송] 버튼은 없다
  - { use: switch-account, with: { account: lgactuser } }
  - use: approve-in-approval-inbox
    with: { doc: "E2E-SEED ${today} 정부이송 공문", tag: "08b-e" }

  # ── 4) 결과 확인 — 정부이송 목록(gvrnTrsfMng)에 나타나면 3200 이다
  # 법적행위 목록은 stat_cd=ST130(1900) 기준이라 3200 이 되면 거기서는 빠진다.
  # ⚠ **계정을 총무국으로 바꿔야 한다.** 이 목록 API 는 `hasAuthority('GD')` 다
  #   (BillMngController:157 /bill/review/billMng/transferToGovernment). 결재한 lgactuser 는 LGACT 라
  #   Total 0 과 '이 페이지에 접근할 권한이 없습니다' 토스트가 뜬다 — 이송이 안 된 것으로 오독하기 쉽다
  #   (2026-08-28 실측: DB 는 이미 3200 + gvrn_trsf_dt 기록됨).
  - { use: switch-account, with: { account: gduser } }
  - { action: navigate, url: "/main/billMng/gvrnTrsfMng/billMng" }
  - { action: wait_for, target: { ref: content_title, description: "정부이송 목록" } }
  - { action: screenshot, name: "08b-g-gvrntrsf-list" }
  - { action: assert_visible, target: { ref: datatable_row, text: "E2E-SEED ${today}", description: "E2E-SEED 가 정부이송 목록에 있다 = step 3200(stat_cd ST410) 도달의 증거" } }
