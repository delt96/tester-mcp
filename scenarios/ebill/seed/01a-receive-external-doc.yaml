id: seed-01a-receive-external-doc
title: "[시딩] 외부수신문서 접수 — 의안등록 대기함에 '등록대기' 행을 만든다 (seed-01 의 선행)"
locale: kr
login_as: gduser
tags: [seed, e2e-fullflow]
precondition: >
  `seed-01` 은 의안등록 대기함에 처리상태 **'등록대기'** 행이 있어야 시작된다.
  이 시나리오가 그 행을 만든다. 2026-08-12 이전에는 이 경로가 시나리오로 없어서
  `seed-01` 이 한 번도 못 돌았다(큐가 비어 NOT_TESTED).

  ★ 큐가 비었는지 판정할 때 `ebs_bill_reg_wait` 에 `status='WAIT'` 행이 있는 것만으로는 부족하다.
  2026-08-12 실측: WAIT 1건이 있었지만 `draft_yn='Y'` / `doc_id` 빈 값이라 쓸 수 없었다.
  화면 라벨과 더블클릭 경로 **둘 다 `draft_yn` 을 먼저 본다**(billRegWaitList.vue:151, 93):
      draftYn='Y' → '임시저장'(10998) 표시 + draftId 경로
      status='WAIT' → '등록대기'(10267) 표시 + extDocId+waitId 경로   ← seed-01 이 필요한 것
  즉 **`status='WAIT' AND draft_yn<>'Y' AND doc_id IS NOT NULL`** 이라야 진짜 등록대기 행이다.

  대상 문서는 외부수신함(`kgst.documents`, `workflow='in'`)의 **미접수** 건이다.
  2026-08-12 기준 54건이 미접수였고 그중 `BILL0812`(id 344, 13:20 수신)를 골랐다.
  이 문서가 이미 접수됐거나 없어지면 아래 검색어를 다른 미접수 건으로 바꾼다:

    SELECT d.id, d.title FROM kgst.documents d
     WHERE d.workflow='in' AND d.status IN ('in','closed','refunded')
       AND NOT EXISTS (SELECT 1 FROM kgst.ebs_bill_reg_wait w WHERE w.doc_id = d.id)
     ORDER BY d.registration_date DESC;

  ⚠ 목록은 **더블클릭이 아니라 단일 클릭**으로 상세에 들어간다(`@row-click="fn_detail"`,
  ExternalReceive.vue:159). 다른 의안 목록들이 `@row-dblclick` 이라 습관적으로 double_click
  을 쓰면 안 열린다.

  ★★ **접수 가능 조건은 `documents.status='in'` 이다.** 이게 이 시나리오의 전제 전부다.

    const isProcessed  = computed(() => ['closed','refunded'].includes(docData.value?.status));
    const showEditForm = computed(() => !props.externalId || (!!docData.value && !isProcessed.value));
    // [의안 등록 접수] 버튼은 v-if="showEditForm" 블록 안에 있다 (InsertExternal.vue:269-287)

  `closed`/`refunded` 면 `isProcessed=true` → 버튼이 있는 블록이 통째로 안 그려지고
  읽기전용 요약 화면(`v-else-if="isProcessed"`)이 뜬다. **버튼이 사라진 게 아니라 화면이 다른 것.**

  ⚠ 2026-08-12 실측: 외부수신함 64건이 **전부 `closed`, `'in'` 은 0건**이었다.
  즉 그날 기준 **UI로 접수할 수 있는 문서가 하나도 없었다.**
  `ebs_bill_reg_wait` 에 없다는 것(=미접수)과 접수 *가능*한 것은 다르다 — 후자는 status 로만 정해진다.

  그래서 `BILL0812`(id 344)를 접수 가능 상태로 되돌려 두고 시나리오를 세웠다:

    -- 준비 (필요할 때만)
    UPDATE kgst.documents SET status='in' WHERE id=344;
    -- 롤백
    UPDATE kgst.documents SET status='closed' WHERE id=344;

  `kgst.documents` 는 게이트웨이 전용 미러가 아니라 **앱이 직접 INSERT/UPDATE** 하는 테이블이다
  (`ExternalDocumentsMapper.xml:5, 24` — `status` 도 앱이 갱신한다). 그래서 이 변경은 안전하고 되돌릴 수 있다.

  ⚠ 상태 필터 기본값도 `'in'` 이다(`DEFAULT_STATUS`, ExternalReceive.vue:21).
  문서가 `closed` 뿐이던 동안에는 기본 화면이 늘 비어 있었고, 제목만 검색해도 Total 0 이었다
  — 1차 실행이 정확히 여기서 멈췄다.

  산출물: `ebs_bill_reg_wait` 에 `status='WAIT'`, `doc_id`=선택한 문서인 행이 생기고
  화면이 의안등록 대기함으로 자동 이동한다. 이어서 `seed-01` 을 돌리면 된다.
on_failure: stop
steps:

  # ── 1) 외부수신함 → 제목으로 대상 문서 좁히기
  - { action: navigate, url: "/main/letter/external/receive" }
  - { action: wait_for, target: { ref: datatable, description: "외부수신함 그리드" } }
  - { action: screenshot, name: "01a-a-external-inbox" }
  # 검색칸은 .search_one 단위다. 순서: 등록일자범위 / 처리기한 / 제목 / 문서번호 / 상태.
  # 라벨은 i18n 이라 텍스트로 잡지 않고 위치로 잡는다(ExternalReceive.vue:112-137).
  #
  # ⚠ 상태를 먼저 풀어야 한다. `DEFAULT_STATUS='in'`(ExternalReceive.vue:21)이라 목록이
  #   **수신 상태만** 보여주는데, 실제 문서는 전부 'closed' 다(2026-08-12 실측 64/64).
  #   이걸 안 건드리면 제목이 맞아도 Total 0 이 나온다 — 1차 실행이 여기서 끝났다.
  #   네이티브 select 라 fill 로 값을 넣는다. 값: ''=전체 / in=수신 / closed=완료 / refunded=반려.
  - { action: fill, target: { css: ".board_search .search_area .search_one:nth-child(5) select.form_control", description: "상태(10056) 셀렉트 — 접수 가능한 건은 'in'(수신)이다. @change 가 걸려 있어 바꾸는 순간 재조회된다" }, value: "in" }
  - { action: wait_for, target: { ref: datatable, description: "상태 변경으로 자동 재조회" } }
  - { action: fill, target: { css: ".board_search .search_area .search_one:nth-child(3) input.form_control", description: "제목(10049) 검색칸" }, value: "BILL0812" }
  - { action: click, target: { css: ".button_area button.search_button", description: "[조회](10053) — 목록 검색 버튼. 라벨이 '검색'이 아니라 **조회**다. 헤더 좌상단의 '검색' 입력칸과 다른 것이니 혼동 금지" } }
  - { action: wait_for, target: { ref: datatable, description: "필터된 목록" } }
  - { action: assert_visible, target: { css: ".p-datatable-tbody tr:first-child", text: "BILL0812", description: "첫 행이 대상 문서인지 확인하고 나서 연다 — 필터 없이 첫 행을 집으면 남의 문서를 접수한다" } }
  - { action: screenshot, name: "01a-b-filtered" }

  # ── 2) 상세 진입 — 단일 클릭이다
  - { action: click, target: { css: ".p-datatable-tbody tr:first-child", description: "행 단일 클릭 → /main/letter/external/insert/{id} (InsertExternal.vue)" } }
  - { action: wait_for, target: { css: ".v_btn.btn_outline_primary", text: "의안 등록 접수", description: "[의안 등록 접수](11048) — 상세 진입 신호이자 미접수 상태의 증거" } }
  - { action: screenshot, name: "01a-c-detail" }

  # ── 3) 접수 → ConfirmPopup → 대기함으로 자동 이동
  # ⚠ 이미 접수된 문서면 이 버튼 대신 [접수 취소](11050)가 뜬다(v-if="!regWaitInfo").
  #   그 경우 위 assert 에서 걸리므로 조용히 취소를 누르는 사고는 안 난다.
  - { action: click, target: { css: ".v_btn.btn_outline_primary", text: "의안 등록 접수", description: "[의안 등록 접수] → fnReceiveForBill" } }
  - { action: wait_for, target: { ref: confirm_popup, description: "'의안 등록 접수하시겠습니까?'(11058)" } }
  - { action: click, target: { ref: confirm_accept, description: "Yes → POST /bill/regWait → 대기함으로 router.push" } }

  # ── 4) 결과 확인 — 대기함에 '등록대기' 행이 생겼는가
  - { action: wait_for, target: { ref: datatable, description: "의안등록 대기함으로 자동 이동(InsertExternal.vue:190)" } }
  - { action: screenshot, name: "01a-d-reg-wait-queue" }
  - { action: assert_visible, target: { ref: datatable_row, text: "등록대기", description: "처리상태 '등록대기'(10267) 행 존재 = seed-01 이 돌 수 있는 상태. '임시저장'만 보이면 draft_yn 행이라 seed-01 은 못 쓴다" } }
