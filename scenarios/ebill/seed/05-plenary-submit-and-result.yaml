id: seed-05-plenary-submit-and-result
title: "[시딩] 본회의 부의 → 안건부의하기 → 결과 가결 → 본회의검증요청 (파일 업로드 없이 전 구간 자동화 가능)"
locale: kr
login_as: mainmtng
tags: [seed, e2e-fullflow]
precondition: >
  의안이 **step 1500(위원회심사완료)** 이어야 한다. 1400(위원회심사)에서는 본회의 안건 후보에
  나타나지 않는다 — 2026-08-12 실측으로 확인한 조건이다:

    MtngFromMapper.xml:  (bp_df_id='1' AND current_step_id IN ('1500'))
                      OR (bp_df_id='2' AND current_step_id IN ('1400'))

  1500으로 올리려면 **위원회 의견서를 등록하고 부서장이 결재**해야 한다(seed-04 참조).
  심사보고서 등록만으로는 올라가지 않는다.

  이 시나리오는 **파일 업로드가 전혀 필요 없어** tester-mcp만으로 끝까지 돌릴 수 있다.
  의견서·톡돔·법률등록·정부이송 공문은 공문파일이 필수라 자동화가 불가능하다(README 참조).

  산출물: 의안이 1500 → 1700(본회의심사) → 본회의검증 상태까지 전진한다.
on_failure: stop
steps:

  # ── 1) 본회의 등록 (회기·차수는 중복되지 않는 값으로)
  - { action: navigate, url: "/main/mtng/mainMtng1/create" }
  - { action: wait_for, target: { css: "input[placeholder='회기']", description: "본회의부의예정 등록 폼" } }
  - { action: screenshot, name: "05a-plenary-create-form" }
  - { action: fill, target: { css: "input[placeholder='회기']", description: "회기(필수)" }, value: "7" }
  - { action: fill, target: { css: "input[placeholder='차수']", description: "차수(필수)" }, value: "997" }

  # ── 2) 안건추가 — 1500 상태 의안만 후보로 뜬다
  - { action: click, target: { css: "a, button", text: "안건추가", description: "[안건추가] → 안건 등록하기 모달" } }
  - { action: wait_for, target: { css: ".p-dialog .p-datatable-tbody tr", description: "안건 후보 그리드" } }
  - { action: screenshot, name: "05b-agenda-candidates" }
  - { action: assert_visible, target: { css: ".p-dialog", text: "E2E", description: "E2E 마커 의안이 후보에 있어야 한다. 없으면 아직 1500이 아니다" } }
  - { action: click, target: { css: ".p-dialog .p-datatable-tbody tr:first-child td:first-child .p-checkbox-box, .p-dialog .p-datatable-tbody tr:first-child input[type=checkbox]", description: "첫 행 체크" } }
  - { action: click, target: { css: ".p-dialog button", text: "확인", description: "[확인] — 모달 하단. 상단의 [안건 입력]은 자유안건 직접입력이라 다른 기능이다" } }
  - { action: wait_for, target: { css: ".p-datatable-tbody tr", description: "안건 그리드에 행이 추가됨" } }
  - { action: screenshot, name: "05c-agenda-added" }

  # ── 3) 저장 → ConfirmPopup
  - { action: click, target: { ref: btn_primary_md, text: "저장", description: "[저장]" } }
  - { action: wait_for, target: { ref: confirm_popup, description: "저장 확인 팝업" } }
  - { action: click, target: { ref: confirm_accept, description: "Yes" } }
  - { action: wait_for, target: { ref: datatable, description: "본회의부의예정 목록으로 복귀" } }
  - { action: screenshot, name: "05d-plenary-saved" }

  # ── 4) 상세 진입 → [안건부의하기]  ← 이게 1700 전이 트리거(PROPOSE_TO_PLENARY)
  #     저장만으로는 부의여부가 '부의예정'에 머문다
  - { action: double_click, target: { ref: datatable_row, text: "E2E", description: "방금 만든 회의 행 더블클릭 → 상세(update?mtngId=…)" } }
  - { action: wait_for, target: { css: "a, button", text: "안건부의하기", description: "[안건부의하기] 버튼 — 상세 진입 신호" } }
  - { action: assert_visible, target: { css: "body", text: "부의예정", description: "부의 전 상태" } }
  - { action: screenshot, name: "05e-before-submit" }
  - { action: click, target: { css: "a, button", text: "안건부의하기", description: "[안건부의하기]" } }
  - { action: wait_for, target: { ref: confirm_popup, description: "안건부의하시겠습니까?" } }
  - { action: click, target: { ref: confirm_accept, description: "Yes" } }
  - { action: wait_for, target: { css: "body", text: "부의완료", description: "부의여부가 '부의완료'로 바뀌어야 한다 = step 1700" } }
  - { action: screenshot, name: "05f-submitted" }

  # ── 5) 본회의결과입력 — 결과 '가결' 선택 후 [본회의검증요청]
  - { action: navigate, url: "/main/mtng/mainMtngResult" }
  - { action: wait_for, target: { ref: datatable, description: "본회의결과입력 목록" } }
  - { action: screenshot, name: "05g-result-list" }
  # 결과 셀렉트는 네이티브 select 다. 값: PL01=가결 / PL02=부결 / PL03=불성립
  - { action: assert_visible, target: { ref: datatable_row, text: "E2E", description: "부의된 의안이 결과입력 목록에 나타나야 한다(안건상태 '본회의')" } }
  - { action: click, target: { css: ".p-datatable-tbody tr:first-child select", description: "첫 행 결과 셀렉트" } }
  - { action: click, target: { css: ".p-datatable-tbody tr:first-child select option[value='PL01']", description: "가결(PL01)" } }
  - { action: click, target: { css: ".p-datatable-tbody tr:first-child input[type=checkbox], .p-datatable-tbody tr:first-child .p-checkbox-box", description: "행 선택 체크박스 — 검증요청은 체크된 행만 처리한다" } }
  - { action: screenshot, name: "05h-result-selected" }
  - { action: click, target: { css: "a, button", text: "본회의검증요청", description: "[본회의검증요청]" } }
  - { action: wait_for, target: { ref: confirm_popup, description: "본회의검증요청을 하시겠습니까?" } }
  - { action: click, target: { ref: confirm_accept, description: "Yes" } }

  # ── 6) 결과 확인 — 안건상태가 '본회의검증'으로 바뀐다
  - { action: wait_for, target: { ref: datatable, description: "목록 갱신" } }
  - { action: screenshot, name: "05i-verification-requested" }
  - { action: assert_visible, target: { css: "body", text: "본회의검증", description: "안건상태 전환 확인 = step 1900(LEGAL_ACTION) task 생성됨" } }
