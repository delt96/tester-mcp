id: seed-26-my-info-password
title: "[파괴적] 나의 정보 — 알림 수신 설정 변경 + 비밀번호 변경"
locale: kr
login_as: lgactstaff
tags: [seed, mypage, destructive]
precondition: >
  ★ **산출물 `TS-EBS-18`(나의 정보) 중 마이페이지 구간을 덮는다.**
  대상 계정: `lgactstaff`(= `legalactuser2`, `employee_profile.id = 4`).

  ⚠⚠ **파괴적이다 — 이 계정의 비밀번호가 실제로 바뀐다.**
    실행 후 **반드시** 원복할 것:
      `psql -h 3.39.79.144 -U best -d bestian -f scenarios/ebill/_rollback/20260814_employee_password_restore.sql`
    원복 전까지 `lgactstaff` 로그인이 막혀 그 계정을 쓰는 시나리오가 전부 멈춘다.
    ⚠ 스크립트 내부에 `BEGIN`/`COMMIT` 이 있어 바깥 트랜잭션으로 감싸도 격리되지 않는다. `psql -f` 로 그대로 실행.

  ★ **나의정보의 모든 변경은 `employee_profile` 한 테이블로 간다**(MyInfoServiceImpl.updateMyInfo):
    비밀번호 → `savePassword(id, BCrypt)` · 프로필이미지 → `updateProfileImgPath` · 알림수신 → `updateMsgRcvYn`

  ★ **비밀번호 규칙 5가지**(myInfoView.vue:155-180). 하나라도 어기면 저장이 막힌다:
    ① 15자 이상 ② 소문자 ③ 대문자 ④ 숫자 ⑤ 특수문자 `!@#$%^&*`
    ⚠ 기존 테스트 계정 비밀번호(8자)가 이 규칙을 만족하지 않는 것은
      **테스트 서버라서 허용해 둔 것이다**(사용자 확인 2026-08-14). 결함이 아니다.
      다만 화면에서 한 번 바꾸면 그때부터는 규칙이 강제되므로 반드시 원복할 것.
    새 비밀번호는 `${secrets.pwchange.password}` 로 참조한다(값은 secrets 파일에만 둔다).

  ★ **현재 비밀번호 검증이 서버에서 일어난다.** 틀리면 `IllegalArgumentException("CURRENT_PASSWORD_MISMATCH")`.
    `password_reset_required = true`(최초 로그인 강제변경) 인 계정만 현재 비밀번호 없이 바꿀 수 있다.

  ★ 비밀번호 입력칸은 **`input[type=password].form_control` 3개가 순서 고정**이다:
    (1) 기존 비밀번호(10986) — `v-if="!store.passwordResetRequired"` 라 강제변경 계정에는 없다
    (2) 새 비밀번호(10616)  (3) 비밀번호 확인(10614)

  ★ **이 시나리오가 덮지 않는 것**(산출물 절차 중):
    · "로그인 화면에서 아이디 입력 후 **Enter 키**" — DSL 에 keypress 액션이 없다. **자동화 불가.**
    · "존재하지 않는 계정 / 비밀번호 틀린 계정으로 로그인 시도" — 로그인 fragment 밖의 음성 케이스라 별도 필요.
    · "비밀번호가 설정되지 않은 계정으로 **최초 로그인**" — `password_reset_required=true` 계정을 만들어야 해서 제외.
    · **프로필 이미지 변경** — 파일 업로드 자체는 가능하나(`#imgPath`) 원복 대상이 늘어 제외했다.
      (원복 스크립트에 `profile_img_path` 는 포함해 뒀다.)
on_failure: stop
steps:
  - { action: navigate, url: "/myPage/myInfo" }
  - { action: wait_for, target: { css: ".btn_group_fixed button.btn_primary", description: "나의정보 화면 로드 — 하단 고정 저장 버튼" } }
  - { action: wait_for, target: { css: "input[type=password].form_control", description: "비밀번호 입력칸 렌더" } }
  - { action: screenshot, name: "26-a-myinfo" }

  # ── 알림 수신 설정 변경 (라디오)
  # ⚠ 이 계정의 원래 값이 무엇이든 '수신안함'으로 바꿨다가 마지막에 '수신'으로 되돌린다.
  #   employee_profile 에는 msg_rcv_yn 컬럼이 없어 반영처를 확인하지 못했으므로 화면 상태로만 판단한다.
  - { action: click, target: { css: "#inputRadio1_2", description: "알림 수신 '수신안함'(10333) 선택" } }
  - { action: assert_visible, target: { css: "#inputRadio1_2:checked", description: "라디오가 실제로 바뀌었는지" } }
  - { action: click, target: { css: "#inputRadio1_1", description: "다시 '수신'(10266)으로 되돌린다 — 저장 시점에는 원래 값이 되도록" } }
  - { action: assert_visible, target: { css: "#inputRadio1_1:checked", description: "★ 알림 수신 설정이 토글된다(양방향 확인)" } }

  # ── 비밀번호 변경
  # ⚠ **행 인덱스로 잡지 말 것.** 위쪽 행들이 `v-if`(type==='member' 등)로 붙었다 떨어져 번호가 흔들린다.
  #   대신 **td 의 colspan 유무**로 가른다(myInfoView.vue:104-144):
  #     · 기존 비밀번호  → `td[colspan="3"]` 안의 유일한 password 입력
  #     · 새 비밀번호    → colspan 없는 td 중 **첫째**
  #     · 비밀번호 확인  → colspan 없는 td 중 **둘째**
  #   colspan 없는 td 는 이 두 칸뿐이다(나머지 행은 전부 colspan="3").
  # ⚠ 비밀번호에는 `assert_value` 를 걸지 않는다 — 실행 리포트에 값이 그대로 찍힌다.
  - { action: click, target: { css: ".v_table td[colspan='3'] input[type=password].form_control", description: "기존 비밀번호 포커스" } }
  - { action: fill, target: { css: ".v_table td[colspan='3'] input[type=password].form_control", description: "기존 비밀번호(10986) — 서버가 BCrypt 로 대조한다(틀리면 CURRENT_PASSWORD_MISMATCH)" }, value: "${secrets.lgactstaff.password}" }
  - { action: screenshot, name: "26-b-current-pw" }

  - { action: click, target: { css: ".v_table td:not([colspan]):nth-of-type(1) input[type=password].form_control", description: "새 비밀번호 포커스" } }
  - { action: fill, target: { css: ".v_table td:not([colspan]):nth-of-type(1) input[type=password].form_control", description: "새 비밀번호(10616) — 규칙 5가지를 만족하는 값" }, value: "${secrets.pwchange.password}" }
  - { action: click, target: { css: ".v_table td:not([colspan]):nth-of-type(2) input[type=password].form_control", description: "비밀번호 확인 포커스" } }
  - { action: fill, target: { css: ".v_table td:not([colspan]):nth-of-type(2) input[type=password].form_control", description: "비밀번호 확인(10614) — 새 비밀번호와 다르면 t10612 로 막힌다" }, value: "${secrets.pwchange.password}" }
  - { action: screenshot, name: "26-c-new-pw" }

  # ── 저장 → 확인
  - { action: click, target: { css: ".btn_group_fixed button.btn_primary", description: "[저장](10000) → fnValidate() 통과 시 confirm.require" } }
  - { action: wait_for, target: { ref: confirm_popup, description: "★ 저장 확인 팝업 — 산출물의 '확인 버튼 클릭' 단계" } }
  - { action: click, target: { ref: confirm_accept, description: "확인 → POST myPage/myInfo (multipart)" } }
  - { action: wait_for, target: { ref: toast_success, description: "★ 저장 성공. 여기서 실패하면 현재 비밀번호 불일치(CURRENT_PASSWORD_MISMATCH)이거나 규칙 위반이다" } }
  - { action: screenshot, name: "26-d-saved" }
