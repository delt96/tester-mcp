id: seed-00c-gd-reception
title: "[시딩] 의안접수 — GD가 등록요청 건을 접수 (step 1000 → 1200)"
locale: kr
login_as: gduser
tags: [seed, e2e-fullflow]
precondition: >
  ★ **체인의 빠진 고리다.** 지금까지 검증한 구간은 1200부터였고, 의안이 1200에 도달한 것은
  **사람이 손으로 접수했기 때문**이다(2026-08-12). `seed-01`(외부수신문서 경로)은 대기 큐가
  비어 한 번도 실행되지 않았다. 이 시나리오가 1000 → 1200 을 자동화한다.

  전이 정의(`ebs_bp_step_transition`, bp_df_id=1):
      0    --REQUEST_REGISTRATION--> 1000     ← `00b`
      1000 --REGISTRATION-->         1200     ← 이 시나리오
  step 코드: 0=ST001(안건등록) / **1000=ST010(안건접수관리)** / 1200=ST100(법률부서검토관리)

  ★ `00b` 가 만든 **step 1000 `REGISTRATION`(assigned_to=GD)** 태스크가 있어야 한다.
  선행: `00a` → `00b` → 이 파일. 의원 발의 경로의 마지막 조각이다.

  목록 기본 상태필터가 `searchStatCd='ST010'`(billMngRcList.vue:23)이고 step 1000 의 stat_cd 가
  정확히 ST010 이라 필터를 건드리지 않아도 대상이 나온다.

  [등록](10103)은 `btnBillRegister` 로 게이트된다 —
  `billDetail.currentStep.billStep === "PENDING_REGISTRATION"` 일 때만 보인다
  (billMngRcDtl.vue:36-43). 버튼이 없으면 이미 접수됐거나 단계가 다른 것이다.

  필수 입력값은 **없다.** `resolver` 의 검증(rcpDt)이 주석 처리돼 있다(billMngRcDtl.vue:105-110).
  접수일자를 채울 필요가 없다 — 산출물에 입력 절차가 적혀 있다면 그쪽이 낡은 것이다.

  ⚠ **비가역**: [등록]을 누르면 의안이 1200 으로 전진한다. 화면에 되돌리는 기능이 없고
  재실행하면 [등록] 버튼 자체가 사라진다(`billStep !== 'PENDING_REGISTRATION'`).
  다시 돌리려면 `00a` → `00b` 로 새 의안을 만들어야 한다.

  산출물: 의안이 **1200(법률부서검토관리)** 로 전진해 `seed-01`/`01b` 의 법률검토 이행요청 대상이 된다.
on_failure: stop
steps:

  # ── 1) 의안접수 목록 → 대상 의안
  - { action: navigate, url: "/main/billMng/gdMng/billMngRc" }
  - { action: wait_for, target: { ref: content_title, description: "의안접수 목록" } }
  - { action: screenshot, name: "00c-a-list" }
  # ★ 필터를 먼저 걸고 첫 행이 맞는지 단언한 뒤에 연다(seed-05 1차 사고 규칙).
  #   단언과 조작 대상을 둘 다 tr:first-child 로 통일한다.
  # ⚠ 검색 영역 구조가 의안제출 목록(`/main/bill/apply`)과 **다르다.** 여기는 `.board_search.type2` 라
  #   `.form_row` 가 2개이고 각 행에 `.input_item` 이 2개뿐이다(billMngRcList.vue:162-189).
  #     1행: 의안번호(10292) / **의안명(10293)**   2행: 제출일자 / 안건상태(select, searchStatCd)
  #   의안제출 목록에서 쓰던 `.input_item:nth-child(3)` 은 **여기서 아무것도 매칭하지 않는다.**
  #   목록 화면마다 검색칸 순서를 다시 확인할 것 — 클래스가 같다고 구조가 같지 않다.
  - { action: fill, target: { css: ".board_search.type2 .form_row:first-child .input_item:nth-child(2) input.form_control", description: "의안명(10293) 검색칸 — 1행 두 번째 칸" }, value: "E2E-SEED MP" }
  - { action: click, target: { css: ".search_btn button.v_btn.btn_primary", description: "[조회](10053) — 목록 검색 버튼. 라벨이 '검색'이 아니라 **조회**다. 헤더 좌상단의 '검색' 입력칸과 다른 것이니 혼동 금지" } }
  - { action: wait_for, target: { ref: datatable, description: "필터된 목록" } }
  - { action: assert_visible, target: { css: ".p-datatable-tbody tr:first-child", text: "E2E-SEED MP", description: "첫 행이 E2E-SEED MP 인지 확인하고 나서 연다. 없으면 00b 의 등록요청이 안 걸린 것이다" } }
  - { action: screenshot, name: "00c-b-filtered" }
  - { action: double_click, target: { css: ".p-datatable-tbody tr:first-child", description: "위에서 단언한 그 행을 연다 → 의안접수 상세(@row-dblclick, billMngRcList.vue:217)" } }
  - { action: wait_for, target: { ref: content_title, description: "의안접수 상세" } }
  - { action: screenshot, name: "00c-c-detail" }

  # ── 2) 접수 — 필수 입력 없음. 확인 팝업만 거친다
  - { action: assert_visible, target: { css: ".btn_group_fixed button[type=submit].v_btn.btn_primary.btn_md", text: "등록", description: "[등록](10103) — billStep 이 PENDING_REGISTRATION 일 때만 보인다. 없으면 이미 접수됐거나 단계가 다르다" } }
  - { action: click, target: { css: ".btn_group_fixed button[type=submit].v_btn.btn_primary.btn_md", text: "등록", description: "[등록] → 확인 팝업(10165 '안건을 접수 하시겠습니까?')" } }
  - { action: wait_for, target: { ref: confirm_popup, description: "접수 확인 팝업" } }
  - { action: click, target: { ref: confirm_accept, description: "Yes → POST /bill/review/billRegisterMng → step 1200" } }
  - { action: wait_for, target: { ref: datatable, description: "목록으로 복귀(fnGoList)" } }
  - { action: screenshot, name: "00c-d-registered" }

  # ── 3) 결과 확인 — 법무실검토서 목록에 나타나면 1200 이다
  # 의안접수 목록은 stat_cd=ST010(1000) 기준이라 1200 이 되면 거기서는 빠진다.
  - { use: switch-account, with: { account: lgrvhead } }
  - { action: navigate, url: "/main/billMng/lgReviewMng/billMng" }
  - { action: wait_for, target: { ref: content_title, description: "법무실검토서 목록" } }
  - { action: screenshot, name: "00c-e-lgreview-list" }
  - { action: assert_visible, target: { ref: datatable_row, text: "E2E-SEED MP", description: "법무실검토서 목록에 나타남 = step 1200(ST100) 도달의 증거. 여기서부터 seed-01b 가 이어받는다" } }
