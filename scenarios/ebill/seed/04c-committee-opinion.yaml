id: seed-04c-committee-opinion
title: "[시딩] 소관위원회 의견서 — 위원회 부서원 작성 → 총무국 수신 → 위원회 부서장 결재 → 1400→1500 전이"
locale: kr
login_as: cmtstaff
tags: [seed, e2e-fullflow]
precondition: >
  seed-04 로 소관위원회 부서장(cmtuser1)이 부서원(cmtuser10)에게 이행요청을 걸고
  **[C] 주 이행자까지 지정**돼 있어야 한다. 주 이행자가 아니면 [의견서 작성]이 안 뜬다
  (billCmtReviewDtl.vue:63 btnInsertLetter = workerId/workReqId 있고 resultDocId 없을 때).

  ★ 이 시나리오가 **1400 → 1500 전이의 유일한 트리거**다. 2026-08-12 `ebs_bp_step_transition`
  으로 확정했다(bp_df_id=1):

    1400 --SUBMIT_LANGUAGE_OPINION-->        1400   ← 자기 자신(self-loop)
    1400 --SUBMIT_EXPERT_REVIEW_OPINION-->   1400   ← 자기 자신(self-loop)
    1400 --JURISDICTIONAL_COMMITTEE_REVIEW--> 1500  ← 여기만 전진한다

  즉 seed-04b(언어·전문심사 의견서)가 전부 PASS 해도 의안은 1400에 머문다 — 정상이다.
  전이는 문서 **결재 시점**에 일어난다(BillMngServiceImpl:495 → jurisdictionalCommitteeReview
  → processService.executeAction). 등록만으로는 안 된다.

  ⚠ 심사보고서([심사보고서 등록] t('10789'), CmtReviewModal)는 **전이와 무관**하다.
  그쪽은 키르기스어·러시아어 심사보고서 파일이 둘 다 필수라(cmtReviewModal.vue:145-152)
  자동화 비용이 크고, 넣지 않아도 1500 으로 넘어간다. 별도 시나리오로 분리한다.

  수신자·승인자는 추측이 아니라 과거 실데이터에서 뽑았다(2026-08-12 DB 확인):
    eas_received_info — 위원회 의견서 4건 전부 수신자 gduser1(Жалпы бөлүм, 총무국)
    eas_approval      — 4건 중 3건 승인자 cmtuser1(위원회1 부서장)
  언어·전문심사 의견서가 소관위원회 부서장으로 갔던 것과 **수신자가 다르다** — 04b 를
  그대로 복사하면 안 되는 지점이다.

  2026-08-12 첫 실행 **55스텝 전부 PASS**. `ebs_bp_tasks` 로 확인: 13878 이 status=C +
  result_doc_id(14:14:06), **13898 step 1500 PLENARY_PROPOSAL 신규 생성**.
  본회의 안건 후보 그리드에서 6-6977/26 이 실제로 조회됐다.

  산출물: 의안이 1500(위원회심사완료)로 전진해 seed-05(본회의 부의) 대상이 된다.
on_failure: stop
steps:

  # ── 1) 소관위원회 부서원(cmtuser10) — 대상 의안 상세 진입
  - { action: navigate, url: "/main/billMng/cmtMng/billCmtReview" }
  - { action: wait_for, target: { ref: content_title, description: "위원회심사 목록" } }
  - { action: click, target: { ref: bill_view_assigned_btn, description: "[이행받은 의안] 토글 — 배정된 건만(billCmtReviewList.vue:200)" } }
  - { action: wait_for, target: { ref: bill_view_assigned_active, description: "토글 활성" } }
  - { action: screenshot, name: "04c-a-cmt-list" }
  - { action: double_click, target: { ref: datatable_row, text: "E2E-SEED ${today}", description: "E2E-SEED 의안 → 위원회심사 상세" } }
  - { action: wait_for, target: { ref: content_title, description: "위원회심사 상세" } }
  - { action: screenshot, name: "04c-b-cmt-detail" }

  # ── 2) 의견서 작성 — 주 이행자에게만 보이는 버튼
  # 같은 버튼 그룹에 [심사보고서 등록](10789)도 있어 text 로 갈라야 한다
  - { action: assert_visible, target: { css: ".btn_group_fixed button", text: "의견서 작성", description: "[의견서 작성](10826). 없으면 이 계정이 주 이행자가 아니다 — seed-04 의 [C] 지정을 확인할 것" } }
  - { action: click, target: { css: ".btn_group_fixed button", text: "의견서 작성", description: "[의견서 작성] → 문서 작성 모달(billType=JURISDICTIONAL_COMMITTEE_REVIEW)" } }
  - { action: wait_for, target: { css: ".p-dialog", description: "의견서 작성 모달" } }
  - { action: screenshot, name: "04c-c-opinion-modal" }

  # ── 3) 필수값 — 언어 / 제목 / 수신자(총무국) / 승인자(위원회 부서장)
  # ⚠ .p-dialog 의 첫 체크박스는 #docModeOfficial(공문파일 첨부 모드)이다 — 언어가 아니다.
  #   이걸 누르면 공문파일 칸이 사라져 뒤의 upload 가 통째로 실패한다.
  #   언어는 .language_area 안에 국가언어/공용어/외국어 3종(InsertLetter.vue:948-955).
  - use: insert-letter-modal
    with: { title: "E2E-SEED ${today} 위원회 심사 의견서", recipient: "gduser1", recipient_pick: "gduser1", approver: "cmtuser1", approver_pick: "부서장", tag: "04c-d" }
  - { action: wait_for, target: { ref: content_title, description: "모달이 닫히고 상세로 복귀" } }
  - { action: screenshot, name: "04c-e-opinion-registered" }

  # ── 4) 소관위원회 부서장(cmtuser1) — 결재  ← 여기서 1400 → 1500 이 일어난다
  - { use: switch-account, with: { account: cmthead } }
  - use: approve-in-approval-inbox
    with: { doc: "E2E-SEED ${today} 위원회 심사 의견서", tag: "04c-f" }

  # ── 5) 결과 확인 — 본회의 안건 후보에 나타나야 1500 이다
  # MtngFromMapper.xml: (bp_df_id='1' AND current_step_id IN ('1500')) 인 의안만 후보로 뜬다.
  # 위원회심사 목록에서 사라졌는지로는 확인이 안 된다 — DSL 에 assert_not_visible 이 없다.
  - { use: switch-account, with: { account: mainmtng } }
  - { action: navigate, url: "/main/mtng/mainMtng1/create" }
  - { action: wait_for, target: { css: "input[placeholder='회기']", description: "본회의부의예정 등록 폼" } }
  - { action: click, target: { css: "a, button", text: "안건추가", description: "[안건추가] → 안건 등록하기 모달" } }
  - { action: wait_for, target: { css: ".p-dialog .p-datatable-tbody tr", description: "안건 후보 그리드" } }
  - { action: screenshot, name: "04c-h-agenda-candidates" }
  - { action: assert_visible, target: { css: ".p-dialog", text: "E2E-SEED ${today}", description: "E2E-SEED 가 본회의 안건 후보에 있다 = step 1500 도달의 증거. 없으면 아직 1400이다" } }
