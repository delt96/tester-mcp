id: seed-03-committee-referral
title: "[시딩] 위원회회부 — 소관위원회 지정 → 이행요청(수행자 3명 자동) → 서명 → 위원회심사로 전진"
locale: kr
login_as: gduser
tags: [seed, e2e-fullflow]
precondition: >
  seed-02 로 법률검토가 끝나 위원회회부 목록(안건상태 '법률검토완료')에 대상 의안이 있어야 한다.

  2026-08-11 수동 실측으로 확인한 동작:
  - [위원회 회부 요청] 을 누르면 '이행요청' 모달이 열리고 **수행자 3명이 자동으로 채워진다**
    (소관위원회 부서장 / 언어심사 부서장 / 전문심사 부서장). 직접 입력할 필요가 없다.
  - 소관위원회 부서장에는 **ⓒ 배지가 이미 활성**돼 있다(주 이행자 선지정, BL-05).
  - 서명자를 **요청자 본인**으로 지정하면 서명대기 없이 즉시 발송되고 의안 단계가 바로 넘어간다(EA-01).
  - 등록 후 목록으로 돌아오며 해당 의안은 목록에서 사라진다(Total 17 → 16으로 확인).

  산출물: 의안이 위원회심사 단계로 전진하고, 소관위원회 부서장·언어심사·전문심사 부서장에게
  이행요청이 발송된다. 이후 각 부서장이 부서원에게 다시 이행요청+주이행자를 지정하는 패턴이 반복된다.
on_failure: stop
steps:

  # ── 1) 위원회회부 목록 → 대상 의안 상세
  - { action: navigate, url: "/main/billMng/gdMng/billMngCmt" }
  - { action: wait_for, target: { ref: datatable, description: "위원회회부 그리드(안건상태 기본값 '법률검토완료')" } }
  - { action: screenshot, name: "03a-referral-list" }
  - { action: double_click, target: { ref: datatable_row, text: "E2E-SEED", description: "E2E-SEED 의안 행 더블클릭 → 위원회회부 상세. 첫 클릭은 선택만 되므로 더블클릭이어야 한다" } }
  - { action: wait_for, target: { css: ".content_tit", description: "위원회회부 상세 진입" } }
  - { action: screenshot, name: "03b-referral-detail" }

  # ── 2) 소관위원회 지정 (필수)
  #     네이티브 select 가 아니라 PrimeVue Dropdown 이므로 form_input 이 아닌 click 으로 연다
  #   PrimeVue 4.2 Select — 루트 .p-select, 오버레이는 body 직속 .p-select-overlay, 옵션 .p-select-option.
  #   .p-dropdown-* 은 PrimeVue 3 잔재라 여기선 잡히지 않는다. 관련위원회는 MultiSelect(.p-multiselect)라
  #   .p-select 에 걸리지 않으므로 첫 .p-select 가 소관위원회다(billMngCmtDtl.vue:427,436).
  #   ⚠ 트리거 클릭은 열기/닫기 토글이다. 오버레이만 기다리면 옵션이 아직 안 그려진 채로 다음 스텝이
  #     돌아 클릭이 헛돌고, 그 클릭이 다시 오버레이를 닫아 재시도가 계속 실패한다(2026-08-12 실측).
  #     그래서 오버레이가 아니라 **옵션이 렌더될 때까지** 기다린다.
  - { action: click, target: { css: ".p-select", description: "소관위원회 드롭다운(필수*)" } }
  - { action: wait_for, target: { css: ".p-select-overlay .p-select-option", description: "위원회 옵션이 실제로 그려질 때까지" } }
  - { action: click, target: { css: ".p-select-overlay .p-select-option", role: "option", text: "위원회1", description: "위원회1 선택. 옵션 텍스트는 'Комитет по международным делам… (위원회1)1  11111' 이라 한글 태그로 부분 매칭된다(kgst.com_cmt 실측). cmtuser1/cmtuser10 이 소속된 위원회라 이후 단계를 이어갈 수 있다" } }
  - { action: screenshot, name: "03c-committee-selected" }

  # ── 3) [위원회 회부 요청] → 이행요청 모달 (수행자 자동 채움 확인)
  - { action: click, target: { ref: btn_primary_md, text: "위원회 회부 요청", description: "[위원회 회부 요청] → 이행요청 모달" } }
  - { action: wait_for, target: { css: ".p-dialog .p-autocomplete-input", description: "이행요청 모달" } }
  - { action: assert_visible, target: { css: ".p-dialog", text: "위원회1 부서장", description: "수행자에 소관위원회 부서장이 자동으로 채워져 있어야 한다(BL-05)" } }
  - { action: assert_visible, target: { css: ".p-dialog", text: "언어심사 부서장", description: "언어심사 부서장도 자동 채움" } }
  - { action: assert_visible, target: { css: ".p-dialog", text: "전문심사 부서장", description: "전문심사 부서장도 자동 채움" } }
  - { action: screenshot, name: "03d-workrequest-autofilled" }

  # ── 4) 이행내용 + 서명자(본인) → 등록
  - { action: fill, target: { css: ".p-dialog textarea.form_control", description: "이행내용" }, value: "E2E-SEED 위원회 회부 요청" }
  # 운영에서는 서명자가 타인(국회의장 등)이다. 개발환경은 esign 서버에 접근할 수 없어
  # 본인 지정 시 PIN 없이 자동 승인되므로, 테스트 편의로 본인을 쓴다(2026-08-12 사용자 확인).
  # 이 때문에 이 시나리오는 '서명 대기 → 서명 승인함' 경로를 검증하지 못한다.
  - { action: fill, target: { label: "서명자", css: ".p-dialog .p-autocomplete-input", description: "서명자 — 요청자 본인(gduser1)" }, value: "gduser1" }
  - { action: wait_for, target: { css: ".p-autocomplete-overlay .p-autocomplete-option, .user-autocomplete-overlay .p-autocomplete-option", description: "서명자 후보" } }
  - { action: click, target: { css: ".p-autocomplete-overlay .p-autocomplete-option:first-child, .user-autocomplete-overlay .p-autocomplete-option:first-child", description: "gduser1 L 선택" } }
  - { action: screenshot, name: "03e-workrequest-filled" }
  - { action: click, target: { css: ".p-dialog button.v_btn.btn_primary", text: "등록", description: "[등록] — 업무요청 생성 + 본인 서명으로 즉시 발송" } }

  # ── 5) 전진 확인 — 목록으로 돌아오고 대상 의안이 빠져 있어야 한다
  - { action: wait_for, target: { ref: datatable, description: "위원회회부 목록으로 자동 복귀" } }
  - { action: screenshot, name: "03f-referred" }
  # ⚠ 이 스텝은 회부 성공 여부를 검증하지 못한다. .board_info 존재만 보므로 실패해도 PASS 한다.
  # 진짜 판정 기준은 "E2E-SEED 행이 목록에서 사라졌는가"인데 DSL 에 부정 단언(assert_not_visible)이
  # 없어 표현할 수 없다. 03f 스크린샷으로 사람이 확인할 것 — 수동 실측 시 Total 17 → 16.
  - { action: assert_visible, target: { css: ".board_info", description: "총건수 영역(회부 전보다 1건 줄어야 한다 — 스크린샷 육안 확인)" } }
