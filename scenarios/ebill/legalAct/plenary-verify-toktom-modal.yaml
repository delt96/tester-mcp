id: plenary-verify-toktom-modal
title: 본회의검증 — 버튼 노출 + 톡돔 작성 모달 열림(비파괴)
locale: ru
login_as: lgactuser
precondition: >
  legalactuser(LGACT)로 본회의검증 상세(vars.legalact_doc_url = bill EB_3c267ff1, task 13612,
  step 1900=LEGAL_ACTION status P, result_doc 없음, 등록요청문서 13602 존재). 비파괴 — 모달 열림까지만(저장/제출 안 함).
  검증: (1) 톡돔 작성/이행문서 버튼이 단계 기준으로 노출(문서-역할 불필요), (2) 톡돔 작성 클릭 시
  InsertLetter 모달이 열림(버튼→모달 배선). threading fromDocId=등록문서는 코드로 확증됨.
  ⚠ 의안이 LEGAL_ACTION에 머물러야 성립 — 진행되면 버튼이 사라져 FAIL(코드 회귀 아님).
steps:
  - { action: navigate, url: "${vars.legalact_doc_url}" }
  - { action: wait_for, target: { css: ".content_section .btn_group_fixed button.btn_outline_primary", text: "Список", description: "상세 하단 '목록' 버튼(t10084) — 페이지 마운트 확인" } }
  - { action: wait_for, target: { css: ".content_section .btn_group_fixed button.v_btn.btn_primary.btn_md", text: "Токтомду даярдоо", description: "'톡돔 작성' 버튼(t10833, @click=popupInsertLetter). btn_primary_md alias를 .content_section .btn_group_fixed로 스코프해야 하므로 인라인 유지" } }
  - { action: assert_visible, target: { css: ".content_section .btn_group_fixed button.btn_outline_primary", text: "исполнительный документ", description: "'이행문서' 버튼(t10901, popupExecutionInbox) — 이행 버튼 통합 후 라벨 t10602→t10901" } }
  - { action: screenshot, name: "plenary-verify-toktom-buttons" }
  - { action: click, target: { css: ".content_section .btn_group_fixed button.v_btn.btn_primary.btn_md", text: "Токтомду даярдоо", description: "'톡돔 작성' 버튼 클릭 → InsertLetter 답변 모달(replyYn='Y') 오픈. 스코프 필요로 인라인" } }
  - { action: wait_for, target: { css: ".p-dialog .popup_tit", text: "Токтомду даярдоо", description: "InsertLetter 모달 헤더(letterModal.title=t10833) — 버튼→모달 배선·문서작성 폼 렌더 확인" } }
  - { action: screenshot, name: "plenary-verify-toktom-modal-open" }
