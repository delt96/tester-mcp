id: plenary-verify-buttons
title: 본회의검증 — LGACT 사용자에게 톡돔/이행 버튼 노출 + 강제진행 버튼 미노출
locale: ru
login_as: lgactuser
precondition: >
  legalactuser(auth_cd LGACT, 법적행위부서장)로 본회의검증 상세(bill EB_3c267ff1, task 13612,
  current_step 1900=LEGAL_ACTION status P, result_doc 없음, 등록요청문서 존재) 진입. 비파괴 — 버튼 노출만 검증.
  ⚠ 이 시나리오는 의안이 LEGAL_ACTION에 머물러 있어야만 성립한다. 해당 의안이 정부이송/공포로 진행되면
  curBillStep이 바뀌어 버튼이 전부 사라지고 FAIL이 난다(코드 회귀 아님) — vars.legalact_doc_url을 갱신할 것.
  등록문서 anchor 통일 후 톡돔/이행 버튼이 문서-역할 없이 단계 기준으로 노출되어야 함(btnInsertLetter/
  btnExecutionInbox = curBillStep=='LEGAL_ACTION'). 강제진행("진행이안되는경우…" t10912, 강제결재 t10913)은
  둘 다 제거되어 노출되지 않아야 함(btnForceStepProgress=false, btnForceApproveProgress 계산 주석).
steps:
  - { action: navigate, url: "${vars.legalact_doc_url}" }
  - { action: wait_for, target: { css: ".content_section .btn_group_fixed button.btn_outline_primary", text: "Список", description: "상세 하단 버튼바의 '목록' 버튼(t10084) — 페이지 마운트 확인" } }
  - { action: wait_for, target: { css: ".content_section .btn_group_fixed button.v_btn.btn_primary.btn_md", text: "Токтомду даярдоо", description: "'톡돔 작성' 버튼(t10833, @click=popupInsertLetter, btnInsertLetter). fnAuthSetup 비동기 완료 후 등장. LGACT 단계면 문서-역할 없이 노출되어야 함(un-gate 핵심)" } }
  - { action: assert_visible, target: { css: ".content_section .btn_group_fixed button.btn_outline_primary", text: "исполнительный документ", description: "'이행문서' 버튼(t10901, @click=popupExecutionInbox, btnExecutionInbox=단계기준). 이행 버튼 통합 후 라벨 t10602→t10901. un-gate 보강 증거" } }
  - { action: screenshot, name: "plenary-verify-buttons" }
