id: regwait-03-register-forward-modal
title: 접수 → 대기 리스트 더블클릭 → 가져오기 → 등록 → 전달(등록요청발송) 모달 표시 → 처리완료 확인
locale: kr
login_as: gduser
precondition: >
  대상 문서(샘플 306, regno 01-14/2026-115, 제목 'О внесении изменений ... О статусе депутата Жогорку Кенеша')에
  첨부파일 2개 존재(가져오기 소스), 등록대기 큐에 해당 문서의 WAIT 행이 없어야 함(중복 409 방지).
  등록 시 실제 의안(ebs_master)이 생성되고 큐가 DONE 처리됨 — dev DB 기준 허용.
  전달 모달은 표시 검증까지만 하고 발송하지 않음(닫기).
on_failure: stop
steps:

  # 1) 외부문서 접수
  - { action: navigate, url: "/main/letter/external/receive" }
  - { action: wait_for, target: { ref: datatable_row, description: "외부 수신함 첫 행" } }
  - { action: click, target: { ref: datatable_row, text: "О статусе депутата", description: "제목에 'О статусе депутата'가 포함된 샘플 문서(ID 306, 첨부 2개) 행 클릭 → 상세" } }
  - { action: wait_for, target: { ref: btn_outline_md, text: "의안 등록 접수", description: "[의안 등록 접수] 버튼(11048)" } }
  - { action: click, target: { ref: btn_outline_md, text: "의안 등록 접수", description: "[의안 등록 접수] 클릭 → ConfirmPopup" } }
  - { action: wait_for, target: { ref: confirm_popup, description: "접수 confirm(11058)" } }
  - { action: click, target: { ref: confirm_accept, description: "confirm 수락(Yes) — 접수 성공 시 등록 대기 리스트로 자동 이동" } }

  # 2) 대기 리스트(자동 이동됨)에서 더블클릭 진입
  - { action: wait_for, target: { ref: datatable, description: "등록 대기 DataTable — 접수 후 자동 이동 확인" } }
  - { action: click, target: { css: ".p-datatable-tbody > tr:has(button.v_btn.btn_outline_primary.btn_sm)", description: "마지막 셀에 '접수 취소' 버튼이 있는 등록대기 행을 **마우스 더블클릭(double_click)**. 단일 클릭은 선택만 됨. 더블클릭하면 의안 등록 폼으로 이동" } }
  - { action: wait_for, target: { css: ".ext_doc_card", description: "등록 폼의 등록요청문서 지정 카드 — 외부문서 모드 진입 성공 신호" } }
  - { action: screenshot, name: "03a-form-extdoc-mode" }

  # 3) 안건명(러시아어) 입력 — 키르기스어는 문서명으로 자동 채워짐
  - { action: fill, target: { label: "안건명(러시아어)", css: "textarea.form_control", description: "안건명(러시아어)(10068) 행의 textarea. 첫 번째 textarea는 키르기스어이므로 라벨 '안건명(러시아어)'로 구분" }, value: "E2E автотест регистрация законопроекта" }

  # 4) 가져오기 — 원문(키르기스어) 셀
  - { action: click, target: { css: "tr:has(.file_attatch) td:nth-of-type(1) .form_row:first-child button.v_btn.btn_sm.btn_outline_primary", text: "가져오기", description: "문서(키르키즈어) 원문(110) 셀의 [가져오기](11051) 버튼" } }
  - { action: wait_for, target: { css: ".p-dialog .basic_table", description: "등록요청문서 파일 선택 모달(11052)의 파일 목록" } }
  - { action: click, target: { css: ".p-dialog .basic_table button.v_btn.btn_sm", text: "추가", description: "첫 파일의 [추가](10195) 버튼" } }
  - { action: click, target: { css: ".p-dialog [data-pc-name=\"pcclosebutton\"]", description: "가져오기 모달 우상단 X 닫기" } }

  # 5) 가져오기 — 원문(러시아어) 셀
  - { action: click, target: { css: "tr:has(.file_attatch) td:nth-of-type(2) .form_row:first-child button.v_btn.btn_sm.btn_outline_primary", text: "가져오기", description: "문서(러시아어) 원문(110) 셀의 [가져오기] 버튼" } }
  - { action: wait_for, target: { css: ".p-dialog .basic_table", description: "파일 선택 모달" } }
  - { action: click, target: { css: ".p-dialog .basic_table button.v_btn.btn_sm", text: "추가", description: "첫 파일 [추가]" } }
  - { action: click, target: { css: ".p-dialog [data-pc-name=\"pcclosebutton\"]", description: "모달 닫기" } }
  - { action: screenshot, name: "03b-files-imported" }

  # 6) [저장] → 전달 모달 직접 표시(confirm 없음) → 수신자 지정 → [등록하기] 일괄 처리
  - { action: click, target: { css: "button[type=\"submit\"].v_btn.btn_primary.btn_md", text: "저장", description: "[저장](10174) — confirm 없이 전달(등록발송) 모달이 바로 뜸" } }
  - { action: wait_for, target: { css: ".p-dialog .popup_tit", text: "등록요청발송", description: "전달 모달(ForwardExtDocModal, 제목 10764) 표시 — 유형/부제목은 문서에서 자동 채움" } }
  - { action: screenshot, name: "03c-forward-modal-open" }
  - { action: click, target: { css: ".p-dialog .recipients .p-autocomplete-dropdown", description: "수신자 autocomplete 드롭다운 버튼" } }
  - { action: wait_for, target: { css: ".p-autocomplete-overlay .p-autocomplete-option", description: "수신자 옵션 목록" } }
  - { action: click, target: { css: ".p-autocomplete-overlay .p-autocomplete-option", description: "첫 번째 수신자 옵션 선택" } }
  - { action: screenshot, name: "03c2-recipient-set" }
  - { action: click, target: { css: ".p-dialog button.v_btn.btn_primary", text: "등록하기", description: "[등록하기](10493) — 의안 등록 + 외부문서 전달(완료) 일괄 처리 후 등록 대기 리스트로 자동 이동" } }

  # 7) 대기 리스트(자동 이동)에서 처리완료 확인
  - { action: wait_for, target: { ref: datatable, description: "등록 대기 DataTable — 자동 이동 확인" } }
  - { action: assert_visible, target: { css: ".p-datatable-tbody", text: "처리완료", description: "처리상태 '처리완료'(11046) 행 존재 — DONE 전환 증거" } }
  - { action: screenshot, name: "03d-done-in-list" }
