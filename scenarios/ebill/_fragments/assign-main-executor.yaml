id: assign-main-executor
# 부서장이 이행대기함/수신함 상세에서 부서원에게 이행요청을 만들고 [C] 주 이행자로 지정한다.
# eBill 전 구간에서 가장 많이 반복되는 패턴 — 2026-08-11 위원회1·언어심사·전문심사 3개 부서에서
# 동일 절차로 실측 확인했다.
#
# 왜 주 이행자 지정이 필수인가:
#   [의견서 작성]·[심사보고서 등록] 버튼은 **주 이행자에게만** 보인다. 일반 이행자로만 넣으면
#   다음 단계에서 부서원이 아무 버튼도 못 본다(2026-08-11 실측 — 이 함정에 한 번 걸렸다).
#
# 왜 서명자를 부서장 본인으로 두는가:
#   요청자 본인을 서명자로 지정하면 서명대기 없이 즉시 '발송' 상태가 되어 다음 단계로 바로 넘어간다.
#   타인을 지정하면 '서명 대기'로 멈춘다(EA-01).
#
# 셀렉터 출처: src/components/modal/approve/RequestModal.vue (type='add_workRequestAndResponse')
#   - button.add_command          : [+ 이행자추가]
#   - .responder_row .p-autocomplete-input : 수행자
#   - button.main-worker-btn      : [C] 배지. 수행자가 채워져야(canPickMainWorker) 렌더링된다.
#                                   활성 시 .is-main 이 붙는다.
#   - .p-dialog textarea.form_control.full : 이행내용
#   - .signer_area .p-autocomplete-input   : 서명자
#   - .p-dialog button.btn_md.btn_primary  : [등록](10103)
params:
  executor:   # 부서원 로그인 ID (예: cmtuser10, LGGSPLZ2, lgexntnuser2)
  signer:     # 부서장 본인 로그인 ID (예: cmtuser1, LGGSPLZ, lgexntnuser)
  content:    # 이행내용 텍스트
steps:
  - { action: click, target: { css: "button.add_command", description: "[+ 이행자추가] — 이행자 목록 헤더 우측" } }
  - { action: wait_for, target: { css: ".p-dialog .responder_row .p-autocomplete-input", description: "이행요청 모달의 수행자 입력" } }

  # 수행자 — autocomplete 후보에서 고른다. 부서장/부서원이 같은 접두어를 공유하므로
  # 부서원 ID를 그대로 치면 후보가 1건만 남는다(cmtuser10, LGGSPLZ2, lgexntnuser2).
  - { action: fill, target: { css: ".p-dialog .responder_row .p-autocomplete-input", description: "수행자" }, value: "{{executor}}" }
  - { action: wait_for, target: { css: ".p-autocomplete-overlay .p-autocomplete-option", description: "수행자 후보" } }
  - { action: click, target: { css: ".p-autocomplete-overlay .p-autocomplete-option", text: "{{executor}}", description: "{{executor}} 선택" } }

  - { action: fill, target: { css: ".p-dialog textarea.form_control.full", description: "이행내용" }, value: "{{content}}" }

  # [C] 주 이행자 — 수행자 선택 후에만 나타난다. 누르면 .is-main 이 붙고 빨간 테두리가 된다.
  - { action: wait_for, target: { css: ".p-dialog button.main-worker-btn", description: "[C] 배지 — 수행자가 채워져야 렌더링된다" } }
  - { action: click, target: { css: ".p-dialog button.main-worker-btn", description: "[C] 배지 클릭 → 주 이행자 지정" } }
  - { action: assert_visible, target: { css: ".p-dialog button.main-worker-btn.is-main", description: "[C] 활성 확인 — .is-main 이 없으면 주 이행자가 아니다" } }

  # 서명자 — 본인. 후보가 부서장/부서원 2건 나오므로 text 로 부서장을 특정해야 한다.
  # (좌표 클릭으로는 두 번째 후보가 잡히는 사고가 있었다 — 2026-08-11)
  - { action: fill, target: { css: ".p-dialog .signer_area .p-autocomplete-input", description: "서명자 — 요청자 본인" }, value: "{{signer}}" }
  - { action: wait_for, target: { css: ".p-autocomplete-overlay .p-autocomplete-option", description: "서명자 후보" } }
  - { action: click, target: { css: ".p-autocomplete-overlay .p-autocomplete-option", text: "부서장", description: "부서장 후보 선택 — 직원 후보와 구분하려면 text 매칭이 필수다" } }

  - { action: click, target: { css: ".p-dialog button.btn_md.btn_primary", description: "[등록](10103)" } }
  - { action: wait_for, target: { css: "button.add_command", description: "모달이 닫히고 상세로 복귀" } }
