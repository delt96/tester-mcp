id: list-filter-search
params: { subtitle: "" }
# 편지함 목록을 **부제목으로 좁힌다.**
#
# ⚠ **왜 통합검색(돋보기) 대신 필터 패널을 쓰는가** — 2026-08-14 실측 근거:
#   `.search_form` 의 돋보기 버튼은 **아이콘만 있고 텍스트·aria-label 이 없다.**
#   접근성 이름이 없으니 executor 가 좌표로 찍는데, 목록이 재정렬되면서 좌표 아래 요소가 바뀌어
#     · 옆의 필터 버튼을 눌러 필터 팝업이 열리거나
#     · 문서 행이 눌려 엉뚱한 문서가 선택되는
#   일이 반복됐다(p4b 2회 연속 NOT_TESTED). 검색이 아예 실행되지 않았는데도 목록이 바뀐 것처럼
#   보여 원인 파악도 어렵다 — `integratedSearch()` 는 `searchContent` 가 비면 조용히 return 한다.
#
#   반면 필터 패널의 검색 버튼은 `<button class="btn_sm btn_primary">…{{ t('10053') }}</button>` 로
#   **표시 텍스트가 있어** find 가 접근성 트리에서 바로 잡는다(SearchFilterComponent.vue:174).
#
# ⚠ 필터 토글 버튼은 `.search_form` 의 **마지막** 버튼이다(첫 버튼이 돋보기).
# ⚠ 부제목 칸 위치: DraftsInbox 는 `searchType` 을 넘기지 않으므로 타입별 filter_item 이 하나도
#   렌더되지 않는다. 따라서 **`.filter_item` 첫 번째가 부제목**이다(SearchFilterComponent.vue:136-139).
#   `searchType='inbox'` 인 화면(수신함 등)에서는 앞에 3개가 더 붙으므로 이 fragment 를 그대로 쓰면 안 된다.
steps:
  # ⚠ 필터 토글도 **아이콘만 있고 접근성 이름이 없다.** 버튼을 잡으면 좌표가 빗나가 패널이 안 열리는
  #   일이 있었다(2026-08-14 p5). **아이콘 요소 자체**를 대상으로 준다 — 클릭은 부모 button 으로 버블링된다.
  #   아이콘 클래스는 상태에 따라 다르다: 닫힘 `pi pi-filter-fill pi-filter` / 열림 `pi pi-filter-fill`.
  #   따라서 `i.pi-filter` 는 **닫힌 상태의 토글**만 정확히 가리킨다(LetterListComponent.vue:209).
  - { action: wait_for, target: { css: ".letter_list_wrapper .search_form", description: "목록 검색바 마운트 대기 — 이게 없으면 헤더 검색창을 보고 '구조가 다르다'고 오보한다" } }
  - { action: click, target: { css: ".letter_list_wrapper .search_form button i.pi-filter", description: "필터 토글 아이콘 — 검색 필터 패널 열기" } }
  - { action: wait_for, target: { css: ".search_area .filter_area .filter_item", description: "필터 패널 렌더" } }
  - { action: click, target: { css: ".search_area .filter_area .filter_item:first-child input.form_control", description: "부제목 입력칸 포커스" } }
  - { action: fill, target: { css: ".search_area .filter_area .filter_item:first-child input.form_control", description: "부제목(10249)으로 좁힌다" }, value: "{{subtitle}}" }
  - { action: assert_value, target: { css: ".search_area .filter_area .filter_item:first-child input.form_control" }, value: "{{subtitle}}" }
  # ⚠ 여기에 `text: "검색"` 을 넣지 말 것 — 이 fragment 는 locale: ru 시나리오도 쓴다(버튼 글자가 'Поиск').
  #   클래스만으로 유일하고(같은 줄의 닫기는 `.btn_neutral`), 버튼에 표시 텍스트가 있어
  #   접근성 트리에 이름이 잡히는 것 자체가 돋보기 아이콘 대비 이점이다.
  - { action: click, target: { css: ".search_area button.btn_sm.btn_primary", description: "★ 필터 패널의 검색 버튼 — 표시 텍스트가 있어 좌표에 의존하지 않는다" } }
  - { action: wait_for, target: { ref: list_search_chip, description: "검색 조건 칩 — addSearchItem 이 돌았다는 증거. 이게 없으면 검색이 실행되지 않은 것이다" } }
