id: list-filter-search-by-no
params: { letterno: "" }
# 편지함 목록을 **문서번호로** 좁힌다. 부제목판은 `list-filter-search.yaml` 이다.
#
# ⚠ **부제목 대신 문서번호를 쓰는 이유**: 부제목 검색은 `LIKE` 라 접두어가 겹치면 무더기로 걸린다.
#   실측(2026-08-14): `test1` 로 검색하면 gduser 기안분만 **18건**(`test111` `test1212` `test1301` …)이라
#   목록에서 `text: "test1"` 로 집으면 어느 문서가 잡힐지 알 수 없다.
#   문서번호(`6-6952/26` 형태)는 유일하므로 대상을 확정할 수 있다.
#   ※ 단 **문서번호는 결재 완료 시점에 채번**되므로 미결재 문서에는 없다 — 그때는 부제목판을 쓴다.
#
# ⚠ 돋보기(통합검색) 버튼을 쓰지 않는 이유는 `list-filter-search.yaml` 주석 참조(접근성 이름 없음).
# ⚠ 문서번호 칸 위치: `searchType` 을 넘기지 않는 화면(기안함 등) 기준으로
#   `.filter_item` **2번째**가 문서번호다(1번째는 부제목). SearchFilterComponent.vue:140-143.
#   `searchType='inbox'` 인 화면은 앞에 3개가 더 붙으므로 이 fragment 를 그대로 쓰면 안 된다.
steps:
  # ⚠ 필터 토글도 **아이콘만 있고 접근성 이름이 없다.** 버튼을 잡으면 좌표가 빗나가 패널이 안 열리는
  #   일이 있었다(2026-08-14 p5). **아이콘 요소 자체**를 대상으로 준다 — 클릭은 부모 button 으로 버블링된다.
  #   아이콘 클래스는 상태에 따라 다르다: 닫힘 `pi pi-filter-fill pi-filter` / 열림 `pi pi-filter-fill`.
  #   따라서 `i.pi-filter` 는 **닫힌 상태의 토글**만 정확히 가리킨다(LetterListComponent.vue:209).
  - { action: wait_for, target: { css: ".letter_list_wrapper .search_form", description: "목록 검색바 마운트 대기 — 이게 없으면 헤더 검색창을 보고 '구조가 다르다'고 오보한다" } }
  - { action: click, target: { css: ".letter_list_wrapper .search_form button i.pi-filter", description: "필터 토글 아이콘 — 검색 필터 패널 열기" } }
  - { action: wait_for, target: { css: ".search_area .filter_area .filter_item", description: "필터 패널 렌더" } }
  - { action: click, target: { css: ".search_area .filter_area .filter_item:nth-of-type(2) input.form_control", description: "문서번호 입력칸 포커스" } }
  - { action: fill, target: { css: ".search_area .filter_area .filter_item:nth-of-type(2) input.form_control", description: "문서번호(10090)로 좁힌다" }, value: "{{letterno}}" }
  - { action: assert_value, target: { css: ".search_area .filter_area .filter_item:nth-of-type(2) input.form_control" }, value: "{{letterno}}" }
  - { action: click, target: { css: ".search_area button.btn_sm.btn_primary", description: "★ 필터 패널의 검색 버튼 — 표시 텍스트가 있어 좌표에 의존하지 않는다" } }
  - { action: wait_for, target: { ref: list_search_chip, description: "검색 조건 칩 — 검색이 실행됐다는 증거" } }
