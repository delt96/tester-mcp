
# 시나리오 도중 담당자를 바꾼다. 전 구간 시딩(seed/*)처럼 한 흐름을 여러 역할이 이어받는 경우에 쓴다.
# use 중첩이 금지되므로 login fragment를 부르지 않고 로그아웃+로그인 스텝을 직접 갖는다.
id: switch-account
params:
  account:
steps:
  - { action: click, target: { css: "button.v_btn:has(i.ico_logout)", description: "헤더 우측 로그아웃 버튼" } }
  - { action: wait_for, target: { css: "#userId", placeholder: "ИНН", description: "로그인 화면 복귀" } }
  - { action: fill, target: { css: "#userId", placeholder: "ИНН" }, value: "${secrets.{{account}}.username}" }
  - { action: fill, target: { css: "#pswd", placeholder: "Ваш пароль" }, value: "${secrets.{{account}}.password}" }
  - { action: click, target: { css: ".btn_login", role: "button", description: "로그인 버튼" } }
  - { action: wait_for, target: { css: ".search_form input", description: "로그인 후 헤더 검색창 — 전환 완료 신호" } }
