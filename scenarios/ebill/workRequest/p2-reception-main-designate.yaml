id: p2-reception-main-designate
title: Phase 2 접수 흐름 — 이행자 입력 가능 + C 배지 주이행자 지정 → 저장
locale: kr
login_as: gduser
ephemeral: true
precondition: >
  gduser1(EPH9) 수신함에 rcv_id=5116 / DMT01 "поручение 1"이 미접수·미열람으로 존재한다
  (rcv_status=RS01, check_dtm null, 이행요청 0건 — 2026-08-03 실측).
  ※ 대상 선정 근거: 수신함 정렬이 `check_dtm is null desc, rcv_dtm desc`라 한 번이라도 연 문서는
  미열람 759건 뒤로 밀려 화면에서 사라진다. 또 검색창은 v-model이 input 이벤트에 묶여 있어
  자동화 fill로는 채워지지 않는다(앞선 두 번의 실행이 각각 이 두 이유로 실패했다).
  따라서 대상은 반드시 **미열람 상태의 DMT01**이어야 하고, 목록 상단에서 직접 클릭한다.
  이 시나리오를 한 번 돌리면 해당 문서는 열람+접수되므로 재실행하려면 새 대상을 다시 골라야 한다.
  ★ 이 시나리오의 핵심은 Phase 2 회귀 검증이다. 수신 기준 주이행자 입력 블록을 제거하면서
  접수 모달의 첫 이행자 행이 isMainWorker=true 프리셋으로 남아 있었고, 그 플래그가
  AutoCompleteUserInput을 disabled로 만들어 접수에서 이행자를 아예 입력할 수 없었다.
  따라서 아래 fill 단계가 성공하는 것 자체가 수정의 증거다(disabled면 fill이 실패한다).
  두 번째 검증은 C 배지 버튼이 reception 흐름에도 렌더되어 workerId가 payload에 실리는지다.
  파괴적 — 이 수신 건에 실제로 이행요청을 생성하고 접수 상태를 바꾼다. 재실행하려면 다른 rcv_id가 필요하다.
steps:
  - { action: navigate, url: "/main/letter/inbox" }
  - { action: wait_for, target: { ref: list_item, description: "수신함 좌측 리스트" } }
  - { action: click, target: { ref: list_item, text: "поручение 1", description: "미열람 DMT01 문서 선택 → 상세 로드" } }
  # t10678의 실제 라벨은 "주 이행자 추가"다(=접수 흐름 진입점, @click=receptionModalOpen).
  # 이 버튼이 보인다는 것 자체가 isReceipt=false, 즉 미접수 DMT01 분기라는 증거다.
  - { action: wait_for, target: { css: ".right_top_area .btn_group button.btn_outline_neutral", text: "주 이행자 추가", description: "미접수 DMT01 분기의 이행요청 등록 진입 버튼" } }
  - { action: click, target: { css: ".right_top_area .btn_group button.btn_outline_neutral", text: "주 이행자 추가", description: "→ receptionModalOpen, RequestModal이 type=reception으로 열린다" } }
  - { action: wait_for, target: { ref: dialog_textarea, description: "이행요청 모달(RequestModal) 오픈" } }
  - { action: screenshot, name: "01-reception-modal-open" }

  # ★ 회귀 검증 1 — 첫 이행자 행 입력이 살아 있는가 (프리셋 isMainWorker면 disabled라 실패한다)
  - { action: fill, target: { css: ".dialog_main_area .responder_row:first-child input.p-autocomplete-input", description: "★ 첫 이행자 입력 — disabled였다면 여기서 실패한다" }, value: "legalact" }
  - { action: wait_for, target: { ref: user_ac_option, description: "사용자 제안 목록(appendTo=body 오버레이)" } }
  - { action: click, target: { ref: user_ac_option, description: "이행자 선택 → r.userId 채워짐" } }

  # ★ 회귀 검증 2 — reception 흐름에도 C 배지 버튼이 렌더되는가
  - { action: wait_for, target: { css: ".dialog_main_area .responder_row:first-child .main-worker-btn", description: "C 배지 버튼 — v-if에 'reception'이 없으면 안 뜬다" } }
  - { action: click, target: { css: ".dialog_main_area .responder_row:first-child .main-worker-btn", description: "C 배지 토글 → mainWorkerUserId 지정" } }
  - { action: assert_visible, target: { css: ".dialog_main_area .responder_row:first-child .main-worker-btn[aria-pressed='true']", description: "주이행자 지정 확인(aria-pressed=true) → payload workerId" } }
  - { action: screenshot, name: "02-executor-and-badge" }

  - { action: fill, target: { ref: dialog_textarea, description: "이행요청 내용" }, value: "Phase2 접수 주이행자 지정 검증" }
  - { action: fill, target: { css: ".signer_area input.p-autocomplete-input", description: "서명자(Phase 1 필수값) — 미지정 시 t11110 경고로 저장이 막힌다" }, value: "gduser1" }
  - { action: wait_for, target: { ref: user_ac_option, description: "서명자 제안 목록" } }
  - { action: click, target: { ref: user_ac_option, description: "서명자 = gduser1(작성자 본인)" } }

  - { action: click, target: { css: ".p-dialog button.btn_md.btn_primary", description: "등록(reception) → PUT /eas/reception, workerId 포함" } }
  - { action: assert_visible, target: { ref: toast_success, description: "저장 성공 toast(t10454). 서명자 미전달이면 대신 t11110 경고가 뜬다" } }
  - { action: screenshot, name: "03-after-save" }
