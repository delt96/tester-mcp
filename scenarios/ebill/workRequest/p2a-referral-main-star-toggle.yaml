id: p2a-referral-main-star-toggle
title: Phase 2a — 회부 이행요청 모달에 소관위원장이 주이행자로 기본 지정 + C 배지 토글 동작
locale: ru
login_as: gduser
precondition: >
  billId=EB_8067fc85-2385-473d-9efa-b7991bfafc22, taskId=13300 (활성 COMMITTEE_REFERRAL,
  위원회 3개 세팅, result_doc_id 없음). 비파괴 — 모달의 등록(Регистрация) 버튼은 누르지 않음.
  회부 버튼 클릭은 위원회 재저장(멱등) + 모달 오픈까지만.
  ※ 2026-08-04 변경: 모달이 열리면 소관위원회(cmt_se_cd='M') 위원장이 목록 **첫 행**으로 정렬되고
  주이행자로 **기본 지정**된다(billMngCmtDtl.insertLetter → /hrmis/chairman/{cmtItem} →
  RequestModal 프리필 watch의 mainWorkerUserId). 따라서 예전의 "클릭해야 지정됨"이 아니라
  "열자마자 지정돼 있음"이 기대값이고 첫 클릭은 해제가 된다.
  소관위 위원장을 못 찾는 의안이면 기본 지정이 없어 첫 assert에서 실패한다(대상 의안 선정 주의).
steps:
  - { action: navigate, url: "${vars.billmng_cmt_doc_b}" }
  - { action: wait_for, target: { ref: btn_primary_md, text: "Направить на подпись", description: "회부 버튼(@click=insertLetter, t10827)" } }
  - { action: click, target: { ref: btn_primary_md, text: "Направить на подпись", description: "회부 버튼 → 검토내용 저장 후 이행요청 모달 오픈" } }
  - { action: wait_for, target: { ref: dialog_textarea, description: "이행요청 모달 오픈 확인 (내용 textarea)" } }
  - { action: wait_for, target: { css: ".dialog_main_area .responder_row .main-worker-btn", description: "이행자 프리필 + C 배지 렌더 대기. add 흐름 + 이행자행 userId 있을 때만 렌더" } }
  - { action: assert_visible, target: { css: ".dialog_main_area .responder_row:first-child .main-worker-btn[aria-pressed='true']", description: "★ 신규 기대값 — 클릭 없이 첫 행(소관위원장)이 이미 주이행자로 지정돼 있음" } }
  - { action: click, target: { css: ".dialog_main_area .responder_row:first-child .main-worker-btn", description: "C 배지 클릭 → 기본 지정 해제(토글)" } }
  - { action: assert_visible, target: { css: ".dialog_main_area .responder_row:first-child .main-worker-btn[aria-pressed='false']", description: "해제 확인. Vue는 :aria-pressed=false를 aria-pressed='false'로 렌더한다(aria-*는 boolean attribute가 아니라 제거되지 않음)" } }
  - { action: click, target: { css: ".dialog_main_area .responder_row:first-child .main-worker-btn", description: "다시 클릭 → 재지정" } }
  - { action: assert_visible, target: { css: ".dialog_main_area .responder_row:first-child .main-worker-btn[aria-pressed='true']", description: "재지정 확인 — 배타적 토글 정상" } }
  - { action: screenshot, name: "referral-main-star-toggle" }
