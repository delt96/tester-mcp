id: p2a-referral-main-star-toggle
title: Phase 2a — 회부 이행요청 모달에 주이행자 별(★) 토글 노출 및 토글 동작
locale: ru
login_as: gduser
precondition: >
  billId=EB_8067fc85-2385-473d-9efa-b7991bfafc22, taskId=13300 (활성 COMMITTEE_REFERRAL,
  위원회 3개 세팅, result_doc_id 없음). 비파괴 — 모달의 등록(Регистрация) 버튼은 누르지 않음.
  회부 버튼 클릭은 위원회 재저장(멱등) + 모달 오픈까지만. 신규 별(★) 토글 UI 렌더/토글 상태만 검증.
steps:
  - { action: navigate, url: "${vars.billmng_cmt_doc_b}" }
  - { action: wait_for, target: { ref: btn_primary_md, text: "Направить на подпись", description: "회부 버튼(@click=insertLetter, t10827)" } }
  - { action: click, target: { ref: btn_primary_md, text: "Направить на подпись", description: "회부 버튼 → 검토내용 저장 후 이행요청 모달 오픈" } }
  - { action: wait_for, target: { ref: dialog_textarea, description: "이행요청 모달 오픈 확인 (내용 textarea)" } }
  - { action: assert_visible, target: { css: ".dialog_main_area .responder_row .main-star-btn", description: "주이행자 별(★) 토글 버튼 노출 — Phase 2a Task3 신규 UI. add 흐름 + 이행자행 userId 있을 때만 렌더" } }
  - { action: click, target: { css: ".dialog_main_area .responder_row .main-star-btn", description: "이행자 행 별 토글 클릭 → 주이행자 지정" } }
  - { action: assert_visible, target: { css: ".dialog_main_area .main-star-btn[aria-pressed='true']", description: "클릭 후 aria-pressed=true — 주이행자 지정 상태(배타적 토글)" } }
  - { action: screenshot, name: "referral-main-star-toggle" }
