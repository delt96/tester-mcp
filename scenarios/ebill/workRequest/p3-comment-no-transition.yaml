id: p3-comment-no-transition
title: Phase 3 댓글 작성 — 카드 하단 입력 노출, 작성 후 목록 반영 (상태 전이 없음을 DB로 확인)
locale: kr
login_as: gduser
ephemeral: true
precondition: >
  gduser1(EPH9)이 work_req 1444(rspns_id=1827, work_status=WS01, rspns_dtm null)의 이행자다.
  이행대기함 목록 라벨은 문서 제목이 아니라 **이행요청 내용**(work_cn)이다
  (getWorkList가 `req.work_cn as doc_subtle`로 별칭). work_req 1444의 work_cn은 'tyryt'.
  검색창은 v-model이 input 이벤트에 묶여 있어 자동화 fill로는 안 채워지므로 쓰지 말 것.
  ★ 이번 Phase의 핵심은 **댓글 작성과 이행 완료의 분리**다. 이 시나리오는 댓글만 쓰고
  이행완료 버튼은 누르지 않는다. 실행 후 팀장이 DB로 work_status가 WS01 그대로이고
  rspns_dtm이 여전히 null인지 확인한다 — 그것이 분리가 성립했다는 증거다.
  ★ 이행완료 버튼은 **작성자·서명자·그 문서의 수신자**에게 노출된다(2026-08-05 수신자 추가).
  work_req 1444는 reg_id=25, signer_id=NULL이고 gduser1은 user_id=9(이행자)다. 이행자라는
  사실만으로는 버튼이 안 뜨지만, **gduser1이 그 문서의 eas_received_info 행을 가지면 이제 뜬다**
  (참조 수신 포함). DB 미확인이므로 스크린샷 01에 버튼이 보이더라도 회귀로 단정하지 말 것 —
  수신 행 유무를 먼저 확인해야 한다. DSL에 부정 단언이 없어 육안 확인에 의존한다.
  파괴적 — 실제 댓글 1건이 생성된다(eas_work_comment).

  ★ 2026-08-14 실행 결과: **댓글 작성이 상태를 전이시키지 않는다는 것은 확인됐다**
    (1444·1445 둘 다 work_status=WS01 유지, rspns_dtm 여전히 null).
    다만 댓글이 1445 에 달려 **이행자 자격으로 쓴 것이 아니었다** — 아래 카드 특정 주석 참조.
  ★ 부수 관찰: **작성자(reg_id) 계정도 댓글을 쓸 수 있고, 그 댓글은 `rspns_id` 가 NULL 로 저장된다**
    (cmnt_id=30). 이행자가 쓴 댓글에는 rspns_id 가 들어간다(cmnt_id 26~29).
    → **의도된 설계다.** CommandComponent.vue:200-201 주석이 명시한다:
      "Anyone involved may comment, not just the assigned executor (spec C5);
       a non-executor carries no rspnsId."
steps:
  - { action: navigate, url: "/main/letter/executionInbox" }
  - { action: wait_for, target: { ref: list_item, description: "이행대기함 좌측 목록" } }
  - { action: click, target: { ref: list_item, text: "tyryt", description: "★ work_req 1444의 이행요청 — 목록 라벨은 work_cn" } }
  - { action: wait_for, target: { css: ".right_top_area .command", description: "이행요청 카드 로드" } }

  # ⚠ **이 문서에는 이행요청 카드가 2개다**(1445, 1444 — doc 17c8bc21 를 공유한다).
  #   2026-08-14 실행에서 `.comment_area textarea` 를 그냥 잡았더니 **첫 카드(1445)** 에 댓글이 달렸다.
  #   UI 단언은 전부 통과했지만 **의도한 1444 가 아니었다** — DB(eas_work_comment.cmnt_id=30, work_req_id=1445)로 발각.
  #   → 카드를 인덱스로 특정하고, 그 카드가 맞는지 `.command_detail`(work_cn) 로 **먼저 단언**한다.
  #   카드 순서는 백엔드 정렬에 달려 있어 코드로 확정하지 못했으므로, 어긋나면 여기서 실패하게 둔다.
  - { action: assert_visible, target: { css: ".right_top_area .commands .command:nth-of-type(2) .command_detail", text: "tyryt", description: "★ 둘째 카드가 work_req 1444(work_cn='tyryt')인지 확인 — 여기서 실패하면 카드 순서가 바뀐 것이다" } }

  # C2 — 댓글 입력은 토글 없이 항상 노출된다
  - { action: assert_visible, target: { css: ".right_top_area .commands .command:nth-of-type(2) .comment_area textarea", description: "★ 댓글 입력창 — isWrite 토글 없이 항상 노출(C2)" } }
  - { action: screenshot, name: "01-card-with-comment-input", description: "★ 이행자 시야 — 댓글 입력창 노출 확인. 이행완료 버튼(t10481)은 gduser1이 이 문서의 수신자가 아닐 때만 없다(precondition 참조)" }

  - { action: click, target: { css: ".right_top_area .commands .command:nth-of-type(2) .comment_area textarea", description: "포커스 확보" } }
  - { action: fill, target: { css: ".right_top_area .commands .command:nth-of-type(2) .comment_area textarea", description: "댓글 내용" }, value: "Phase3 댓글 전이없음 검증 1444" }
  - { action: click, target: { css: ".right_top_area .commands .command:nth-of-type(2) .comment_area .write_area button.btn_outline_neutral", description: "등록(t10103) → POST /eas/workComment" } }
  - { action: wait_for, target: { css: ".right_top_area .commands .command:nth-of-type(2) .comment_item", text: "Phase3 댓글 전이없음 검증 1444", description: "★ 작성한 댓글이 목록에 반영 — refreshComments 동작" } }
  - { action: assert_visible, target: { css: ".right_top_area .commands .command:nth-of-type(2) .comment_item .comment_del", description: "본인 댓글이므로 삭제 버튼 노출" } }
  - { action: screenshot, name: "02-comment-added" }
