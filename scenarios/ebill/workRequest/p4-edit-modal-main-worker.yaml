id: p4-edit-modal-main-worker
title: 수정 모달에서 주 이행자 C 배지 노출 + 교체 시 확인 팝업(10914) — 저장은 하지 않음
locale: ru
login_as: gduser
precondition: >
  ⚠ 비파괴 — 모달의 수정(Изменить) 버튼은 누르지 않는다. C 배지 토글은 모달 로컬 상태만 바꾸고
  취소로 닫으므로 DB는 그대로다.
  ⚠ **2026-08-14 대상 교체.** 원래 대상이던 work_req 1592 는 그 사이 **WS02 로 넘어가고 주이행자(rspns 2030,
    user 14)가 2026-08-05 15:33 에 응답을 마쳤다.** 주이행자가 응답하면 `mainWorkerSwapBlocked` 가 켜져
    **C 배지 자체가 렌더되지 않으므로**(RequestModal.vue:58-72) 이 시나리오로는 더 이상 양성 경로를 못 본다.
    코드 회귀가 아니라 **데이터 부패**다. 그 음성 경로는 `p4b-main-worker-swap-blocked.yaml` 로 분리했다.

  대상: doc fe8a9679-b2b1-493b-b516-a91a86d05cd0
        "Проект Закона … «О внесении изменений в Налоговый кодекс …»" (gduser 가 기안 → 기안함, edit-yn=true).
  이 문서에는 이행요청 카드가 2건 있다.
  - work_req 1484 (WS01, reg_id=9=gduser, main_rspns_id=1881, **이행자 4명 전원 미응답**) ← 검증 대상
  - work_req 1462 (WS03, reg_id=10, signer_id 없음) → gduser 가 문서 수신자면 버튼이 뜰 수도 있다.
    **`.update_button` 이 하나라고 가정하지 말고 카드를 인덱스로 특정한다**(아래 단언 참조).
  이행자 4명: rspns 1881(user 24, 주이행자) · 1882(user 14) · 1883(user 11) · 1884(user 12).
  모달은 주이행자를 첫 행으로 끌어올리므로 .responder_row 는 (2)=user24, (3)=user14 순이다.
  ※ .dialog_main_area의 첫 자식은 .worker_top_area라서 이행자 행은 nth-child(2)부터 시작한다.
  검증 대상은 2026-08-05 변경분 3가지다:
  (1) 수정 모드에서 C 배지가 렌더된다 — 이전에는 add/reception 흐름에서만 렌더됐다
  (2) 저장된 주이행자가 배지에 시드된다 (aria-pressed=true)
  (3) 다른 사람에게 넘길 때 10914 확인 팝업이 뜨고, PrimeVue Dialog 위에 정상 표시된다

  ⚠ **실행 전 Chrome 창을 넓혀야 한다(가로 2400px 이상 권장).**
    2026-08-14 실행에서 `.right_top_area .update_button button` 이 x=2348px 로 뷰포트(1568px) 밖에 있어
    클릭이 엉뚱한 토글로 빠졌다. **화면 레이아웃 결함이 아니라 자동화 창이 좁았던 것**이다
    (사용자 확인 완료). tester-mcp 는 실제 Chrome 창을 그대로 쓰므로 창 크기가 곧 뷰포트다.
steps:
  - { action: navigate, url: "/main/letter/draftsInbox" }
  - { action: wait_for, target: { ref: list_item, description: "기안함 좌측 목록" } }
  # ⚠ 2026-08-14: 기안함이 548건까지 늘어 대상 문서가 초기 20건 밖으로 밀려났다(목록은 페이징된다).
  #   목록에서 바로 집으면 "문서가 없다"로 실패하는데 이는 **데이터 부패이지 코드 회귀가 아니다.**
  #   → 검색으로 먼저 좁힌다. 검색 UI 는 LetterListComponent 공통이며 seed-14 에서 검증됐다.
  # ⚠ **`.search_area` 만으로는 부족하다.** 헤더 통합검색 입력칸도 placeholder 가 똑같이 t('10053')='검색' 이라
  #   executor 가 그쪽을 잡아 "셀렉터가 DOM 에 없다"고 오보했다(2026-08-14, 3회 연속).
  #   목록 검색창은 **`.letter_list_wrapper` 안에만** 있다(LetterListComponent.vue:203-208). 여기서 끊는다.
  - { action: click, target: { ref: list_search_input, description: "목록 검색창 포커스 — 헤더 통합검색이 아니다" } }
  - { action: fill, target: { ref: list_search_input, description: "목록 내부 통합검색 — 대상 문서로 좁힌다" }, value: "Налоговый" }
  - { action: assert_value, target: { ref: list_search_input }, value: "Налоговый" }
  - { action: click, target: { ref: list_search_button, description: "검색 실행(integratedSearch)" } }
  - { action: wait_for, target: { ref: list_search_chip, description: "검색 조건 칩 = 검색이 걸렸다는 증거" } }
  - { action: click, target: { ref: list_item, text: "Проект Закона", description: "대상 문서 선택 — 문서 제목은 데이터라 번역 대상이 아니다" } }
  - { action: wait_for, target: { css: ".right_top_area .command", description: "이행요청 카드 렌더" } }
  - { action: screenshot, name: "01-drafts-doc-commands" }

  # ⚠ 카드가 2개다. **어느 카드인지 먼저 못박는다** — p3 에서 카드를 특정하지 않았다가
  #   엉뚱한 이행요청에 댓글이 달린 적이 있다(2026-08-14). 순서가 바뀌면 여기서 실패해야 한다.
  # ⚠ 검색어 "Налоговый" 는 gduser 기안분만 2건이 걸린다. 대상 fe8a9679 만 제목이 "Проект Закона" 로
  #   시작하므로 목록 클릭은 그 텍스트로 한다 — 2026-08-14 에 문서를 잘못 골라 카드 위치가 어긋났다.
  - { action: assert_visible, target: { css: ".right_top_area .commands .command:nth-of-type(1) .command_detail", text: "위원회 회부", description: "★ **첫** 카드가 work_req 1484 인지 확인(work_cn='위원회 회부 - 주이행자 지정 기능테스트'). 2026-08-14 실측: 둘째 카드는 1462('테스트')다" } }

  # (1) 수정 버튼 — edit-yn=true(기안함) && canEdit(작성자)
  - { action: assert_visible, target: { css: ".right_top_area .commands .command:nth-of-type(1) .update_button button", description: "★ 1484 카드의 수정 버튼" } }
  - { action: click, target: { css: ".right_top_area .commands .command:nth-of-type(1) .update_button button", description: "수정 모달 오픈" } }
  - { action: wait_for, target: { ref: dialog_textarea, description: "모달 오픈 확인(이행내용 textarea)" } }

  # (1) C 배지가 수정 모드에서도 렌더되는가 — 이번 변경의 핵심
  - { action: assert_visible, target: { css: ".dialog_main_area .responder_row:nth-child(2) .main-worker-btn", description: "★ 신규: updateWorkRequest 흐름에서 C 배지 노출(canPickMainWorker)" } }
  # (2) 저장된 주이행자가 시드되었는가
  - { action: assert_visible, target: { css: ".dialog_main_area .responder_row:nth-child(2) .main-worker-btn[aria-pressed='true']", description: "★ 첫 행(user 24, main_rspns_id=1881)이 이미 지정된 상태로 열린다" } }
  - { action: assert_visible, target: { css: ".dialog_main_area .responder_row:nth-child(3) .main-worker-btn[aria-pressed='false']", description: "둘째 행(user 14)은 미지정" } }
  - { action: screenshot, name: "02-edit-modal-c-badge-seeded" }

  # (3) 교체 시 확인 팝업 — Dialog 위에 ConfirmPopup이 뜨는지가 관건
  - { action: click, target: { css: ".dialog_main_area .responder_row:nth-child(3) .main-worker-btn", description: "둘째 행으로 주이행자 이양 시도 → toggleMainWorker가 confirm.require 호출" } }
  - { action: wait_for, target: { ref: confirm_popup, description: "★ 10914 확인 팝업. PrimeVue Dialog 위에 정상 렌더되는지 확인" } }
  - { action: screenshot, name: "03-confirm-popup-over-dialog" }
  - { action: click, target: { ref: confirm_accept, description: "확인 수락 → mainWorkerUserId 이동" } }
  - { action: assert_visible, target: { css: ".dialog_main_area .responder_row:nth-child(3) .main-worker-btn[aria-pressed='true']", description: "★ 둘째 행으로 이양됨" } }
  - { action: assert_visible, target: { css: ".dialog_main_area .responder_row:nth-child(2) .main-worker-btn[aria-pressed='false']", description: "★ 첫 행 해제 — 배타적 토글" } }
  - { action: screenshot, name: "04-main-worker-moved" }

  # 저장하지 않고 닫는다
  - { action: click, target: { css: ".p-dialog button.btn_md.btn_neutral", description: "취소(t10001)로 닫기 — DB 미변경" } }
