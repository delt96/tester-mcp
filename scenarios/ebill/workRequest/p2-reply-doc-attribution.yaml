id: p2-reply-doc-attribution
title: Phase 2 답변문서 귀속 — 카드 답변 버튼 → 답변문서 저장 → eas_doc_reply 기록
locale: kr
login_as: gduser
ephemeral: true
precondition: >
  gduser1(EPH9)이 work_req 1444(rcv_id=4935, doc 17c8bc21='문서 테스트3', DMT01, WS01)의
  주이행자(main_rspns_id=1827). 현재 이 요청의 eas_doc_reply 행은 0건 (2026-08-03 실측).
  ★ 검증 대상: Phase 2에서 답변문서 귀속이 received_info.rcp_doc_id에서 신규 테이블
  eas_doc_reply로 옮겨졌다. 카드의 답변 버튼은 workReqId를 쿼리로 실어 보내고(fn_answerLetter),
  InsertLetter가 그것을 /eas/document/reply payload에 넣으며, saveReplyDocument가 귀속 행을 쓴다.
  이 경로는 지금까지 런타임 검증이 전혀 없었다 — eas_doc_reply 테이블 자체가 오늘 생성됐고
  백엔드는 17:21에야 신규 코드로 재기동됐다.
  저장 성공 후 팀장이 DB로 eas_doc_reply(work_req_id=1444) 1건과 rcv_id=4935를 확인한다.
  파괴적 — 실제 답변문서를 생성하고 수신 상태를 APPROVING_RESPONSE로 바꾼다.
steps:
  - { action: navigate, url: "/main/letter/executionInbox" }
  # 이행대기함 목록은 문서 제목이 아니라 **이행요청 내용**을 보여준다
  # (getWorkList: `req.work_cn as doc_subtle`). 대상 work_req 1444의 work_cn은 "tyryt"다.
  # 문서 제목 '문서 테스트3'으로는 절대 찾을 수 없다(앞선 실행이 이 이유로 실패했다).
  # 검색창도 쓰지 말 것 — v-model이 input 이벤트에 묶여 있어 fill로는 안 채워지고,
  # 게다가 검색 조건은 d.doc_subtle이라 화면에 보이는 work_cn과 매칭 기준이 다르다.
  - { action: wait_for, target: { ref: list_item, description: "이행대기함 좌측 목록" } }
  - { action: click, target: { ref: list_item, text: "tyryt", description: "★ work_req 1444(rcv_id=4935, 주이행자 gduser1, WS01)의 이행요청 — 목록 라벨은 work_cn" } }
  - { action: wait_for, target: { css: ".right_top_area .command", description: "이행요청 카드(CommandComponent) 로드" } }
  - { action: screenshot, name: "01-execution-inbox-card" }
  # 답변 버튼은 canReply를 통과한 카드에만 붙는다. 안 보이면 잘못된 문서를 연 것이므로 즉시 중단하라.
  - { action: assert_visible, target: { css: ".right_top_area .reply_area button", description: "답변 문서 작성 버튼 — 이게 없으면 대상 문서가 틀린 것이다" } }

  - { action: click, target: { css: ".right_top_area .reply_area button", description: "★ 답변 문서 작성(lng 11069) → fn_answerLetter가 workReqId=1444를 쿼리에 실어 letter.insert로 이동" } }
  - { action: wait_for, target: { css: ".sub_title_area input.form_control", description: "답변 공문 작성 화면 로드(제목 입력란)" } }
  - { action: screenshot, name: "02-reply-letter-form" }

  - { action: fill, target: { css: ".sub_title_area input.form_control", description: "공문 제목" }, value: "Phase2 답변문서 귀속 검증" }
  - { action: click, target: { css: ".recipients .p-autocomplete-dropdown", description: "수신자 자동완성 드롭다운" } }
  - { action: wait_for, target: { ref: user_ac_option, description: "수신자 후보 오버레이" } }
  - { action: click, target: { ref: user_ac_option, description: "수신자 1명 선택 — 검증 대상 아님" } }
  - { action: screenshot, name: "03-before-register" }

  # 결재자를 지정하지 않으면 addApprovalCount=0이라 저장 즉시 TRANSMITTED + doc_no 채번된다.
  - { action: click, target: { css: "button.btn_primary", text: "등록", description: "등록 → POST /eas/document/reply (workReqId 포함) → saveReplyDocument → eas_doc_reply insert" } }
  - { action: assert_visible, target: { ref: toast_success, description: "저장 성공 toast. workReqId 누락이면 백엔드가 400을 내므로 이 단언이 귀속 기록까지 확인해준다" } }
  - { action: screenshot, name: "04-after-save" }
