id: p2a-badge-visual
title: Phase 2a 'C' 배지 시각 확인 (문서 테스트3, work_req 1444 주이행자 gduser1)
locale: ru
login_as: gduser
on_failure: continue
precondition: >
  doc 17c8bc21 work_req 1444 mainRspnsId=1827=gduser1. 배지 span.circle-badge 렌더 여부를
  스크린샷으로 시각 확인 + assert. on_failure continue라 assert 실패해도 스크린샷 캡처됨.
steps:
  - { action: navigate, url: "/main/letter/executionInbox" }
  - { action: wait_for, target: { css: ".letter_list_wrapper .search_input", description: "목록 검색창" } }
  - { action: fill, target: { css: ".letter_list_wrapper .search_input" }, value: "문서 테스트3" }
  - { action: click, target: { css: ".letter_list_wrapper .search_form button:first-of-type", description: "검색" } }
  - { action: wait_for, target: { ref: list_item, description: "검색 결과" } }
  - { action: click, target: { ref: list_item_first, description: "문서 선택" } }
  - { action: wait_for, target: { css: ".right_top_area .commands .command", description: "이행요청 카드" } }
  - { action: screenshot, name: "badge-area-before-assert" }
  - { action: assert_visible, target: { css: ".circle-badge", description: "'C' 배지 (span.circle-badge)" } }
  - { action: screenshot, name: "badge-area-after-assert" }
