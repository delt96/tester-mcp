id: search-too-short-warn
title: 로그인 후 상단 검색에 1글자 입력 시 warn toast 표시
locale: ru
ephemeral: true
steps:
  - { action: navigate, url: "/" }
  - { action: fill, target: { css: "#userId", placeholder: "ИНН" }, value: "${secrets.tester.username}" }
  - { action: fill, target: { css: "#pswd", placeholder: "Ваш пароль" }, value: "${secrets.tester.password}" }
  - { action: click, target: { css: ".btn_login", text: "Sign In", role: "button" } }
  - { action: wait_for, target: { css: ".search_form input", placeholder: "Search" } }
  - { action: fill, target: { css: ".search_form input", placeholder: "Search" }, value: "a" }
  - { action: click, target: { css: ".btn_search", role: "button", description: "헤더 검색 버튼(돋보기 아이콘)" } }
  - { action: assert_visible, target: { text: "Пожалуйста, введите минимум 2 символа", description: "warn toast: 최소 2글자 이상 입력하세요(t10644, 우하단 노랑). ephemeral — 클릭 직후 즉시 단일 DOM 체크" } }
