id: login-success
title: 로그인 성공 → 메인 셸 진입
locale: ru
login_as: tester
on_failure: stop
defaults: { timeout_ms: 8000 }

steps:
  - action: navigate
    url: /

  - action: fill
    target: { css: "#userId", placeholder: "ИНН" }
    value: "XK4544"

  - action: fill
    target: { css: "#pswd", placeholder: "Ваш пароль" }
    value: "best1234"

  - action: click
    target: { text: "Sign In", role: button }

  - action: wait_for
    target: { css: "#v_sidebar", description: "좌측 메뉴 사이드바" }
    timeout_ms: 12000

  - action: assert_visible
    target: { css: "#v_header" }

  - action: screenshot
    name: after-login
    save: true
