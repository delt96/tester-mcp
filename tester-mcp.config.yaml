# ⚠ **반드시 localhost 를 쓸 것. 127.0.0.1 로 바꾸면 로그인이 깨진다.**
# 백엔드 CORS_ALLOWED_ORIGINS(.env)에 http://localhost:5173 만 있고 127.0.0.1 은 없다.
# 2026-08-13 실측: 127.0.0.1 로 바꿨더니 프리플라이트는 통과하는데 로그인 POST 가 CORS 로 막혀
# '로그인 화면에 그대로 머무름' 으로 나타났다 — 원인이 안 보이는 형태로 실패한다.
#
# ⚠ 다른 프로젝트의 vite 가 ::1:5173 을 잡으면 localhost 가 그쪽으로 간다(Windows 는 ::1 우선).
# eBill vite 는 :: 에 바인딩되므로 포트는 공유되지만 localhost 요청을 뺏긴다.
# 증상: 프리플라이트에서 <title> 이 다른 앱으로 나온다. → 충돌 프로세스를 끄는 것이 정답이다.
targets:
  frontend: http://localhost:5173
  backend: http://localhost:8081
preflight:
  - { url: "${targets.frontend}", expect_title: "Мыйзам документтерин" }
  - { url: "${targets.backend}/v3/api-docs", expect_status: [200, 401] }
runner:
  model: sonnet
  effort: low
  timeout_ms: 900000
  chrome_flags:
    - --chrome
    - --dangerously-skip-permissions
vars:
  billmng_cmt_doc_a: "/main/billMng/gdMng/billMngCmt/Dtl?id=EB_8eb5a0fd-372e-471f-b876-c74c9e450177&taskId=13173"
  billmng_cmt_doc_b: "/main/billMng/gdMng/billMngCmt/Dtl?id=EB_8067fc85-2385-473d-9efa-b7991bfafc22&taskId=13300"
  # LEGAL_ACTION(1900) 진행중 + result_doc 없음. 이전 EB_126d83ed/13184는 2026-07-27 완료되어 GOVERNMENT_DECISION으로 넘어감
  legalact_doc_url: "/main/billMng/legalActMng/billMng/Dtl?id=EB_3c267ff1-5ff4-48b8-aec0-1f54dd864fb6&taskId=13612"
